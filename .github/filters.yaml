# Single source of truth for CI path gating (issue #264).
#
# Every gated workflow loads this file via dorny/paths-filter, so the
# path -> check mapping lives in exactly one place. Each filter is a named
# output on a workflow's "Detect Changes" job; suite jobs run only when one
# of the filters they depend on matches.
#
# Mapping (see issue #264 for the rationale):
#   backend   -> Go fmt/vet/test, govulncheck, gosec, CodeQL(go),
#                backend Docker image build
#   frontend  -> vitest, tsc, eslint, Playwright e2e, CodeQL(js/ts),
#                frontend Docker image build
#   android   -> Android unit/lint/assemble, instrumented e2e, CodeQL(java)
#   openapi   -> the API contract: backend + frontend + Android re-test
#                (backend/** already matches it; frontend/android need it
#                explicitly because the contract lives outside those trees)
#   infra     -> the deployed artifact (all-in-one image + compose + nginx):
#                the e2e suites, since they build and run that artifact
#   workflows -> any change under .github/ (including this file) re-runs
#                everything, because a workflow change can affect any check
#
# docs/** intentionally maps to nothing here: docs changes trigger only the
# docs job (docs.yml), which is already path-filtered to docs/**.
#
# License-compliance gates (issue #361). These are narrower than the area
# filters above: they only fire when the dependency *manifest* changes, so a
# source-only edit doesn't pay for dependency resolution + a license scan.
# Gradle is deliberately absent — trivy can only enumerate Gradle licenses
# from a `gradle.lockfile` (dependency locking), which this repo doesn't emit
# yet; see license-compliance.yml.
go-manifests:
  - 'backend/go.mod'
  - 'backend/go.sum'

npm-manifests:
  - 'frontend/package.json'
  - 'frontend/yarn.lock'

# REL-05 (issue #449): the operator-visible surfaces. A PR touching one of these
# must carry an `## Upgrade notes` / `## Breaking changes` block in its
# description, or `no-changelog: <reason>` — the `changelog-note` job in
# unit-tests.yml enforces it. Deliberately narrow: schema migrations and the
# configuration surface are the changes an operator most often has to act on.
changelog-relevant:
  - 'backend/database/migrations/**'
  - 'backend/config/config.go'
  - '.env.example'

backend:
  - 'backend/**'

frontend:
  - 'frontend/**'

android:
  - 'android/**'

openapi:
  - 'backend/openapi.yaml'

infra:
  - 'Dockerfile'
  - 'docker-compose*.yml'
  - 'docker/**'
  # The build context filters (issue #349). The root .dockerignore governs
  # `COPY frontend/ .` in the all-in-one image; the split images have their
  # own. A change to any of them can change what lands in the shipped
  # artifact, so it re-runs the image builds + the container-hardening scan
  # (which now asserts editor/OS cruft is excluded).
  - '.dockerignore'
  - 'frontend/.dockerignore'
  - 'backend/.dockerignore'
  # DEPLOY-01 (issue #450): the clean-install smoke test follows the
  # documented env template and drives the running artifact, so a change to
  # either re-runs deploy-smoke.yml.
  - '.env.example'
  - 'backend/cmd/deploysmoke/**'
  - '.github/scripts/deploy-smoke-misconfig.sh'

# chaos (issue #434): the external-fault CI job's harness. Deliberately much
# narrower than backend/** — chaos tests are slow by design and must not run
# on every backend change, only when the injection mechanism itself or the
# subprocesses/seams the external tests actually drive change (plus the
# nightly schedule and manual dispatch). The in-process seams under
# services/** are exercised by the normal Go suite, not this job.
chaos:
  - '.github/workflows/chaos-tests.yml'
  - 'backend/internal/faults/**'
  - 'backend/database/sqlite_driver.go'
  - 'backend/database/backup.go'
  - 'backend/database/premigration_backup.go'
  - 'backend/database/migrate.go'
  - 'backend/cmd/dbinspect/**'
  - 'backend/cmd/migrate/**'
  - 'backend/cmd/backup/**'
  - 'backend/cmd/migratebench/**'
  # DEPLOY-03 (issue #452): the startup-interruption-kill-points job drives the
  # real server binary and probes /health/ready in its "after migrations,
  # before ready" kill point.
  - 'backend/main.go'
  - 'backend/controllers/health_controller.go'
  # Issue #498 (capacity under constrained resources): the disk-full-write /
  # disk-full-fts-rebuild / mem-limited-migration / cpu-limited-correctness
  # jobs drive these CLIs and the code paths they exercise under a real
  # resource limit.
  - 'backend/internal/diskspace/**'
  - 'backend/cmd/backfill-search-index/**'
  - 'backend/cmd/doctor/**'
  - 'backend/services/search_service.go'
  - 'backend/services/import_session.go'
  - 'backend/services/import_source.go'
  - 'backend/services/capacity_preflight.go'
  - 'backend/controllers/export_controller.go'
  - 'backend/cmd/loadsmoke/**'

# differential (issue #680): the reference-implementation differential suite
# (backend/differential, the pinned reference CLIs it shells out to, and the
# in-package iCalendar legs in caldav/services). The JSContact-calcard job
# fires only on these paths (plus the nightly schedule/manual dispatch) —
# building the Rust reference is too heavy for every backend change. The
# vCard-vobject leg runs per-PR in unit-tests.yml (python3 + pip-installed
# vobject), so it is NOT gated here.
differential:
  - 'backend/differential/**'
  - 'backend/caldav/differential_ical_test.go'
  - 'backend/services/differential_ical_test.go'

# carddav (issue #496): the real-server (Radicale) CardDAV integration job's
# gate. Deliberately much narrower than backend/** — it runs against a real
# server in Docker and is slow by design, so on a PR it only fires when the
# CardDAV machinery itself (or the harness) changes; the nightly schedule and
# manual dispatch always run it. The fast deterministic fake-based suite
# (backend/services/fake_carddav_server_test.go + carddav_roundtrip_test.go)
# runs on every backend change via the backend filter — this gate is only for
# the real-server complement.
#
# The suite stages EVERY non-soft-deleted contact in the TEST-02 canonical
# manifest onto the real servers, so a persona-only change to the fixture (or
# its Go loader) changes what the divergence register must pin — issue #852,
# where I18N-01 grew the manifest without the register and this gate could not
# see it because the fixture package was not listed here and the job is skipped
# on main pushes.
carddav:
  - '.github/workflows/carddav-e2e.yml'
  - '.github/scripts/carddav-reference/**'
  - 'backend/carddav/**'
  - 'backend/services/contact_sync_service.go'
  - 'backend/services/contact_sync_service_test.go'
  - 'backend/services/sync_conflict_service.go'
  - 'backend/services/sync_conflict_service_test.go'
  - 'backend/services/fake_carddav_server_test.go'
  - 'backend/services/carddav_roundtrip_test.go'
  - 'backend/services/carddav_radicale_integration_test.go'
  - 'backend/internal/canonicalfixture/**'
  - 'testdata/canonical-fixture/**'

# reference-clients (issue #681, TEST-09 direction 1): the scheduled job that
# drives a REAL third-party client (vdirsyncer) against OUR server. Same
# philosophy as carddav: narrow gate, slow by design, always on at night.
reference-clients:
  - '.github/workflows/reference-clients-e2e.yml'
  - '.github/scripts/carddav-reference/**'
  - 'backend/carddav/**'
  - 'backend/services/carddav_vdirsyncer_integration_test.go'
  # Same reason as the carddav filter: this suite stages the whole TEST-02
  # canonical manifest, so a persona-only fixture change must run it (#852).
  - 'backend/internal/canonicalfixture/**'
  - 'testdata/canonical-fixture/**'

workflows:
  - '.github/**'
