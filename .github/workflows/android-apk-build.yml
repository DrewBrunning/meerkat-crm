name: Android APK Build

# Build a ready-to-install APK for an arbitrary ref on demand, so Android
# changes can be handed to a tester or sideloaded without a local toolchain.
# Pick the ref and variant from the Actions tab -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build: branch, tag, or commit SHA'
        required: true
        default: 'main'
        type: string
      variant:
        description: 'Build variant (debug APKs are self-signed and installable; release needs the signing secrets)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  # The app has no local.properties, so the SDK path must come from the
  # workflow environment. GitHub-hosted ubuntu runners install the SDK at this
  # location and set ANDROID_HOME to it; state it explicitly since nothing in
  # the repo does. If the runner image ever moves it, this is the knob.
  ANDROID_HOME: /usr/local/lib/android/sdk

permissions:
  contents: read

jobs:
  build-apk:
    permissions:
      contents: read
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ref input, not the dispatch branch: github.ref on a manual run
          # points at whichever branch the workflow was launched from, which is
          # not necessarily the ref being built. Same trap as docker-publish.
          # fetch-depth 0 so an arbitrary commit SHA (not just a branch tip)
          # resolves under a shallow clone.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          # zizmor (issue #358): don't persist the GITHUB_TOKEN into the
          # checkout — nothing here pushes, and a persisted credential could
          # leak into a published artifact (the ArtiPACKED finding class).
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # Same gate as android-tests.yml, run first so a broken ref fails here
      # instead of producing a bad APK.
      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      # Release APKs are not installable without a real signature. The keystore
      # itself never enters the repo; it is stored as a base64 secret and
      # materialized on the runner. app/build.gradle.kts (M5 section 7) reads
      # the four SIGNING_* env names below, and requires all four together --
      # a partial set silently produces an unsigned (uninstallable) release
      # APK, so fail here instead of uploading one.
      - name: Materialize release keystore
        if: inputs.variant == 'release'
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release build requested but signing secrets are incomplete. Missing:$missing"
            echo "::error::All four signing secrets must be set (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD), or pick the debug variant."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "store_file=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        if: inputs.variant == 'debug'
        working-directory: android
        run: ./gradlew assembleDebug

      # REL-03 / issue #527: stamp the tester build too. Without any
      # -PMYCORRHIZAL_VERSION_* the plugin falls back to versionCode = 1 /
      # versionName = "0.1.0", so two tester builds collide and neither can be
      # installed over anything. Use the run number as the versionCode --
      # deliberately BELOW the 1000 + run_number a real release carries
      # (docs/development/release-gates.md), so a tester APK is self-consistent
      # but never shadows a published release.
      - name: Compute tester version
        if: inputs.variant == 'release'
        id: tester-version
        run: |
          short="$(git rev-parse --short HEAD)"
          {
            echo "name=0.0.0-dev+${short}"
            echo "code=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        if: inputs.variant == 'release'
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MYCORRHIZAL_VERSION_NAME: ${{ steps.tester-version.outputs.name }}
          MYCORRHIZAL_VERSION_CODE: ${{ steps.tester-version.outputs.code }}
        run: |
          ./gradlew assembleRelease \
            -PMYCORRHIZAL_VERSION_NAME="$MYCORRHIZAL_VERSION_NAME" \
            -PMYCORRHIZAL_VERSION_CODE="$MYCORRHIZAL_VERSION_CODE"

      # Artifact names cannot contain '/', so sanitize the ref in a shell step
      # (GitHub's expression language has no replace() function).
      - name: Compute artifact name
        id: artifact-name
        env:
          REF: ${{ inputs.ref }}
        run: |
          safe="${REF//\//-}"
          echo "name=mycorrhizal-crm-${{ inputs.variant }}-${safe}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: android/app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error
