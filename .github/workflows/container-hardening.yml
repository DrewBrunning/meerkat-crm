name: Container Hardening (CIS)

# Issue #362: the runtime images already do the load-bearing hardening (non-root
# appuser via PUID/PGID remap, pinned bases, HEALTHCHECK, no secrets in layers),
# but nothing in CI checks the CIS Docker Benchmark controls that keep it that
# way. A future regression — re-adding `USER root`, a setuid binary dragged in
# by an apk bump, a `privileged: true` in compose — would go unnoticed.
#
# This workflow builds the shipped all-in-one image and runs
# docker/cis-hardening.sh against it: a short, deterministic CIS-aligned
# baseline (4.1 non-root, 4.6 HEALTHCHECK, 4.8 setuid/setgid removed, 5.3 no
# privileged/cap_add, plus appuser-owned writable dirs). Non-PASS results fail
# unless accepted in docker/cis-hardening.ignore, the same ignore-list-with-
# justification shape as android/.mobsf.
#
# docker-bench-security is deliberately not used: its image checks are
# host/daemon-oriented and need --privileged + host mounts, and its 4.8 check is
# a NOTE no-op that never scans the filesystem. See docker/cis-hardening.sh.
#
# Path-gated on `infra` (Dockerfile, docker-compose*.yml, docker/**) and
# `workflows` (issue #264 pattern); the scheduled run re-scans everything so
# new rules are exercised even with no activity.
#
# Issue #376: two more trivy passes alongside the CIS scan, both cheap and
# complementary — docker-publish.yml's own trivy step only scans the *built*
# image for CVEs, at release time. These run here instead, on every PR that
# touches infra, so problems surface before a tag is ever cut:
#   - `trivy config` (misconfig) over the Dockerfiles/compose files
#     themselves — catches e.g. a missing HEALTHCHECK or an added
#     `privileged: true` at review time, not release time.
#   - `trivy fs --scanners secret` over the checked-out workspace — a CI
#     backstop for secrets that make it past the gitleaks pre-commit hook
#     (#376, .githooks/pre-commit), e.g. a contributor who hasn't opted into
#     it locally.
# Accepted findings for either go in .trivyignore (repo root), the same
# ignore-list-with-justification shape as docker/cis-hardening.ignore.
#
# Issue #578: both trivy steps are now HARD GATES (exit-code: '1'), with the
# first run's findings triaged into .trivyignore (DS-0002 — the documented
# no-USER-instruction design, see the .trivyignore entry). The scheduled run
# moved from weekly to nightly (see the cron below).
#
# Issue #578, A7 (Checkov spike): a report-only Checkov pass over the
# Dockerfiles was trialed and found NOTHING net-new — its single finding
# (CKV_DOCKER_3, "create a user for the container") is the same condition
# trivy config already flags as DS-0002 and docker/cis-hardening.sh
# documents as the intentional root-for-PUID/PGID-remap design. Checkov is
# therefore NOT added: the coverage is "trivy config + CIS script".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: '20 1 * * *' # 01:20 UTC nightly
  # Issue #543: lets release.yml / docker-publish.yml's mandatory-gate step
  # dispatch this workflow against an exact release commit instead of
  # passively waiting for check-runs a `push` to release/** never produces
  # (deliberately -- see unit-tests.yml's workflow_dispatch comment for why
  # not a `push: release/**` trigger). Not meant for ad hoc manual runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.resolve.outputs.infra }}
      workflows: ${{ steps.resolve.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # workflow_dispatch forces every area true (issue #543) -- see
      # unit-tests.yml's "Resolve gating decision" comment for why.
      - name: Resolve gating decision
        id: resolve
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            infra=true; workflows=true
          else
            infra="$INFRA_CHANGED"; workflows="$WORKFLOWS_CHANGED"
          fi
          {
            echo "infra=$infra"
            echo "workflows=$workflows"
          } | tee -a "$GITHUB_OUTPUT"
        env:
          # Boolean outputs only (the *_files outputs are the
          # attacker-influenced ones on PRs); passed as env vars so zizmor's
          # template-injection audit has nothing to flag in this workflow.
          EVENT_NAME: ${{ github.event_name }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  hardening:
    name: CIS container hardening scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the same all-in-one image e2e-tests.yml builds (context ., root
      # Dockerfile) so the scan inspects the actual shipped artifact. `load:
      # true` puts it in the local daemon where docker/cis-hardening.sh can
      # `docker inspect` / `docker create` it; the gha cache scope is shared
      # with e2e-tests.yml.
      - name: Build all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Run CIS hardening scan
        run: docker/cis-hardening.sh mycorrhizal-crm-test:latest docker/cis-hardening.ignore

      # Issue #376: misconfig scan over the Dockerfiles/compose files, not
      # the built image — deliberately independent of the "Build all-in-one
      # image" step above, so it still runs (and still catches e.g. a
      # dropped HEALTHCHECK) even if that build were ever skipped.
      # Same pin as docker-publish.yml's trivy step (pre-1.0, no stable
      # major to float on; #269 tracks it via Dependabot).
      #
      # Issue #578: hard gate (exit-code: '1'). The first rollout shipped
      # informational-only pending triage; the first real run's single
      # CRITICAL/HIGH finding (DS-0002, the documented no-USER-instruction
      # design) is now triaged into .trivyignore. limit-severities-for-sarif
      # is set so the exit code and the SARIF both respect the declared
      # severity (CRITICAL,HIGH): without it the trivy-action unsets
      # TRIVY_SEVERITY for SARIF mode and a LOW finding (DS-0026, fixed by
      # adding HEALTHCHECKs to the split Dockerfiles) hard-failed the gate.
      - name: Trivy misconfig scan (Dockerfiles/compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-config-results.sarif'
          severity: 'CRITICAL,HIGH'
          limit-severities-for-sarif: 'true'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload Trivy misconfig results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-config-results.sarif'
          category: 'trivy-config'

      # Filesystem secret scan over the checked-out workspace — a CI
      # backstop behind the gitleaks pre-commit hook, not a replacement for
      # it (see the workflow header comment above). Hard gate like the
      # misconfig step (issue #578): the committed tree is secret-clean, so
      # any finding here is a real regression and fails the job.
      - name: Trivy filesystem secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'sarif'
          output: 'trivy-secret-results.sarif'
          exit-code: '1'
          trivyignores: '.trivyignore'

      - name: Upload Trivy secret-scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-secret-results.sarif'
          category: 'trivy-secret'

  # Issue #349: the .dockerignore files must keep editor/OS cruft out of the
  # shipped images. `**/.DS_Store` (and `.idea`, `.vscode`) matters because a
  # bare `.DS_Store` only matches the context root — an untracked
  # frontend/public/.DS_Store would otherwise be copied into the web root by
  # the all-in-one's `COPY frontend/ .` and served publicly at /.DS_Store.
  # This plants that cruft in the build context and asserts neither shipped
  # image carries it. The images are inspected with `docker export | tar -t`
  # rather than `docker run find` so the check does not depend on what tools
  # the runtime image happens to contain.
  dockerignore-cruft:
    name: Build context excludes editor & OS cruft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Plant editor/OS cruft in the build context
        run: |
          set -eu
          mkdir -p frontend/public/.idea frontend/public/.vscode backend/internal/.idea
          printf 'cruft\n' | tee \
            .DS_Store \
            frontend/public/.DS_Store \
            frontend/public/.idea/workspace.xml \
            frontend/public/.vscode/settings.json \
            backend/.DS_Store \
            backend/internal/.idea/x.xml >/dev/null

      # cache-from only (no cache-to): the planted files are .dockerignore'd, so
      # the context hash is unchanged and the shared scopes still hit. Nothing
      # is written back, so this job can't poison the caches e2e-tests.yml and
      # docker-build-check.yml read.
      - name: Build all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-dockerignore-test:latest
          cache-from: type=gha,scope=combined

      - name: Build split frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: mycorrhizal-frontend-dockerignore-test:latest
          cache-from: type=gha,scope=./frontend/Dockerfile

      - name: Assert neither image carries editor/OS cruft
        run: |
          set -eu
          fail=0
          for image in mycorrhizal-dockerignore-test:latest mycorrhizal-frontend-dockerignore-test:latest; do
            cid=$(docker create "$image")
            # tar entries look like `usr/share/nginx/html/.DS_Store` or
            # `.../.idea/`; match the basename in either position.
            leaked=$(docker export "$cid" | tar -t | grep -E '(^|/)\.(DS_Store|idea|vscode)(/|$)' || true)
            docker rm "$cid" >/dev/null
            if [ -n "$leaked" ]; then
              echo "::error::$image contains editor/OS cruft that .dockerignore should have excluded:"
              echo "$leaked"
              fail=1
            else
              echo "OK: $image is free of .DS_Store / .idea / .vscode"
            fi
          done
          exit "$fail"
