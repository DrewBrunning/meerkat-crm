name: DCO

# OSPS-LE-01.01: every code contributor must assert, on every commit, that
# they are legally authorized to submit it. This project uses the Developer
# Certificate of Origin (DCO 1.1, /DCO) rather than a CLA. This check is the
# enforcement mechanism referenced by GOVERNANCE.md and
# docs/development/contributing.md: it fails a pull request unless every
# non-merge commit in it carries a well-formed `Signed-off-by:` trailer whose
# address matches the commit's author or committer.
#
# Self-contained on purpose (a bash step over `git`, no third-party action to
# pin beyond actions/checkout) to match this repo's supply-chain posture.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    name: Check commit sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          range="${BASE_SHA}..${HEAD_SHA}"
          commits="$(git rev-list --no-merges "$range")"

          if [ -z "$commits" ]; then
            echo "No non-merge commits in $range — nothing to check."
            exit 0
          fi

          fail=0
          while IFS= read -r sha; do
            author_email="$(git show -s --format='%ae' "$sha" | tr '[:upper:]' '[:lower:]')"
            committer_email="$(git show -s --format='%ce' "$sha" | tr '[:upper:]' '[:lower:]')"
            subject="$(git show -s --format='%s' "$sha")"

            # All Signed-off-by trailers on this commit, emails lower-cased.
            mapfile -t signoffs < <(
              git show -s --format='%B' "$sha" \
                | grep -iE '^Signed-off-by: .+ <[^<>@[:space:]]+@[^<>@[:space:]]+>[[:space:]]*$' \
                | sed -E 's/.*<([^<>]+)>.*/\1/' \
                | tr '[:upper:]' '[:lower:]' || true
            )

            if [ "${#signoffs[@]}" -eq 0 ]; then
              echo "::error::${sha:0:12} (\"${subject}\") has no valid 'Signed-off-by:' line."
              fail=1
              continue
            fi

            matched=0
            for email in "${signoffs[@]}"; do
              if [ "$email" = "$author_email" ] || [ "$email" = "$committer_email" ]; then
                matched=1
                break
              fi
            done

            if [ "$matched" -eq 0 ]; then
              echo "::error::${sha:0:12} (\"${subject}\") is signed off, but no 'Signed-off-by:' address matches the author (${author_email}) or committer (${committer_email})."
              fail=1
              continue
            fi

            echo "ok  ${sha:0:12}  ${subject}"
          done <<< "$commits"

          if [ "$fail" -ne 0 ]; then
            cat <<'EOF'

          One or more commits are missing a Developer Certificate of Origin sign-off.

          Every commit must end with a line of the form:

              Signed-off-by: Your Name <your@email.example>

          matching the commit's author. Add it going forward with:

              git commit -s

          Fix an existing branch in place, then force-push:

              git rebase --signoff origin/main
              git push --force-with-lease

          The full text you are certifying is in /DCO.
          EOF
            exit 1
          fi

          echo "All commits carry a valid DCO sign-off."
