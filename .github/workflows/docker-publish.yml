name: Build and Push Docker Images

on:
  push:
    tags: ['v*']

  # Manual fallback for a tag that exists but never produced a run.
  #
  # A tag trigger is the only path into this workflow, so when the push event
  # is lost the tag is published-but-unbuilt and the sole recovery is deleting
  # and re-pushing the tag. That is not hypothetical: during the GitHub Actions
  # incident of 2026-08-06, webhook delivery was throttled to ~15% and the
  # v0.3.0 tag push created no run at all -- not queued, not failed, absent.
  #
  # This takes the tag as an INPUT rather than relying on the ref this is
  # dispatched from, so it can rebuild a tag whose commit predates this change.
  # Dispatch it from a branch; it checks out the tag you name.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.3.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The tag being released. On a tag push that is the ref; on a manual run it
  # is the input. Everything below keys off this rather than github.ref_name /
  # github.sha, which on a dispatch point at the branch, not the tag.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  # REL-01 (issue #445): the release-tag format gate. This workflow publishes
  # on `push: tags: ['v*']`, so without this a malformed or stray tag
  # (the v1.7.0 class, issue #545) would build, sign, and publish a GitHub
  # Release. The pattern is the canonical one from the versioning policy
  # (docs/versioning-policy.md) and backend/internal/versionpolicy/tagpattern.go;
  # a drift test fails if this copy diverges from either. The three roots
  # below (create-release, build-android-apk, schema-fixture-gate) depend on
  # this job, so a bad tag produces no release, no images, no APK.
  validate-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate release tag against the versioning policy
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          if ! printf '%s' "$RELEASE_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Tag '$RELEASE_TAG' violates the versioning policy (vMAJOR.MINOR.PATCH, optional -rc.N). Refusing to publish. See docs/versioning-policy.md."
            exit 1
          fi
          echo "Tag '$RELEASE_TAG' is a valid release tag."

  create-release:
    runs-on: ubuntu-latest
    needs: validate-tag
    permissions:
      contents: write

    # Only on a real tag push. A manual run is for recovering images when the
    # release already exists -- re-running it would regenerate the notes and
    # append a second copy of the Docker Images block over whatever is there.
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolve the exact image references the build-and-push job publishes,
      # rather than re-deriving them differently here. Two ways the raw inputs
      # diverge from what is actually pushed (both already handled in the scan
      # job -- keep them in lockstep):
      #
      # 1. The build tags with type=semver,pattern={{version}}, whose
      #    {{version}} output drops the leading 'v' (RELEASE_TAG=v0.6.5 -> tag
      #    0.6.5). The v-prefixed tag is never pushed, so release notes quoting
      #    ghcr.io/...:v0.6.5 advertised a manifest that 404s.
      # 2. Docker references must be lowercase, but github.repository preserves
      #    the account case (DrewBrunning). metadata-action lowercases the image
      #    on the push side, so the published image is ghcr.io/drewbrunning/...
      - name: Resolve published image references
        id: images
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          tag="${RELEASE_TAG#v}"
          {
            echo "all_in_one=ghcr.io/${repo}:${tag}"
            echo "backend=ghcr.io/${repo}-backend:${tag}"
            echo "frontend=ghcr.io/${repo}-frontend:${tag}"
          } >> "$GITHUB_OUTPUT"

      # action-gh-release's append_body semantics (append to an existing
      # release on a manual recovery run) have no gh-CLI equivalent; replacing
      # it would change release behavior.
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          append_body: true
          body: |

            ## Docker Images

            All-in-one image (frontend + backend in one container):
            ```
            ${{ steps.images.outputs.all_in_one }}
            ```

            Separate images:
            ```
            ${{ steps.images.outputs.backend }}
            ${{ steps.images.outputs.frontend }}
            ```

  # Builds the same signed release APK android-apk-build.yml's manual "release"
  # variant produces, and attaches it to this tag's GitHub Release so Obtainium
  # (which polls Releases for an APK asset) picks it up as an update. No `needs`
  # on create-release, matching build-and-push below: release creation and asset
  # upload are independent operations against the same tag, so ordering doesn't
  # matter, and a signing problem here shouldn't block the Docker images.
  #
  # No `if: github.event_name == 'push'` gate (unlike create-release, which
  # excludes workflow_dispatch to avoid re-generating notes) -- this job never
  # touches the release body, so it's safe, and useful, to also run on the
  # manual "recover a lost run" dispatch described above.
  build-android-apk:
    name: Build Android release APK
    runs-on: ubuntu-latest
    # Gate on the tag being a valid release tag (REL-01, issue #445). This is
    # orthogonal to this job's deliberate lack of a `needs: create-release`
    # (issue #527): it does not order the APK against the release or the
    # images, it only refuses to build for a tag that is not a real release.
    needs: validate-tag
    timeout-minutes: 45
    permissions:
      contents: write
      # id-token: write + attestations: write let
      # actions/attest-build-provenance mint a short-lived Sigstore
      # certificate from GitHub's OIDC issuer and persist the resulting
      # attestation against this repository (see the "Attest the release APK"
      # step below). No key material to generate or store.
      id-token: write
      attestations: write
    env:
      # Same rationale as android-apk-build.yml: nothing in the repo sets this,
      # and GitHub-hosted ubuntu runners install the SDK here.
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        # zizmor cache-poisoning (issue #358): this job builds the release APK
        # from a tagged commit and the resulting artifact is published, so no
        # cached build state from earlier (PR/other-trigger) runs is restored
        # into it — a poisoned cache entry would land in a shipped artifact.
        with:
          cache-disabled: true

      # Same gate as android-apk-build.yml, run first so a broken tagged commit
      # fails here instead of shipping a bad APK on the release.
      - name: Unit + integration tests (incl. Robolectric)
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Lint
        working-directory: android
        run: ./gradlew lintDebug

      # Same as android-apk-build.yml's "Materialize release keystore" step --
      # keep them in sync if either changes.
      - name: Materialize release keystore
        id: keystore
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          missing=""
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Release build requested but signing secrets are incomplete. Missing:$missing"
            echo "::error::All four signing secrets must be set (SIGNING_KEYSTORE_BASE64, SIGNING_STORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD)."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP"
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "store_file=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_OUTPUT"

      # versionName strips the leading 'v', same idiom the scan job below uses
      # for the Docker image tag. versionCode uses the workflow's own run
      # number rather than parsing MAJOR.MINOR.PATCH out of the tag: this repo's
      # tags aren't strict semver (e.g. v0.2.0-alpha-candidate), so two
      # pre-release/final tags sharing a MAJOR.MINOR.PATCH would otherwise
      # collide on the same versionCode. GITHUB_RUN_NUMBER only ever increases
      # across runs of this workflow, so it's guaranteed strictly increasing
      # release-over-release -- which is what Android requires to accept an APK
      # as an upgrade over whatever's already installed. +1000 is headroom
      # above 1, the static versionCode every non-release build (including a
      # tester's manually sideloaded android-apk-build.yml APK) still carries.
      - name: Compute release version
        id: version
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          {
            echo "name=${RELEASE_TAG#v}"
            echo "code=$((1000 + GITHUB_RUN_NUMBER))"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble release APK
        working-directory: android
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          MYCORRHIZAL_VERSION_NAME: ${{ steps.version.outputs.name }}
          MYCORRHIZAL_VERSION_CODE: ${{ steps.version.outputs.code }}
        # Version values via env, not inline ${{ }}: the tag name is the only
        # non-computed input here, and it is maintainer-chosen (zizmor
        # template-injection).
        run: |
          ./gradlew assembleRelease \
            -PMYCORRHIZAL_VERSION_NAME="$MYCORRHIZAL_VERSION_NAME" \
            -PMYCORRHIZAL_VERSION_CODE="$MYCORRHIZAL_VERSION_CODE"

      # No body/generate_release_notes here -- this only uploads the asset, and
      # deliberately leaves whatever create-release wrote untouched regardless
      # of which job happens to finish first.
      # Same rationale as the create step: asset upload stays on the same
      # pinned action for symmetry with the append_body recovery path above.
      - name: Attach APK to GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: android/app/build/outputs/apk/release/*.apk

      # SLSA build provenance for the APK, as a GitHub-native attestation.
      # GitHub digest-matches the attested subject against the release asset
      # uploaded just above, which is what puts the "Verified" provenance badge
      # on the Release page. Verifiable downstream with
      # `gh attestation verify <apk> -R DrewBrunning/mycorrhizal-crm`.
      #
      # Note this attestation is NOT what satisfies OSSF Scorecard's
      # Signed-Releases check: it lives in GitHub's attestations API, not as a
      # release asset, and that check only inspects release asset filenames for
      # signature extensions. The cosign bundle attached as a release asset
      # below is what Scorecard sees.
      #
      # Deliberately after the upload: the release-asset association happens
      # when the attestation is created, by matching the subject digest against
      # assets that exist at that moment.
      - name: Attest the release APK (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: android/app/build/outputs/apk/release/*.apk

      # Issue #578, B3: cosign co-signature on the release APK — additive
      # ONLY. It does NOT replace the SIGNING_* keystore signing above, which
      # is what makes the APK installable; cosign gives an independent
      # keyless (Sigstore) verifier on top of the GH attestation. cosign v3
      # made the standardized bundle format (--bundle, a single file with the
      # cert + signature + transparency log entry) the default and required
      # it, retiring --output-certificate/--output-signature (they're now
      # silently ignored, so cosign wrote to an empty path and errored: "create
      # bundle file: open : no such file or directory"). Verify with
      # cosign verify-blob --bundle mycorrhizal-apk.sigstore.json <apk>.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned explicitly rather than trusting the action's own default --
          # v4.1.2's baked-in default is v3.0.6, and that specific cosign
          # release has a keyless-signing regression against a registry with
          # no OCI 1.1 Referrers API support (GHCR is one): `cosign sign`
          # prints "Generating ephemeral keys... Signing artifact..." and
          # exits 0, but never prints "tlog entry created" / "Pushing
          # signature to:" and no signature ever lands in the registry. Found
          # via v0.6.1: three images published, none verifiable
          # (`cosign verify` -> "no signatures found" on every one), while the
          # prior release's identical step -- an older cosign-installer
          # version with a different baked-in default -- signed cleanly.
          # v3.1.x's changelog lists "Sign exclusively via sigstore-go" and
          # "Require bundle output or registry upload", consistent with a
          # registry-upload fix in the keyless path. Pin the version, not the
          # installer's default, so a future installer bump can't silently
          # swap this out from under the workflow again.
          cosign-release: 'v3.1.3'

      - name: Cosign-sign the release APK (keyless, additive)
        run: |
          cosign sign-blob --yes \
            --bundle "$RUNNER_TEMP/mycorrhizal-apk.sigstore.json" \
            android/app/build/outputs/apk/release/app-release.apk

      # OSSF Scorecard's Signed-Releases check counts a release as "signed"
      # only when it has a release ASSET whose filename carries a recognized
      # signature extension (.asc, .sig, .minisig, .sigstore,
      # .sigstore.json, ...). It does not look at the attestations API, the
      # OCI registry, or workflow artifacts, and it never cryptographically
      # verifies anything -- pure filename matching. So this bundle (already
      # produced by the step above and also kept as a 30-day workflow artifact
      # below) must additionally be a release asset, or every release scores
      # as unsigned no matter what else we sign. .sigstore.json is a
      # recognized suffix. Same pinned action + zizmor annotation as the APK
      # attach above.
      - name: Attach APK cosign signature to GitHub Release # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: ${{ runner.temp }}/mycorrhizal-apk.sigstore.json

      - name: Upload APK cosign signature + certificate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-cosign-signature
          path: |
            ${{ runner.temp }}/mycorrhizal-apk.sigstore.json
          retention-days: 30

  # Issue #436 / #529: the "new release without a schema fixture fails CI"
  # gate. The upgrade test matrix (MIG-01 fixtures, internal/schemafixture) is
  # bounded by the v0.6.0 floor and requires a committed per-release schema
  # dump under backend/database/testdata/schemas/. A release tag that ships a
  # mycorrhizal-supported-series schema (squashed baseline present, version at
  # or above v0.6.0) but has no dump would publish an upgrade path that CI has
  # never tested. That must fail the publish, not be noticed later.
  schema-fixture-gate:
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      # RELEASE_TAG arrives via env (not inline ${{ }}) -- same zizmor-safe
      # pattern the rest of this workflow uses. The discriminator for "is this
      # a mycorrhizal supported-series release" is the presence of the squashed
      # migration baseline at that tag: the pre-fork upstream meerkat tags
      # (v0.7.5..v0.9.x, v1.x) use a different migration numbering and never
      # carry 000001_initial_schema.up.sql.
      - name: Verify release has a schema fixture
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -eu
          if [ ! -f backend/database/migrations/000001_initial_schema.up.sql ]; then
            echo "Not a mycorrhizal supported-series release ($RELEASE_TAG); fixture gate not applicable."
            exit 0
          fi
          floor="v0.6.0"
          oldest="$(printf '%s\n%s\n' "$floor" "$RELEASE_TAG" | sort -V | head -1)"
          if [ "$oldest" != "$floor" ]; then
            echo "Release $RELEASE_TAG is below the $floor floor; fixture gate not required (two-step upgrade applies)."
            exit 0
          fi
          # A tag whose tree predates the fixture machinery (v0.6.0..v0.6.3,
          # shipped before the schemas dir existed) is exempt -- it cannot
          # retroactively carry a fixture, and its images are only rebuilt for
          # recovery. Anything at or above the floor that DOES carry the
          # schemas dir must have its own dump.
          if [ ! -d backend/database/testdata/schemas ]; then
            echo "Release $RELEASE_TAG predates the schema-fixture machinery; gate not applicable."
            exit 0
          fi
          if [ ! -s "backend/database/testdata/schemas/${RELEASE_TAG}.sql" ]; then
            echo "::error::Release $RELEASE_TAG is at or above the supported-upgrade floor but ships no committed schema fixture."
            echo "::error::Run \`cd backend && go run ./cmd/genschema\` (or \`make gen-schema-fixtures\`) and commit the dump before tagging."
            exit 1
          fi
          echo "Schema fixture present for $RELEASE_TAG."

  build-and-push:
    runs-on: ubuntu-latest
    needs: schema-fixture-gate
    permissions:
      contents: read
      packages: write
      # id-token: write is what lets cosign and actions/attest-build-provenance
      # request a short-lived OIDC identity token from GitHub's
      # Sigstore-federated issuer for keyless signing / attestation below -- no
      # key material to generate, rotate, or store.
      id-token: write
      # Persists the SLSA attestation against this repository (see the
      # "Attest the published image" step below).
      attestations: write

    strategy:
      # One leg's failure must not cancel the others. With the default
      # (fail-fast: true), the backend leg failing on its last step killed the
      # all-in-one and frontend legs *mid-push* -- both had uploaded their
      # manifests but were cancelled before `Install cosign`, so v0.6.1 shipped
      # two images with no signature and no provenance while
      # docs/security/release-verification.md tells operators to cosign-verify
      # all three. These legs are independent images; there is nothing to fail
      # fast about.
      fail-fast: false
      matrix:
        include:
          - context: ./backend
            file: ./backend/Dockerfile
            suffix: -backend
          - context: ./frontend
            file: ./frontend/Dockerfile
            suffix: -frontend
          - context: .
            file: ./Dockerfile
            suffix: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Explicit, so a manual run builds the TAG's tree rather than
          # whatever branch it was dispatched from.
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Short SHA and an ISO-8601 build timestamp for the version stamp. The
      # full SHA is 40 chars, which is unwieldy in a UI badge and in a
      # bug report; buildinfo's own VCS fallback truncates to 12, so match it.
      #
      # Read from the checked-out tree, not from github.sha: on a manual run
      # github.sha is the dispatching branch's head, which would stamp the
      # binary and tag the image with a commit that is not the one being built.
      - name: Compute build stamp
        id: stamp
        run: |
          sha=$(git rev-parse HEAD)
          {
            echo "commit=$(echo "$sha" | cut -c1-12)"
            echo "sha7=$(echo "$sha" | cut -c1-7)"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          # Each type takes an explicit value so the derived tags come from
          # RELEASE_TAG and the checked-out commit. Left implicit, semver reads
          # the ref and sha reads github.sha -- both wrong on a manual run,
          # which would publish an image labelled with the branch it was
          # dispatched from. Same output as before on a tag push.
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=raw,value=${{ steps.stamp.outputs.sha7 }}

      # SHA-pinned (trailing comment carries the version) because Scorecard's
      # Pinned-Dependencies check flagged this line and the cosign-installer
      # one below -- both touched by this PR. Other actions in this job
      # (setup-buildx-action, login-action, metadata-action) predate this PR
      # and are still on floating major tags; that's a separate, larger
      # cleanup, not something to do piecemeal here. Dependabot's
      # github-actions ecosystem (#269) updates the SHA + comment together.
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the binary with the release it actually is. Without these the
          # Dockerfile's defaults apply and /health reports version "dev" --
          # so a published v0.2.0 image could not be told apart from any other
          # build, which is the exact problem the buildinfo package exists to
          # solve. metadata-action's `version` output is the semver derived
          # from the tag that triggered this run.
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_COMMIT=${{ steps.stamp.outputs.commit }}
            APP_BUILD_DATE=${{ steps.stamp.outputs.date }}
          # scope is required, not cosmetic, once this step runs as a matrix:
          # the GHA cache backend's default scope is shared across the whole
          # workflow, so the three legs -- running concurrently -- read and
          # write the same cache namespace. Docker's own docs call this out
          # ("cache scopes need to be unique for each [matrix] entry, otherwise
          # the cache will be overwritten"), and it is not hypothetical here:
          # v0.6.1's libssl3/libcrypto3 fix (CVE-2026-14456) landed in the
          # Dockerfile, built clean locally from a fresh no-cache clone of the
          # exact merged commit, and then the re-dispatched release build still
          # pushed the pre-fix layer -- `docker history` on the pushed image
          # showed the *old* apk add command verbatim, even though the image's
          # own OCI revision label named the commit with the fix. The
          # instruction text differed, so BuildKit's own per-layer cache key
          # should have missed; the shared, unscoped GHA namespace being
          # written and read by all three concurrent legs is what let a stale
          # layer come back as a hit anyway. Scoped per matrix leg so each
          # image's cache is isolated from the other two and from itself
          # across runs in the way the key is supposed to guarantee.
          cache-from: type=gha,scope=docker-publish${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=docker-publish${{ matrix.suffix }}
          # SBOM + SLSA provenance attestations, pushed alongside the image
          # as referrers. Trivy scans more accurately with an SBOM present,
          # and provenance lets a user verify which commit actually produced
          # the digest they pulled.
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pinned explicitly rather than trusting the action's own default --
          # v4.1.2's baked-in default is v3.0.6, and that specific cosign
          # release has a keyless-signing regression against a registry with
          # no OCI 1.1 Referrers API support (GHCR is one): `cosign sign`
          # prints "Generating ephemeral keys... Signing artifact..." and
          # exits 0, but never prints "tlog entry created" / "Pushing
          # signature to:" and no signature ever lands in the registry. Found
          # via v0.6.1: three images published, none verifiable
          # (`cosign verify` -> "no signatures found" on every one), while the
          # prior release's identical step -- an older cosign-installer
          # version with a different baked-in default -- signed cleanly.
          # v3.1.x's changelog lists "Sign exclusively via sigstore-go" and
          # "Require bundle output or registry upload", consistent with a
          # registry-upload fix in the keyless path. Pin the version, not the
          # installer's default, so a future installer bump can't silently
          # swap this out from under the workflow again.
          cosign-release: 'v3.1.3'

      # Keyless signing via cosign's ambient GitHub Actions OIDC detection --
      # no --certificate-identity/--certificate-oidc-issuer flags here, those
      # are `cosign verify` options; `cosign sign` auto-requests a Fulcio
      # cert using the id-token: write permission granted above. No key
      # material to generate or store.
      #
      # Signs the digest, not a tag: tags are mutable, the digest isn't, and
      # `steps.build.outputs.digest` is exactly what was just pushed. Reuses
      # the docker/login-action session above for registry auth.
      #
      # Lowercased the same way the scan job below resolves its image
      # reference: github.repository preserves account case (DrewBrunning),
      # but GHCR references must be lowercase.
      - name: Sign the published image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}@${DIGEST}"

      # The lowercase reference again, shared by the attest step below (GitHub
      # Actions expressions have no lower() function, so it's done in bash the
      # same way the cosign line above does it). Also emits the semver-tagged
      # reference (RELEASE_TAG with the leading 'v' stripped, matching what the
      # build actually pushed — see the scan job's identical derivation) for
      # the image SBOM generation below.
      - name: Compute lowercase image reference
        env:
          SUFFIX: ${{ matrix.suffix }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_ENV"
          echo "IMAGE_REF_TAGGED=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # GH-native SLSA build provenance, in addition to the buildkit provenance
      # (`provenance: true` on the build above) and the cosign signature just
      # created. The layers have different verifiers and consumers: buildkit
      # provenance is pulled from the registry with cosign, this one is checked
      # with `gh attestation verify oci://ghcr.io/...` and surfaces in GitHub's
      # UI. Signs the digest (`steps.build.outputs.digest`), not a tag, for the
      # same mutability reason as the cosign line. Stored in the GH attestations
      # API only -- the images already carry provenance referrers in the
      # registry from the build, so nothing extra is pushed there.
      - name: Attest the published image (build provenance)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.build.outputs.digest }}

      # Issue #578, B3: portable signed SBOMs for the released images, in
      # addition to buildkit's in-toto SBOM referrer (registry-only) and the
      # GH attestation above. syft scans the *published* image (the exact
      # artifact users pull), emits SPDX + CycloneDX, and cosign signs both
      # keyless with the same pattern as the image sign above. syft-version
      # pinned for reproducible output; per-suffix artifact names avoid matrix
      # collisions.
      - name: Generate SPDX SBOM from image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF_TAGGED }}
          format: 'spdx-json'
          output-file: 'sbom${{ matrix.suffix }}.spdx.json'
          syft-version: 'v1.51.0'
          artifact-name: 'sbom-spdx${{ matrix.suffix }}'
          upload-artifact-retention: 30
          # The action attaches SBOMs to the GitHub Release by default, which
          # needs `contents: write`; this job is deliberately `contents: read`.
          # That mismatch is what failed the backend leg on v0.6.1 -- image
          # built, signed and attested, then `Resource not accessible by
          # integration` on the release upload. Turned off rather than widening
          # the token: release-verification.md already documents the standalone
          # SBOMs as 30-day workflow artifacts, not Release assets, so this
          # makes the workflow match what the doc promises.
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM from image
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE_REF_TAGGED }}
          format: 'cyclonedx-json'
          output-file: 'sbom${{ matrix.suffix }}.cdx.json'
          syft-version: 'v1.51.0'
          artifact-name: 'sbom-cdx${{ matrix.suffix }}'
          upload-artifact-retention: 30
          # Same reason as the SPDX step above.
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Keyless blob signing, same OIDC pattern as the "Sign the published
      # image" step (the cosign-installer above is reused). cosign v3 made
      # the standardized bundle format the default and --bundle required in
      # place of --output-certificate/--output-signature (see the APK-signing
      # step above for why). The bundle rides along as an artifact so a
      # consumer can verify: cosign verify-blob --bundle <sbom>.sigstore.json <sbom>
      - name: Sign the image SBOMs (keyless)
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          cosign sign-blob --yes \
            --bundle "sbom${SUFFIX}.spdx.json.sigstore.json" \
            "sbom${SUFFIX}.spdx.json"
          cosign sign-blob --yes \
            --bundle "sbom${SUFFIX}.cdx.json.sigstore.json" \
            "sbom${SUFFIX}.cdx.json"

      - name: Upload image SBOM signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-signatures${{ matrix.suffix }}
          path: |
            sbom${{ matrix.suffix }}.spdx.json.sigstore.json
            sbom${{ matrix.suffix }}.cdx.json.sigstore.json
          retention-days: 30

  scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      # Two mismatches between the reference the build actually publishes and
      # the raw inputs the scan used to pass through:
      #
      # 1. Docker references must be lowercase, but github.repository preserves
      #    the account's case (DrewBrunning) -- metadata-action lowercases the
      #    image on the push side, so the published image is ghcr.io/drewbrunning/...
      #    Passing the raw repository here made trivy fail to parse the reference
      #    before it even contacted the registry.
      # 2. The build tags with type=semver,pattern={{version}}, whose {{version}}
      #    output drops the leading 'v' (RELEASE_TAG=v0.5.6 -> tag 0.5.6). The
      #    v-prefixed tag is never pushed, so scanning that name would 404.
      #
      # Resolve the exact name the build pushed instead of re-deriving it
      # differently in a second place.
      - name: Resolve the image reference the build actually published
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      # Pinned to an exact patch rather than floating on a major like the
      # other actions in this file: trivy-action is still pre-1.0 (0.x), so
      # there is no stable major tag to float on -- every release can be
      # breaking. This is the one deliberate exception to the "float on
      # major" policy above; #269 added trivy-action to the github-actions
      # Dependabot ecosystem, so bumps still arrive as PRs instead of
      # drifting unnoticed.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: '${{ env.IMAGE_REF }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Only gate on vulnerabilities that actually have a fix, so an
          # unfixable advisory doesn't block every release indefinitely.
          ignore-unfixed: true
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: 'trivy-results.sarif'
