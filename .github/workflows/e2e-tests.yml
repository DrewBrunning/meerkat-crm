name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 2026-08-28: the nightly run is the full web suite (all specs + loadsmoke)
  # that the PR path deliberately skips for pure backend/** changes — a
  # backend-only change that breaks a shipped *user flow* is caught here, not
  # on the PR (see docs/development/testing.md "Layers vs CI path gating").
  # Same schedule-exemption pattern as unit-tests.yml: the suite jobs run
  # unconditionally on the schedule event and are path-gated only on PR/push.
  schedule:
    - cron: '25 3 * * *' # 03:25 UTC nightly (consolidated nightly suite)

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      # Passed as env vars rather than inline ${{ }} so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "frontend=$FRONTEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "infra=$INFRA_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  e2e:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    # The web Playwright suite exercises the frontend and the deployed
    # artifact (all-in-one image + compose + nginx), and the openapi contract
    # the frontend consumes. Pure backend/** changes are covered by the Go
    # checks in unit-tests.yml and don't re-run the full e2e stack — the
    # scheduled nightly run is what re-runs the full suite with no diff to
    # gate on (same exemption pattern as unit-tests.yml).
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Wait for the app to be ready (frontend + same-origin /api on 7300)
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      # backupRestore.spec.ts (N6) compiles the backend from source and drives
      # the real `make backup` target, so the e2e host needs the same Go
      # toolchain the backend CI uses.
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: frontend
        # Runs every spec, including visual.spec.ts's screenshot regression
        # (issue #258): the committed baselines under e2e/visual.spec.ts-snapshots/
        # are compared here — any pixel diff to a pinned view fails the job.
        # Regenerate after an intentional visual change with
        # `npx playwright test visual.spec.ts --update-snapshots`.
        run: npx playwright test
        env:
          CI: true
          # Issue #556, two-tier perf split (#447): the @perf-heavy specs
          # (listPerf, networkGraphScale — seed ~150 contacts / render 15k-node
          # payloads) self-skip unless RUN_PERF_HEAVY is set, so they run on the
          # nightly full-suite schedule only, not on every PR. The light @perf
          # specs (route-stubbed) run unconditionally with the rest of the suite.
          RUN_PERF_HEAVY: ${{ github.event_name == 'schedule' && '1' || '' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results
          path: frontend/test-results/
          retention-days: 7

      # Issue #262: a short concurrent-write smoke test against the actual
      # deployed artifact (nginx + backend under supervisord), not just the
      # in-process pin (database/concurrent_write_test.go). Runs after
      # Playwright rather than alongside it so the two don't share (and
      # confuse) the same rate-limit bucket/log stream. Uses the same
      # running instance already up for Playwright above.
      - name: Run concurrency/load smoke test
        working-directory: backend
        run: go run ./cmd/loadsmoke
        env:
          LOADSMOKE_BASE_URL: http://localhost:7300

      # Issue #498, "many users on one instance" axis: ten independent
      # accounts, forty workers, so the contention is cross-user writers on
      # the shared tables and FTS indexes against the one SQLite writer — a
      # profile one user with ten times the data never produces. Same
      # pass/fail contract (no SQLITE_BUSY, no spurious 429).
      - name: Run many-users concurrency smoke test
        working-directory: backend
        run: go run ./cmd/loadsmoke
        env:
          LOADSMOKE_BASE_URL: http://localhost:7300
          LOADSMOKE_USERS: "10"
          LOADSMOKE_WORKERS: "40"
          LOADSMOKE_DURATION: "12s"

      # Issue #498: a concurrent write storm must never leave the database
      # corrupt. The check runs against a *quiesced* snapshot: stopping the
      # stack first checkpoints the WAL and closes the DB cleanly, so the file
      # copied out is a consistent point-in-time image of exactly the state the
      # load left behind. (Copying the live DB out of the still-running
      # container — .db, -wal and -shm as three separate instants — is a torn
      # snapshot: a checkpoint landing between the copies reads pages from two
      # generations and integrity_check reports corruption that is not on disk.
      # Observed twice on PR #783.) The -wal sidecar is copied if a clean stop
      # still left one; the -shm is never copied (it is a transient WAL index
      # SQLite rebuilds, and a stale copy misleads the check). This is the same
      # cold-DB assertion the chaos suite's SIGKILL jobs make after the
      # container stops.
      - name: Assert the database is not corrupt after the load
        run: |
          rm -f /tmp/loadsmoke.db /tmp/loadsmoke.db-wal /tmp/loadsmoke.db-shm
          docker compose -f docker-compose.test.yml stop
          docker compose -f docker-compose.test.yml cp mycorrhizal:/app/data/test.db /tmp/loadsmoke.db
          docker compose -f docker-compose.test.yml cp mycorrhizal:/app/data/test.db-wal /tmp/loadsmoke.db-wal || true
          result="$(sqlite3 /tmp/loadsmoke.db 'PRAGMA integrity_check')"
          echo "integrity_check: $result"
          [ "$result" = "ok" ] || { echo "::error::post-load integrity_check failed: $result"; exit 1; }

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  # Issue #274: a second, smaller pass under production-default settings. The
  # main suite above runs against docker-compose.test.yml, which deliberately
  # raises the API rate limit and enables CalDAV so a full parallel run can
  # finish — so the shipped defaults (real rate limit, CardDAV off) are never
  # exercised anywhere unless a job asks for them. This job boots the same
  # image with the prod-defaults override layered on top and runs only the
  # @prod-defaults-tagged subset (auth + contacts + dashboard), which stays
  # comfortably under the production rate limit (burst 1000, 600ms refill).
  e2e-prod-defaults:
    permissions:
      contents: read
      actions: read
    name: Run E2E Tests (production defaults)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    # Same path gating as the main e2e job: the web suite exercises the
    # frontend, the deployed artifact (all-in-one image + compose + nginx),
    # and the openapi contract the frontend consumes. Also runs nightly
    # (schedule-exempt, like the main e2e job) so the production-default
    # signal lands with the rest of the nightly full suite.
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start services (production-default config)
        run: |
          docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml up -d
          # Wait for the app to be ready (frontend + same-origin /api on 7300)
          echo "Waiting for services to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (production-default subset)
        working-directory: frontend
        # Only the @prod-defaults-tagged specs run here. A single worker keeps
        # request volume low enough to sit comfortably under the production
        # rate limit — the raised test values in docker-compose.test.yml were
        # introduced precisely because the full suite could not.
        run: npx playwright test --grep @prod-defaults --workers=1
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-prod-defaults
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-prod-defaults
          path: frontend/test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs (nginx + backend under supervisord) ==="
          docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml -f docker-compose.prod-defaults.yml down -v

  # Issue #476 (WEB-02): the service-worker upgrade suite. It is a SEPARATE
  # Playwright config (playwright.sw.config.ts) that deliberately does NOT run
  # against the docker stack: the main stack serves a single fixed build on
  # 7300, while an upgrade needs an origin that swaps between two builds
  # mid-test. Its own harness server (frontend/e2e/sw-upgrade/) takes over port
  # 7300 and stages two real `vite build` fixtures; no backend is involved. It
  # exercises Chromium AND Firefox (the wrong-MIME /service-worker.js failure
  # this suite guards was a Firefox report). First run also builds both
  # fixtures from source inside the Playwright webServer.
  #
  # Same path gating as the main e2e job (frontend/deployed-artifact/workflow
  # changes) plus the nightly full-suite run.
  e2e-sw-upgrade:
    permissions:
      contents: read
    name: Run E2E Service-Worker Upgrade Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/yarn.lock') }}

      - name: Install Playwright browsers
        working-directory: frontend
        # Both engines: service-worker behaviour genuinely differs (the
        # wrong-MIME registration failure this ticket exists because of was
        # Firefox-specific).
        run: npx playwright install --with-deps chromium firefox

      - name: Run Playwright service-worker upgrade tests
        working-directory: frontend
        run: npx playwright test -c playwright.sw.config.ts
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-sw
          path: frontend/playwright-report-sw/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-results-sw
          path: frontend/test-results-sw/
          retention-days: 7
