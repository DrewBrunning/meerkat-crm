name: Governance drift

# #508 / #513: the standing alarm for repository governance. The desired state
# of the branch/tag rulesets lives in .github/rulesets/*.json
# (docs/development/repo-governance.md is the prose). This workflow fetches the
# LIVE rulesets and the latest published release image, and reports:
#
#   - any difference between a committed ruleset and its live counterpart
#     (someone changed a protection in the UI, or forgot to apply a change to
#     the JSON), and
#   - whether the latest release image still verifies against the pinned
#     cosign identity docs/security/release-verification.md documents.
#
# Both jobs are `continue-on-error` -- a maintainer may adjust settings
# deliberately, and a diff is a review prompt, not a build failure. The output
# is the job summary.

on:
  schedule:
    - cron: '20 6 * * 1' # Monday 06:20 UTC
  pull_request:
    branches: [main]
    paths:
      - '.github/rulesets/**'
      - '.github/workflows/governance-drift.yml'
      - 'docs/security/release-verification.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruleset-drift:
    name: Committed rulesets vs live
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Diff each committed ruleset against the live one
        env:
          # Reading rulesets needs Administration:read, which GITHUB_TOKEN
          # cannot be granted. Set the optional repo secret GOVERNANCE_READ_TOKEN
          # (a fine-grained PAT with Administration: read) to enable this job;
          # without it the job records a note and moves on. See
          # docs/development/repo-governance.md.
          GH_TOKEN: ${{ secrets.GOVERNANCE_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # Fields that are instance-specific or server-generated: drop them
          # before comparing so the diff is about intent, not bookkeeping.
          # integration_id on a required check is GitHub's Actions-app id;
          # order of required checks / conditions is not semantically meaningful.
          norm='del(._comment, .id, .node_id, .created_at, .updated_at, ._links,
                    .current_user_can_bypass, .source, .source_type)
                | .rules |= (map(
                    if .type == "required_status_checks"
                    then .parameters.required_status_checks |=
                           (map(del(.integration_id)) | sort_by(.context))
                    else . end) | sort_by(.type))
                | .conditions.ref_name.include |= (. // [] | sort)
                | .conditions.ref_name.exclude |= (. // [] | sort)
                | .bypass_actors |= (. // [] | sort_by(.actor_type, .actor_id))'

          if ! live_index="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" --jq '[.[] | {name, id}]' 2>/tmp/e)"; then
            echo "::warning::cannot read repository rulesets ($(head -1 /tmp/e)). Set the GOVERNANCE_READ_TOKEN secret (fine-grained PAT, Administration: read) to enable ruleset-drift detection."
            echo "### :information_source: ruleset-drift skipped -- GOVERNANCE_READ_TOKEN not set" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          drift=0
          for f in .github/rulesets/*.json; do
            name="$(jq -r '.name' "$f")"
            id="$(printf '%s' "$live_index" | jq -r --arg n "$name" '.[] | select(.name == $n) | .id' | head -1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::warning::ruleset '$name' ($f) is not applied on the repository yet."
              { echo "### :warning: \`$name\` not applied"; echo "\`$f\` has no live counterpart. Apply it (see docs/development/repo-governance.md)."; } >> "$GITHUB_STEP_SUMMARY"
              drift=1
              continue
            fi
            jq -S "$norm" "$f" > /tmp/want.json
            gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}" | jq -S "$norm" > /tmp/live.json
            if ! diff -u /tmp/want.json /tmp/live.json > /tmp/d.txt; then
              echo "::warning::ruleset '$name' has drifted from $f"
              { echo "### :warning: \`$name\` drift"; echo '```diff'; cat /tmp/d.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
              drift=1
            else
              echo "ok: $name matches $f"
            fi
          done
          if [ "$drift" -eq 0 ]; then
            echo "### Governance drift: all rulesets match \`.github/rulesets/\`" >> "$GITHUB_STEP_SUMMARY"
          fi

  cosign-identity-probe:
    name: Latest release verifies against the pinned identity
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the latest release image with the documented identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # The exact regexp the operator doc tells people to use (#513): if a
          # real release does not verify against it, the doc is wrong or the
          # pipeline's signing identity changed -- either way, investigate.
          identity="$(grep -oE "certificate-identity-regexp '[^']+'" docs/security/release-verification.md \
                        | head -1 | sed "s/.*'\\(.*\\)'/\\1/")"
          echo "Documented identity regexp: $identity"

          tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          repo="${GITHUB_REPOSITORY,,}"
          img="ghcr.io/${repo}:${tag#v}"
          echo "Latest release: $tag -> $img"

          digest="$(cosign triangulate --type digest "$img" 2>/dev/null || true)"
          [ -z "$digest" ] && digest="$img"

          if cosign verify "$digest" \
               --certificate-identity-regexp "$identity" \
               --certificate-oidc-issuer https://token.actions.githubusercontent.com >/tmp/v.txt 2>&1; then
            echo "### Release $tag verifies against the documented cosign identity" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::cosign verify of $img failed against the documented identity regexp."
            { echo "### :warning: \`cosign verify\` mismatch for $tag"; echo '```'; cat /tmp/v.txt; echo '```';
              echo "The release may predate the pinned-identity change, or the signing identity moved. See docs/security/release-verification.md."; } >> "$GITHUB_STEP_SUMMARY"
          fi
