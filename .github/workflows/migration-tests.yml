name: Migration Tests

# Issue #437 (MIG-02): every supported historical migration path runs in CI,
# with each supported-release fixture as a NAMED matrix entry so a failure
# names the release that broke. The supported set is v0.6.0 and later (issue
# #529); the fixtures come from MIG-01 (issue #436, internal/schemafixture).
#
# Shapes that run here:
#
#   - schemafixture-suite: the whole internal/schemafixture package in one
#     non-race run with a coverprofile (uploaded to Codecov under the `backend`
#     flag). This is the catch-all + the coverage source; the named slices
#     below exist for a failure that points at the release that broke. It moved
#     here from unit-tests.yml's `rest` leg, where it was ~17 min under -race
#     and the long pole of the backend PR gate.
#   - upgrade-matrix: every supported-release fixture is migrated to the
#     CURRENT schema through database.InitDB — the exact path the server boots
#     through, not a reconstructed migration call — asserting the final version
#     and that every table's row count survived (a migration that drops a table
#     exits zero, so exit status alone proves nothing). The v0.6.0 entry IS the
#     longest supported skip (v0.6.0 -> current), run through the whole chain
#     at once. One job per release, one subtest per release.
#   - adjacent-hops: v0.6.N -> v0.6.N+1, one migration or a few — catches a
#     broken individual migration and names the exact release hop.
#   - down-direction: every migration in the chain round-trips up -> down -> up
#     against a POPULATED fixture (an empty-schema round trip proves nothing,
#     issue #530), plus the "a new migration with no .down.sql fails CI" gate.
#   - full-install-upgrade (DEPLOY-02, issue #451): the full-stack analogue —
#     a real three-piece install (database + PROFILE_PHOTO_DIR +
#     ATTACHMENTS_DIR) upgraded IN PLACE through database.InitDB, with row
#     counts + MIG-03 semantic content preserved, every attachment/photo row
#     still resolving to a real file, the #530 pre-migration backup proven to
#     exist and be restorable, and the migrated instance driven through the
#     real HTTP stack (login with a pre-existing account, FTS search, contact
#     read/edit, export). Plus the sub-floor/dirty refusals on this same
#     full-install path.
#
# Gate: the `backend` filter in .github/filters.yaml (the migration layer's
# home, per docs/development/testing.md); make the migration-tests job set
# required in branch protection — a migration change must not merge red.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  # Nightly re-run so a schema/chain change elsewhere still exercises the full
  # migration matrix even on a PR that did not touch backend/.
  schedule:
    - cron: '35 3 * * *' # 03:35 UTC nightly
  # RC-02 (#446): release.yml dispatches this against a release/* ref when
  # cutting a release candidate -- an RC-fix push to release/* does not trigger
  # push:main, so the release-tier suites are dispatched instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #264 pattern: path-gated checks — see unit-tests.yml.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only (the *_files outputs are the attacker-influenced
      # ones on PRs, and we don't use them). Passed as env vars so zizmor's
      # template-injection audit has nothing to flag.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  # The upgrade-matrix legs, one per supported release, derived from
  # internal/schemafixture.SupportedReleases (the registry) rather than a
  # hand-maintained list — a list that had already drifted (v0.6.4/v0.6.5 were
  # registered but missing here). cmd/releaselist emits the matrix JSON; a
  # release added by release.yml is covered on its first CI run with no edit
  # to this file.
  release-matrix:
    permissions:
      contents: read
    name: Enumerate supported releases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Output is a bare JSON array [{release, entry}, ...] built from the Go
      # registry — not attacker-influenced, safe to fromJSON into the matrix.
      - name: List SupportedReleases as matrix JSON
        id: list
        working-directory: backend
        run: |
          set -eu
          matrix="$(go run ./cmd/releaselist)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  # One job per supported release. Each runs only that release's subtest of
  # TestUpgradeFixtureToCurrent (issue #437 action 1: matrix over the fixtures
  # rather than one test with a loop, so a failure names the release that
  # broke).
  upgrade-matrix:
    permissions:
      contents: read
    name: Upgrade ${{ matrix.entry }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, release-matrix]
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      # One release's failure must not cancel the others — full signal from
      # every release on every run.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # `go test -run '<Test>/<release>'` exits 0 even when the release is not
      # in SupportedReleases (no subtest matches, the parent vacuously passes),
      # so the pass is asserted against the verbose output, not the exit code:
      # a release that falls out of the registry fails this job rather than
      # silently going green. The matrix release arrives via env, never inline
      # ${{ }} (zizmor).
      - name: Migrate ${{ matrix.release }} fixture to current
        working-directory: backend
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -eo pipefail
          # `|| true` on the assignment: this shell runs under -e (the step's
          # default, and set -eo pipefail below), and `var="$(cmd)"` is itself
          # the checked command — a failing `go test` (any test failure, not
          # just a crash) would abort the script AT THIS LINE, before `echo
          # "$out"` ever runs, silently discarding every line of the actual
          # failure output. Every occurrence of this pattern in this file had
          # that bug; the real pass/fail is the grep below, unaffected by the
          # `|| true`.
          out="$(go test ./internal/schemafixture/ -run "TestUpgradeFixtureToCurrent/${RELEASE}" -count=1 -v 2>&1)" || true
          echo "$out"
          if ! grep -q -- "--- PASS: TestUpgradeFixtureToCurrent/${RELEASE} " <<<"$out"; then
            echo "::error::expected subtest TestUpgradeFixtureToCurrent/${RELEASE} did not pass (release not in SupportedReleases?)"
            exit 1
          fi

  # The adjacent-hop shape (issue #437 action 2): v0.6.N -> v0.6.N+1, one
  # migration or a few. Also runs in the regular Go suite; this job is the
  # named, required gate for the migration change class.
  adjacent-hops:
    permissions:
      contents: read
    name: Adjacent release hops
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Upgrade each adjacent hop
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestUpgradeEachAdjacentHop$' -count=1 -v

  # The down direction (issue #437 action 6): every migration up -> down -> up
  # against a populated fixture, and the "no .down.sql ships" gate.
  down-direction:
    permissions:
      contents: read
    name: Down round-trips
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Every migration up → down → up on populated fixtures
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestEveryMigrationRoundTripsUpDownUp$' -count=1 -v

      - name: Every migration ships its .down.sql
        working-directory: backend
        run: go test ./database/ -run '^TestEveryMigrationHasADownMigration$' -count=1 -v

  # The whole internal/schemafixture package in one non-race run, with a
  # coverprofile. The per-release matrix / adjacent-hop / down-direction jobs
  # above run named slices of it for a failure that points at the release that
  # broke; this job is the catch-all that also covers the tests those slices
  # don't (cross-version restore, semantic-content preservation, the fixture
  # loaders, the dump/expectation unit tests) AND supplies the coverage.
  #
  # It used to run inside unit-tests.yml's `rest` leg under -race, unsharded —
  # ~17 min and the long pole of the backend PR gate. It is not on a critical
  # path here: this job runs in parallel with every other job in this workflow
  # and this workflow is not itself the backend gate's bottleneck.
  schemafixture-suite:
    permissions:
      contents: read
    name: schemafixture suite + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # No -run filter: the entire package. Non-race, matching this workflow's
      # convention (the -race concurrency signal for the one backup-consistency
      # test is an accepted loss; the database package's _txlock=immediate pin
      # keeps its own -race coverage in unit-tests.yml).
      - name: Run the full schemafixture package with coverage
        working-directory: backend
        run: go test ./internal/schemafixture/ -count=1 -covermode=atomic -coverprofile=coverage-schemafixture.out

      # Issue #294 pattern: multiple `backend`-flag uploads for one commit are
      # merged by Codecov, so this composes with unit-tests.yml's upload rather
      # than replacing it. Informational only — a failed upload must not fail
      # the migration gate (fail_ci_if_error: false).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage-schemafixture.out
          disable_search: true
          flags: backend
          fail_ci_if_error: false

  # DEPLOY-02 (issue #451): the full-stack analogue of upgrade-matrix — not
  # just the database, the whole three-piece install (database +
  # PROFILE_PHOTO_DIR + ATTACHMENTS_DIR), upgraded in place and driven through
  # the real HTTP stack.
  full-install-upgrade:
    permissions:
      contents: read
    name: Full-install upgrade (DEPLOY-02)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Three-piece install upgraded in place, backed up, and exercised
        working-directory: backend
        run: go test ./internal/schemafixture/ -run '^TestFullInstallUpgrade' -count=1 -v

  # Issue #495 (large-dataset migration test): every supported release's
  # database, populated at 134x the canonical pathological manifest (2,010
  # contacts incl. the soft-delete + vcard-uid-recreate traps at scale),
  # migrates to the current schema through database.InitDB with every table's
  # row count surviving and integrity ok; plus the interrupted-migration
  # fail-closed and backup-restore-at-scale properties.
  #
  # These tests are gated behind MYCORRHIZAL_LARGE_TESTS=1 and deliberately
  # SKIPPED in the default Go suite: at 2,010 contacts each they take minutes
  # under -race, which every PR would pay for. This named job runs them on a
  # main merge and nightly with a generous timeout — the scale signal is worth
  # waiting a day for, not worth blocking every PR on.
  large-dataset:
    permissions:
      contents: read
    name: Large-dataset migration (issue #495)
    runs-on: ubuntu-latest
    # Bumped from 60 with the PERF-02/03 at-scale steps below: they inherited
    # `go test`'s 10m default and were silently killed on every main push since
    # PERF-02 landed (#778). Those steps now pass an explicit `-timeout`, and
    # the two genuinely non-terminating ops (graph.traverse_deep/hub — a
    # walk-enumeration recursive CTE over the synthetically dense `large` graph)
    # are SkipAtScale in the registry. The data-movement step is still ~20 min
    # (duplicates.find_pairs + the 3 exporters over the full `large` fixture),
    # so 100 leaves clear headroom over both steps' `-timeout` plus the seed.
    timeout-minutes: 100
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Upgrade every supported release at scale
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # `|| true`: see "Migrate ... fixture to current" above — without it,
          # `set -e` swallows a failing run's entire output before `echo` runs.
          out="$(go test ./internal/schemafixture/ -run '^TestLargeDatasetUpgradeToCurrent$' -count=1 -v 2>&1)" || true
          echo "$out"
          # Fail-safe: the tests are env-gated, so a typo'd variable would
          # silently skip them and the job would pass vacuously. Assert the
          # longest-skip subtest actually ran and none were skipped.
          if ! grep -q -- "--- PASS: TestLargeDatasetUpgradeToCurrent/v0.6.0 " <<<"$out"; then
            echo "::error::expected large-dataset subtest v0.6.0 did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi
          if grep -q -- "--- SKIP: TestLargeDatasetUpgradeToCurrent" <<<"$out"; then
            echo "::error::large-dataset tests skipped (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi

      - name: Interrupted migration fails closed, backup restores at scale
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: >
          go test ./internal/schemafixture/ -run
          '^TestLargeDatasetInterruptedMigrationFailsClosed$|^TestLargeDatasetBackupRestoresAtScale$|^TestLargeDatasetUpgradeEmitsProgress$'
          -count=1 -v

      - name: Large-dataset generator unit tests
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # `|| true`: see "Migrate ... fixture to current" above — without it,
          # `set -e` swallows a failing run's entire output before `echo` runs.
          out="$(go test ./internal/largedata/ -count=1 -v 2>&1)" || true
          echo "$out"
          # Fail-safe: these are env-gated, so a typo'd variable would silently
          # skip them and the job would pass vacuously.
          for want in "TestScalePopulatesLargeDataset " "TestProfilePopulatesAtScale "; do
            if ! grep -q -- "--- PASS: $want" <<<"$out"; then
              echo "::error::expected large-dataset test '$want' did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
              exit 1
            fi
          done

      # PERF-01 (issue #468): the `large` benchmark profile is the biggest
      # dataset a consumer (#469/#470/#498/#453) runs against. Seeding it is a
      # ~2-minute one-off, so it is cached as a CI artifact keyed on the
      # generator inputs and only rebuilt when they change. The seed CLI path
      # (`migratebench seed --profile`) is the same generator the migration
      # test uses — asserted here by using it.
      - name: Cache the large benchmark-profile database
        id: perf01-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/perf01-large.db
          key: perf01-large-${{ hashFiles('testdata/canonical-fixture/manifest.json', 'backend/internal/largedata/**', 'backend/internal/canonicalfixture/**', 'backend/cmd/migratebench/**', 'backend/database/migrations/**') }}

      - name: Seed + verify the large benchmark profile
        working-directory: backend
        run: |
          set -eo pipefail
          db="$RUNNER_TEMP/perf01-large.db"
          if [ -f "$db" ]; then
            echo "large profile DB restored from cache ($(stat -c%s "$db") bytes) — skipping the ~2-minute seed"
          else
            time go run ./cmd/migratebench seed --profile large --db "$db"
          fi
          # Prove the cached/seeded artifact is a sound database at rest. The
          # DB-01 application-invariant guarantee for the profile generator is
          # carried by TestProfileDatasetPassesDB01 (smoke, every PR) and
          # TestProfilePopulatesAtScale (typical, this job) — same generator,
          # more rows.
          out="$(go run ./cmd/dbinspect "$db" 2>/dev/null)"
          echo "$out"
          grep -q 'integrity_check=ok' <<<"$out" || { echo "::error::large profile DB failed integrity_check"; exit 1; }
          grep -q 'dirty=false' <<<"$out" || { echo "::error::large profile DB is dirty"; exit 1; }

      # PERF-02 (issue #469): the cross-scale core-operation benchmark check —
      # smoke + typical + large. Verifies the committed baseline is a fresh
      # smoke+typical run, that no operation's growth class regresses, and that
      # query counts stay bounded out to the large profile (contact list/detail,
      # FTS, graph traversal, dashboard, cadence, reach-out, duplicate detection,
      # merge, delete cascade). The per-PR signal is the smoke-only
      # TestCoreOperationBenchmarks in the default `go test`; this heavier check
      # is gated like the rest of this job. Its WithinBudgetsAtScale / WallClockTrend
      # subtests are the PERF-04 (issue #471) release-validation budget gate:
      # absolute wall-clock ceilings at the `typical` anchor profile + the
      # >3x wall-clock trend `::warning::` (advisory, never fails).
      - name: Cross-scale core-operation benchmarks
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # Explicit -timeout: `go test`'s 10m default silently killed this job
          # on every main push since PERF-02 landed (#778). The graph.traverse_*
          # blow-ups are SkipAtScale in the registry now; the remaining `large`
          # reads still run minutes of advisory-only wall-clock (not a gate —
          # growth is classified on query count), so give them real headroom
          # under the job's timeout-minutes ceiling.
          # `|| true`: see "Migrate ... fixture to current" above — without it,
          # `set -e` swallows a failing run's entire output before `echo` runs.
          out="$(go test ./internal/perfbench/ -run '^TestBenchmarksAtScale$' -count=1 -v -timeout 30m 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated, so a typo'd variable would silently skip it
          # and the job would pass vacuously. The trailing space matters: `go
          # test -v` also prints subtest lines like
          # "--- PASS: TestBenchmarksAtScale/CommittedBaselineIsCurrent", and
          # an unanchored grep for the bare test name matches that substring
          # even when the top-level test itself FAILed (issue found alongside
          # #795/#796's continued step-10 failure — a subtest always passes,
          # so the fail-safe was silently green regardless of the real
          # result). No `/` ever follows a top-level PASS line's test name;
          # only a space does, before the "(duration)".
          if ! grep -q -- "--- PASS: TestBenchmarksAtScale " <<<"$out"; then
            echo "::error::PERF-02 cross-scale benchmarks did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
            exit 1
          fi

      # PERF-03 (issue #470): the cross-scale data-movement benchmark check —
      # smoke + typical + large for import, export (3 formats), FTS rebuild,
      # backup, restore, delete cascade and duplicate detection. Verifies the
      # committed datamovement-baseline.json is a fresh smoke+typical run, that
      # no operation's peak-memory class regresses across scales, that
      # duplicate detection stays a recorded super-linear finding, and that the
      # write probe still catches the FTS rebuild holding the write lock. Plus
      # the migration resource envelope ("for comparability" — issue #495 owns
      # migration depth). The per-PR signal is the smoke-only
      # TestDataMovementBenchmarks in the default `go test`; this heavier check
      # is gated like the rest of this job. Its WithinBudgetsAtScale subtest is
      # the PERF-04 (issue #471) release-validation gate for the absolute
      # peak-heap ceilings (the OOM boundary) at the `typical` anchor profile.
      - name: Cross-scale data-movement benchmarks
        working-directory: backend
        env:
          MYCORRHIZAL_LARGE_TESTS: "1"
        run: |
          set -eo pipefail
          # Explicit -timeout, same reason as the core-operation step above.
          # This one runs ~20 min locally — duplicates.find_pairs (a recorded
          # super-linear finding, kept in: it terminates) plus the 3 exporters
          # over the full `large` fixture — so it needs materially more than the
          # core-op step, well past `go test`'s 10m default.
          # `|| true`: see "Migrate ... fixture to current" above — without it,
          # `set -e` swallows a failing run's entire output before `echo` runs.
          # This is the step that has been failing silently for #795/#796 — this
          # fix is what actually surfaces why.
          out="$(go test ./internal/perfbench/ -run '^TestDataMovementAtScale$|^TestMigrationAtScaleResourceEnvelope$' -count=1 -v -timeout 45m 2>&1)" || true
          echo "$out"
          # Fail-safe: env-gated, so a typo'd variable would silently skip
          # these and the job would pass vacuously. Trailing space on each
          # $want, same reason as the core-operation step above: without it
          # this grep is satisfied by any passing SUBTEST line (e.g.
          # ".../CommittedBaselineIsCurrent") even when the top-level test
          # FAILed — which is exactly how this step kept reporting green
          # through #795/#796's real, ongoing failure.
          for want in "TestDataMovementAtScale " "TestMigrationAtScaleResourceEnvelope "; do
            if ! grep -q -- "--- PASS: $want" <<<"$out"; then
              echo "::error::PERF-03 check '$want' did not run (MYCORRHIZAL_LARGE_TESTS not honored?)"
              exit 1
            fi
          done
