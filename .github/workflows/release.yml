name: Release

# REL-06 (issue #499): the single automated release workflow. Cutting a release
# is one human action -- dispatch this with a version -- and everything
# downstream is automatic and gated.
#
# FINAL vs RELEASE CANDIDATE (RC-02, issue #446). The `version` input decides:
#   - `vX.Y.Z`      -> a final release, cut from `main` (the default `ref`).
#   - `vX.Y.Z-rc.N` -> a release candidate, cut from `ref: release/vX.Y.0`.
# An RC runs the SAME mandatory gate battery (steps 2-3, 8) -- "RC gates match
# release gates" (#446 action 7) -- but SKIPS the two final-release-only steps:
#   - the schema-fixture registration (steps 4-5, 7): an RC ships the same
#     schema the final will, and you never support in-place upgrade *from* an
#     RC, so the fixture is registered once, at promotion (promote-rc.yml);
#   - the ASVS/MASVS re-verification changelog-row gate (step 3): a
#     final-release obligation. The RC still runs `citecheck`.
# docker-publish.yml marks an `-rc.` tag's GitHub Release as a pre-release and
# never `make_latest`, so it stays off the in-app update check and Obtainium.
# Promotion (RC -> final, same artifact by digest) is promote-rc.yml.
# Full policy: docs/release-candidate-process.md.
#
# What a run does, in order (an RC skips 4, 5, 7 and the ASVS row of 3):
#
#   1. validates the version string, that no such tag exists, and (final only)
#      that it is not already registered in SupportedReleases;
#   2. VERIFIES REPOSITORY STATE -- the checkout is the true tip of the `ref`;
#   3. runs the MANDATORY GATE BATTERY and refuses to go further on any failure:
#        - `go run ./cmd/citecheck` (security-doc citations resolve; issue #608);
#        - `go run ./cmd/releasegatecheck` (the gate registry is coherent);
#        - every `release_gate: true` context in .github/release-gates.json is
#          green on the release commit (the deterministic version of the
#          docker-publish `release-gate` poll);
#        - the ASVS/MASVS claim carries a re-verification changelog row since
#          the previous release, or the dispatch supplied `ack_asvs_current`
#          with a reason (issue #608, asvs-l2-verification-report.md sec 8/9);
#   4. appends {Tag: <version>, Version: <highest migration in the tree>} to
#      backend/internal/schemafixture/releases.go and regenerates the schema
#      dumps (`go run ./cmd/genschema`), asserting the frozen append-only chain
#      still regenerates byte-identical and only <version>.sql is new;
#   5. runs the schemafixture + genschema + releaselist test gates;
#   6. writes release-metadata.json (version, migration version, source
#      revision, gate results) -- kept as a workflow artifact and, on a real
#      run, attached to the GitHub Release;
#   7. (final only) commits releases.go + the new dump directly to `ref` and
#      pushes it;
#   8. triggers + waits on the release-tier suites -- for a final release the
#      two that have no push:main trigger (min-version-tests, zap-dast), for an
#      RC all of them (a push to release/* triggers nothing) -- refusing to tag
#      on any observed failure;
#   9. tags <version> at the release commit (the fixture commit for a final,
#      the `ref` HEAD for an RC) and pushes the tag.
#
# The tag push is what triggers docker-publish.yml (build + sign the three
# images and the release APK, mint SBOMs + SLSA provenance + SHA256SUMS, create
# the GitHub Release). That works -- and needs NO change to docker-publish.yml's
# trigger -- only because the push here uses a GitHub App token, not
# GITHUB_TOKEN: a tag pushed with GITHUB_TOKEN cannot trigger another workflow.
# For a final release the tag points at a real commit on main (the one carrying
# the dump), so docker-publish's schema-fixture-gate passes and source<->release
# correspondence is exact; for an RC the tag points at the release-branch tip
# and schema-fixture-gate is exempt for `-rc.` tags.
#
# DRY RUN (`dry_run: true`): runs steps 1-6 -- every gate, the fixture
# regeneration, the test gates, the metadata -- but makes NO commit, push or
# tag. This is how the workflow is exercised without cutting a release (issue
# #499: "the workflow is itself tested"); the "tag exists / already registered"
# checks in step 1 are downgraded to warnings so a dry run can target the last
# shipped version.
#
# One-time setup (see docs/security/release-verification.md, "How a release is
# cut"):
#   - a GitHub App with Contents: write, installed on this repo;
#   - repo variable RELEASE_APP_ID + repo secret RELEASE_APP_PRIVATE_KEY;
#   - the App added to main's branch-protection / ruleset bypass list (and to
#     any v* tag ruleset's bypass list), so it can push the commit and the tag.
#
# Failure modes:
#   - steps 1-6 fail  -> nothing was pushed; fix and re-dispatch.
#   - (final) main pushed, step 8 or the tag push fails -> the fixture commit is
#     on main; re-push just the tag, or dispatch docker-publish.yml with its
#     `tag` input. Do NOT re-dispatch this workflow -- it refuses an existing
#     tag. (An RC pushes nothing before the tag, so this window does not exist.)
#   - tag pushed, docker-publish.yml fails -> recover the images via
#     docker-publish.yml -> Run workflow -> `tag` input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to cut, e.g. v0.6.6 or v1.0.0-rc.1'
        required: true
        type: string
      ref:
        description: 'Branch to cut from -- main for a final release, release/vX.Y.0 for an RC (RC-02, issue #446)'
        required: false
        type: string
        default: main
      dry_run:
        description: 'Run every gate + regenerate the fixture, but make no commit/push/tag'
        required: false
        type: boolean
        default: false
      ack_asvs_current:
        description: 'Reason the ASVS/MASVS claim is current without a new re-verification row (leave blank to require the row)'
        required: false
        type: string
        default: ''

# Read-only by default (StepSecurity "Restrict permissions for GITHUB_TOKEN").
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Up to ~2h: step 8 waits on the slow release-tier suites (ZAP DAST,
    # min-version matrix, the large-dataset migration job) before the tag.
    timeout-minutes: 120
    permissions:
      contents: read
      # Read the check-runs / statuses on the release commit for the mandatory
      # gate poll (step 3).
      checks: read
      statuses: read
      # actions: write is used to `gh workflow run` the two release-tier
      # suites that have no push:main trigger (step 8), and (issue #543) the
      # mandatory per-PR gate workflows when the release ref isn't main
      # (step 3) -- release/** never gets a push-triggered run of either
      # kind, deliberately (see step 3's own comment). It is scoped to this
      # one workflow_dispatch-only workflow with no PR path -- the same
      # containment argument as the App token; recorded in
      # asvs-l2-verification-report.md sec 9 (privileged-CI-credential row).
      actions: write
    steps:
      - name: Mint GitHub App token
        id: app-token
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: the minted token can push the fixture commit and
          # the tag, nothing else -- even if the App is granted more.
          permission-contents: write

      - name: Checkout the release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `main` for a final release, `release/vX.Y.0` for an RC. fetch-depth 0
          # so the "tag exists" check and the "previous release tag" lookup see
          # the full ref set. persist-credentials: false per repo convention --
          # the push step scopes its own credential (the App token) via an
          # ephemeral helper.
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          # Canonical release-tag pattern (REL-01, issue #445):
          # docs/versioning-policy.md and backend/internal/versionpolicy/tagpattern.go.
          # Kept byte-identical to the gate in docker-publish.yml; a drift test
          # (internal/versionpolicy) fails if these diverge.
          if ! printf '%s' "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::Version must match the versioning policy: vMAJOR.MINOR.PATCH with an optional -rc.N suffix (e.g. v0.6.6 or v1.0.0-rc.1). Got '$VERSION'. See docs/versioning-policy.md."
            exit 1
          fi
          # RC-02 (issue #446): classify. An `-rc.N` suffix is a release
          # candidate -- it skips the schema-fixture registration and the ASVS
          # changelog-row gate, and docker-publish marks its Release as a
          # pre-release. Everything else is identical.
          if printf '%s' "$VERSION" | grep -qE -- '-rc\.[0-9]+$'; then
            IS_RC=true
            echo "Release candidate: $VERSION (cut from ${GITHUB_REF_NAME:-the checked-out ref})."
          else
            IS_RC=false
          fi
          echo "IS_RC=$IS_RC" >> "$GITHUB_ENV"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::Tag $VERSION already exists -- allowed for a dry run (no tag is pushed)."
            else
              echo "::error::Tag $VERSION already exists; pick a version that has not shipped."
              exit 1
            fi
          fi
          # SupportedReleases only ever records final releases (you never
          # upgrade *from* an RC), so this check is final-only.
          if [ "$IS_RC" != "true" ] && grep -qF "{Tag: \"$VERSION\"," backend/internal/schemafixture/releases.go; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::warning::$VERSION is already registered in SupportedReleases -- allowed for a dry run."
            else
              echo "::error::$VERSION is already registered in SupportedReleases."
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # --- Step 2: repository state ------------------------------------------
      - name: Verify repository state
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -eu
          git fetch --quiet origin "$REF"
          head="$(git rev-parse HEAD)"
          origin="$(git rev-parse "origin/${REF}")"
          echo "Local HEAD:      $head"
          echo "origin/${REF}:  $origin"
          if [ "$head" != "$origin" ]; then
            echo "::error::Checkout is not at the tip of origin/${REF} ($head != $origin). Re-dispatch; do not cut from a stale ref."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is not clean on a fresh checkout -- refusing."
            git status --porcelain
            exit 1
          fi
          echo "RELEASE_COMMIT=$head" >> "$GITHUB_ENV"

      # --- Step 3: the mandatory gate battery ------------------------------
      - name: Gate - security-doc citations (citecheck)
        working-directory: backend
        run: |
          echo "citecheck must exit 0 for a release to proceed (issue #608)."
          go run ./cmd/citecheck

      - name: Gate - release-gate registry is coherent
        working-directory: backend
        run: go run ./cmd/releasegatecheck

      - name: Gate - mandatory checks are green on the release commit
        env:
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="$RELEASE_COMMIT"
          mapfile -t want < <(jq -r '.gates[] | select(.release_gate == true) | .check_context' .github/release-gates.json)
          if [ "${#want[@]}" -eq 0 ]; then
            echo "::error::.github/release-gates.json has no release_gate:true gates -- refusing to publish with nothing gating it."
            exit 1
          fi
          printf 'Requiring %d mandatory gate(s) green on %s:\n' "${#want[@]}" "$sha"
          printf '  - %s\n' "${want[@]}"
          want_json="$(printf '%s\n' "${want[@]}" | jq -R . | jq -s .)"

          # Issue #543: a release commit that landed on release/vX.Y.0 by
          # direct push or merge (not a PR *into* it) has NO path to ever
          # trigger these mandatory per-PR gate workflows for real --
          # confirmed on a real RC cut, every one of the 9 gates sat at
          # "missing" (never started, not merely slow) for the entire
          # deadline. Root cause: these workflows trigger on `push: branches:
          # [main]` only, never `release/**` -- deliberately, since a `push:
          # release/**` trigger would give cache-write access to anyone who
          # can push the branch, which is exactly what zizmor's
          # cache-poisoning audit exists to catch (the same reason the
          # release-tier suites below are dispatched rather than
          # push-triggered on release/**). For a final release (ref: main)
          # these already ran for real via that push:main trigger, so
          # dispatching them again would be redundant -- skip exactly when
          # the release-tier step below already does.
          mapfile -t gate_wfs < <(jq -r '.gates[] | select(.release_gate == true) | .workflow' .github/release-gates.json | sort -u)
          for wf in "${gate_wfs[@]}"; do
            if [ "$REF" = "main" ] && grep -qE '^[[:space:]]*push:' ".github/workflows/${wf}" \
               && grep -qE '^[[:space:]]*branches:.*\bmain\b' ".github/workflows/${wf}"; then
              echo "  ${wf}: push:main-triggered -- already running for ${sha}"
            else
              echo "  ${wf}: dispatching on ${REF}"
              gh workflow run "$wf" --ref "$REF"
            fi
          done

          # Dispatched runs need real time: Android (Gradle) alone has a
          # 40-minute timeout-minutes budget. 75 minutes matches the
          # release-tier suites' own deadline below -- generous headroom for
          # checks that are now genuinely running, not (as before this fix)
          # a wait for something structurally absent. Enforcement matches
          # the docker-publish release-gate job (docs/development/
          # release-gates.md): an OBSERVED failure is a hard block; the
          # deadline with something still not reporting is a loud warning
          # and the release proceeds.
          # $runs / $statuses can be several hundred KB on this repo (dozens of
          # workflows, matrix legs) -- passing that through --argjson on the
          # command line hits the exec argv-size limit (observed failing on a
          # real ubuntu-latest runner well under the 2MB getconf ARG_MAX,
          # presumably compounded by envp). Route both through files with
          # --slurpfile instead, which reads via open(2), not argv.
          runs_file="$(mktemp)"
          statuses_file="$(mktemp)"
          deadline=$(( $(date +%s) + 75 * 60 ))
          while :; do
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" --jq '.check_runs' | jq -s 'add' > "$runs_file"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${sha}/status" --jq '[.statuses[] | {name: .context, status: "completed", conclusion: (if .state=="success" then "success" elif .state=="pending" then "" else .state end)}]' | jq -s 'add' > "$statuses_file"
            state="$(jq -c -n --argjson want "$want_json" --slurpfile runs "$runs_file" --slurpfile st "$statuses_file" '
              (($runs[0] + $st[0]) | group_by(.name) | map(max_by(.started_at // "")) | map({(.name): {status, conclusion}}) | add // {}) as $latest
              | $want | map({name: ., status: ($latest[.].status // "missing"), conclusion: ($latest[.].conclusion // "")})')"

            failed="$(printf '%s' "$state" | jq -r '.[] | select(.status == "completed" and .conclusion != "" and ([.conclusion] | inside(["success","neutral","skipped"]) | not)) | .name')"
            if [ -n "$failed" ]; then
              echo "::error::Mandatory gate(s) FAILED on ${sha} -- refusing to release:"
              printf '%s' "$state" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion)"'
              exit 1
            fi
            unfinished="$(printf '%s' "$state" | jq -r '.[] | select(.status != "completed" or .conclusion == "") | .name')"
            if [ -z "$unfinished" ]; then
              echo "All ${#want[@]} mandatory gates green on ${sha}."
              echo "MANDATORY_GATES=all-green" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Mandatory-gate deadline reached with gate(s) not reporting. No FAILURE observed, so the release proceeds -- verify manually:"
              printf '%s' "$state" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion)"'
              echo "MANDATORY_GATES=deadline-warning" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Not concluded yet: $(printf '%s' "$unfinished" | tr '\n' ',' | sed 's/,$//'); re-checking in 45s..."
            sleep 45
          done

      # Final-release only: an RC re-verifies via the standing per-PR citecheck
      # (run above) and the RC practice pass; the dated changelog row is a
      # promotion-time obligation (docs/release-candidate-process.md).
      - name: Gate - ASVS/MASVS re-verification obligation
        if: ${{ env.IS_RC != 'true' }}
        env:
          ACK_ASVS_CURRENT: ${{ inputs.ack_asvs_current }}
        run: |
          set -eu
          report="docs/security/asvs-l2-verification-report.md"
          prev="$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "No previous release tag found -- treating the current report as the baseline."
            echo "ASVS_REVERIFICATION=baseline" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Previous release: $prev"
          # A re-verification pass adds a row to the report's section 10
          # changelog: `| N.N | DATE | ... |`. Require at least one such added
          # line since the previous release tag.
          added="$(git diff "${prev}..HEAD" -- "$report" | grep -cE '^\+\|[[:space:]]*[0-9]+\.[0-9]+[[:space:]]*\|' || true)"
          if [ "$added" -gt 0 ]; then
            echo "$report carries $added new changelog row(s) since $prev."
            echo "ASVS_REVERIFICATION=row-present" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "$ACK_ASVS_CURRENT" ]; then
            msg="ASVS re-verification row absent; dispatcher acknowledged current: ${ACK_ASVS_CURRENT}"
            echo "::warning::${msg}"
            echo "### :warning: ${msg}" >> "$GITHUB_STEP_SUMMARY"
            echo "ASVS_REVERIFICATION=acked: ${ACK_ASVS_CURRENT}" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::$report has no new section-10 changelog row since $prev. Re-verify per section 8 and add the row, or re-dispatch with ack_asvs_current=<reason>."
          exit 1

      # --- Step 4: register + regenerate the schema fixture ---------------
      # Final-release only. An RC ships the same schema the final will, and no
      # in-place upgrade is ever supported *from* an RC, so the fixture is
      # registered once -- at promotion (promote-rc.yml), against the final tag.
      - name: Derive the migration version from the tree
        run: |
          set -eu
          migver=""
          for f in backend/database/migrations/[0-9]*_*.up.sql; do
            [ -f "$f" ] || continue
            n="${f##*/}"; n="${n%%_*}"
            n=$((10#$n))
            if [ -z "$migver" ] || [ "$n" -gt "$migver" ]; then migver="$n"; fi
          done
          if [ -z "$migver" ]; then
            echo "::error::No migration files found under backend/database/migrations/."
            exit 1
          fi
          echo "MIGRATION_VERSION=$migver" >> "$GITHUB_ENV"
          echo "Derived migration version $migver (highest 000NNN_*.up.sql in the tree)."

      - name: Register the release
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
        run: |
          set -eu
          # Append {Tag: "$VERSION", Version: $MIGRATION_VERSION} after the last
          # existing SupportedReleases entry, preserving release order.
          python3 - "$VERSION" "$MIGRATION_VERSION" <<'PYEOF'
          import sys
          version, migver = sys.argv[1], sys.argv[2]
          path = "backend/internal/schemafixture/releases.go"
          lines = open(path).read().splitlines(keepends=True)
          idx = max(i for i, line in enumerate(lines) if line.lstrip().startswith("{Tag:"))
          lines.insert(idx + 1, f'\t{{Tag: "{version}", Version: {migver}}},\n')
          open(path, "w").writelines(lines)
          PYEOF
          gofmt -w backend/internal/schemafixture/releases.go
          git diff -- backend/internal/schemafixture/releases.go

      - name: Regenerate schema dumps
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go run ./cmd/genschema

      # The frozen-chain check: genschema rewrites every dump in place, so this
      # asserts exactly one new (untracked) file and zero modifications.
      - name: Assert only the new dump changed
        if: ${{ env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          expected="?? backend/database/testdata/schemas/${VERSION}.sql"
          actual="$(git status --porcelain -- backend/database/testdata/schemas/)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Schema dumps did not regenerate as expected."
            echo "::error::Expected exactly: ${expected}"
            echo "$actual"
            exit 1
          fi
          echo "Frozen chain holds: existing dumps byte-identical; ${VERSION}.sql is the only new file."

      - name: Verify test gates
        if: ${{ env.IS_RC != 'true' }}
        working-directory: backend
        run: go test ./internal/schemafixture/... ./cmd/genschema/... ./cmd/releaselist/...

      # --- Step 6: release metadata -------------------------------------
      - name: Emit release metadata
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          REF: ${{ inputs.ref }}
          RC: ${{ env.IS_RC }}
          DRY_RUN: ${{ inputs.dry_run }}
          MANDATORY_GATES: ${{ env.MANDATORY_GATES }}
          ASVS_REVERIFICATION: ${{ env.ASVS_REVERIFICATION }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eu
          jq -n \
            --arg version "$VERSION" \
            --argjson migration_version "$MIGRATION_VERSION" \
            --arg source_revision "$RELEASE_COMMIT" \
            --arg source_ref "$REF" \
            --argjson rc "${RC:-false}" \
            --arg workflow_run "$RUN_URL" \
            --arg cut_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson dry_run "${DRY_RUN:-false}" \
            --arg mandatory_gates "${MANDATORY_GATES:-unknown}" \
            --arg asvs_reverification "${ASVS_REVERIFICATION:-n/a (rc)}" \
            '{
              version: $version,
              rc: $rc,
              migration_version: $migration_version,
              source_revision: $source_revision,
              source_ref: $source_ref,
              workflow_run: $workflow_run,
              cut_at: $cut_at,
              dry_run: $dry_run,
              gates: {
                citecheck: "pass",
                releasegatecheck: "pass",
                mandatory_gates: $mandatory_gates,
                asvs_reverification: $asvs_reverification
              }
            }' | tee release-metadata.json
          {
            echo "### Release metadata"
            echo '```json'
            cat release-metadata.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata (workflow artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-metadata
          path: release-metadata.json
          retention-days: 90

      # Every step below is guarded `if: !inputs.dry_run`, so a dry run ends
      # here: gates passed, the fixture regenerated (final only), metadata
      # emitted, nothing written.
      - name: Dry run - summary
        if: ${{ inputs.dry_run }}
        run: |
          {
            echo "### Dry run complete"
            echo
            echo "Every gate passed and \`${VERSION}\` checked cleanly. No commit, push or tag was made."
          } >> "$GITHUB_STEP_SUMMARY"

      # --- Step 7: commit + push the fixture (final release only) ---------
      - name: Commit the schema fixture
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/internal/schemafixture/releases.go backend/database/testdata/schemas/"$VERSION".sql
          git commit -m "release: register $VERSION schema fixture (issue #529, #499)"
          echo "RELEASE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push main
        if: ${{ !inputs.dry_run && env.IS_RC != 'true' }}
        env:
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -eu
          # Ephemeral credential helper for the push only. ${GH_APP_TOKEN} must
          # expand at git-helper runtime, not when this script is parsed.
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "HEAD:refs/heads/main"

      # --- Step 8: release-tier suites, then the tag ------------------
      - name: Run + await the release-tier suites
        if: ${{ !inputs.dry_run }}
        env:
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          REF: ${{ inputs.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sha="$RELEASE_COMMIT"
          # Every release-tier gate's workflow file, from the registry.
          mapfile -t wfs < <(jq -r '.gates[] | select(.tier == "release-tier") | .workflow' .github/release-gates.json | sort -u)
          echo "Release-tier workflows: ${wfs[*]}"

          # Final release (ref = main): the "Push main" step's fixture-commit
          # push already started the push:main-triggered suites; only the two
          # dispatch-only ones (min-version-tests, zap-dast) need kicking off.
          # RC (ref = release/vX.Y.0): a push to release/* triggers nothing, so
          # every release-tier suite is dispatched against the RC ref (all have
          # workflow_dispatch). Either way we poll by commit below.
          for wf in "${wfs[@]}"; do
            if [ "$REF" = "main" ] && grep -qE '^[[:space:]]*push:' ".github/workflows/${wf}" \
               && grep -qE '^[[:space:]]*branches:.*\bmain\b' ".github/workflows/${wf}"; then
              echo "  ${wf}: push:main-triggered -- already running for ${sha}"
            else
              echo "  ${wf}: dispatching on ${REF}"
              gh workflow run "$wf" --ref "$REF"
            fi
          done

          echo "Waiting for the release-tier runs on ${sha} (75-minute deadline)..."
          deadline=$(( $(date +%s) + 75 * 60 ))
          while :; do
            pending=0 failed=0
            for wf in "${wfs[@]}"; do
              row="$(gh run list --workflow "$wf" --commit "$sha" --limit 1 \
                       --json status,conclusion,databaseId --jq '.[0] // empty')"
              if [ -z "$row" ]; then
                echo "  ${wf}: no run yet"
                pending=1
                continue
              fi
              st="$(printf '%s' "$row" | jq -r '.status')"
              cc="$(printf '%s' "$row" | jq -r '.conclusion // ""')"
              echo "  ${wf}: ${st}/${cc:-<none>}"
              if [ "$st" != "completed" ]; then
                pending=1
              elif [ "$cc" != "success" ] && [ "$cc" != "skipped" ] && [ "$cc" != "neutral" ]; then
                echo "::error::Release-tier suite ${wf} concluded ${cc} on ${sha}."
                failed=1
              fi
            done
            if [ "$failed" -eq 1 ]; then
              echo "::error::A mandatory release-tier suite failed -- the tag will not be pushed. Fix on ${REF} and re-dispatch."
              exit 1
            fi
            if [ "$pending" -eq 0 ]; then
              echo "All ${#wfs[@]} release-tier suites are green on ${sha}."
              echo "RELEASE_TIER=all-green" >> "$GITHUB_ENV"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Release-tier deadline reached with suite(s) still running. No FAILURE observed, so the tag is pushed -- verify these runs manually."
              echo "RELEASE_TIER=deadline-warning" >> "$GITHUB_ENV"
              break
            fi
            sleep 90
          done

      # GitHub App installation tokens are short-lived (~1h). The original
      # mint (step "Mint GitHub App token", above) is used for "Push main"
      # right after it, but by the time we get here the release-tier wait
      # just above can easily have run 30-75 minutes -- confirmed failing
      # for real: a v0.7.0-rc.1 cut whose release-tier wait took ~61 minutes
      # hit "remote: Invalid username or token" / "fatal: Authentication
      # failed" on the tag push, the token having expired mid-wait. Re-mint
      # immediately before the two steps that still need to push/call the
      # API, rather than reuse the now-possibly-stale original token.
      - name: Re-mint GitHub App token (release-tier wait may have expired the first one)
        id: app-token-2
        if: ${{ !inputs.dry_run }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Tag and push
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
          GH_APP_TOKEN: ${{ steps.app-token-2.outputs.token }}
        run: |
          set -eu
          # The tag points at the release commit: the fixture commit for a
          # final release (docker-publish's schema-fixture-gate checks the
          # tagged tree), or the release-branch tip for an RC (that gate is
          # exempt for `-rc.` tags). The tag push triggers docker-publish.yml.
          git tag "$VERSION" "$RELEASE_COMMIT"
          # shellcheck disable=SC2016
          helper='!f() { echo "username=x-access-token"; echo "password=${GH_APP_TOKEN}"; }; f'
          git -c credential.helper="$helper" push origin "refs/tags/${VERSION}"

      - name: Attach release metadata to the Release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          GH_TOKEN: ${{ steps.app-token-2.outputs.token }}
        run: |
          set -eu
          # docker-publish's create-release job makes the Release from the tag
          # we just pushed; give it a few minutes, then attach the metadata.
          for _ in $(seq 1 30); do
            if gh release view "$VERSION" >/dev/null 2>&1; then
              gh release upload "$VERSION" release-metadata.json --clobber
              echo "Attached release-metadata.json to $VERSION."
              exit 0
            fi
            sleep 20
          done
          echo "::warning::Release $VERSION not visible after 10 minutes; release-metadata.json is kept as a workflow artifact only. Attach it manually once docker-publish finishes."

      - name: Summary
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ env.VERSION }}
          MIGRATION_VERSION: ${{ env.MIGRATION_VERSION }}
          RC: ${{ env.IS_RC }}
          REF: ${{ inputs.ref }}
          RELEASE_COMMIT: ${{ env.RELEASE_COMMIT }}
        run: |
          set -eu
          {
            if [ "$RC" = "true" ]; then
              echo "### Release candidate ${VERSION} cut"
              echo
              echo "- cut from \`${REF}\` at \`$(git rev-parse --short "$RELEASE_COMMIT")\` -- no schema fixture (registered at promotion), no ASVS row gate"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed; \`docker-publish.yml\` marks its GitHub Release a **pre-release** (off the update check + Obtainium)"
              echo "- promote to \`${VERSION%-rc.*}\` with \`promote-rc.yml\` once the exit criteria in docs/release-candidate-process.md are met"
            else
              echo "### Release ${VERSION} cut"
              echo
              echo "- \`{Tag: \"${VERSION}\", Version: ${MIGRATION_VERSION}}\` registered in \`backend/internal/schemafixture/releases.go\`"
              echo "- \`backend/database/testdata/schemas/${VERSION}.sql\` committed to \`main\` ($(git rev-parse --short HEAD))"
              echo "- every mandatory gate + release-tier suite green (or deadline-warned) before the tag"
              echo "- tag \`${VERSION}\` pushed to that commit"
            fi
            echo
            echo "\`docker-publish.yml\` is now building + signing the images and APK, minting SBOMs + SLSA provenance + SHA256SUMS, and creating the GitHub Release:"
            echo "<https://github.com/${GITHUB_REPOSITORY}/actions/workflows/docker-publish.yml>"
          } >> "$GITHUB_STEP_SUMMARY"
