name: SAST (mobsfscan + hadolint + semgrep)

# Issue #358: the complementary security analyzers that don't fit the
# language test workflows.
#   mobsfscan — Android manifest / intent / secret / weak-crypto scanning,
#               the complement to CodeQL's Java/Kotlin taint analysis.
#   hadolint  — Dockerfile anti-pattern linting (unpinned base images/pkgs,
#               shell-form CMD/ENTRYPOINT, missing pipefail).
#   semgrep   — issue #370: custom rules (backend/.semgrep/mycorrhizal-traps.yaml)
#               encoding the CLAUDE.md backend "traps" list — domain-specific
#               bug classes (RecordFromContact bypassing the T75 merge, direct
#               Contact.CRM field mutation, unchecked Save/Updates errors,
#               auth material read from the query string) that generic
#               scanners can't see because they're conventions of this
#               codebase, not generic vulnerability patterns.
# All three are path-gated on their area (issue #264 pattern); the scheduled
# run re-scans everything so new rules are exercised even with no activity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: '55 2 * * *' # 02:55 UTC nightly (issue #578: consolidated nightly suite)

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Report gating decision
        run: |
          echo "android=$ANDROID_CHANGED"
          echo "backend=$BACKEND_CHANGED"
          echo "infra=$INFRA_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          # Boolean outputs only (the *_files outputs are the
          # attacker-influenced ones on PRs); passed as env vars so zizmor's
          # template-injection audit has nothing to flag in this workflow.
          ANDROID_CHANGED: ${{ steps.filter.outputs.android }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  mobsfscan:
    name: Android scan (mobsfscan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # security-events: write — upload the SARIF to the Security tab.
      contents: read
      security-events: write
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.android == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uvx (mobsfscan is a Python package) is not preinstalled on runners.
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Run mobsfscan -> SARIF
        working-directory: android
        # uvx installs the pinned mobsfscan (and its pinned semgrep) into an
        # ephemeral env; both versions pinned against PyPI like the Go tools
        # are pinned against the module proxy. Config: android/.mobsf — build/
        # is ignored and the deliberate findings (singleTask for the OIDC deep
        # link, debug-only loopback cleartext, sensitivity enum literal
        # "secret", Room migration DDL) are suppressed with justification.
        # Exits non-zero on ERROR findings, which is the gate; the SARIF file
        # is still written and uploaded by the next step.
        run: uvx --from 'mobsfscan==1.0.0' --with 'semgrep==1.172.0' mobsfscan --type android --sarif --output results.sarif .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: android/results.sarif
          category: mobsfscan

  hadolint:
    name: Lint Dockerfiles (hadolint ${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      matrix:
        dockerfile:
          - Dockerfile
          - backend/Dockerfile
          - frontend/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # hadolint-action v3.4.0 bundles hadolint v2.15.0. The Dockerfiles are
      # kept clean (pinned apk/base versions, JSON-form CMD/ENTRYPOINT,
      # pipefree sha512 verification) so this check gates regressions.
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}

  semgrep:
    name: CLAUDE.md trap rules (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # security-events: write — upload the SARIF to the Security tab, same
      # as mobsfscan above.
      contents: read
      security-events: write
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # Issue #370: custom rules encoding the CLAUDE.md backend "traps" list
      # (config + hand-verification fixtures: backend/.semgrep/). Pinned to
      # the same semgrep version mobsfscan already pulls in above, so the
      # toolchain has exactly one semgrep version across both jobs. Scoped to
      # backend/ — the rules are Go-specific; .semgrep/tests/ (the
      # deliberately-broken hand-verification fixtures) is a dot-directory
      # and excluded from every real scan by semgrep's own default ignores,
      # so it never reaches this gate.
      - name: Run semgrep -> SARIF
        working-directory: backend
        run: uvx --from 'semgrep==1.172.0' semgrep --config .semgrep/mycorrhizal-traps.yaml --sarif --output results.sarif --error .

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: backend/results.sarif
          category: semgrep
