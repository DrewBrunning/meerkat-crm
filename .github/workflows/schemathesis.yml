name: Schemathesis API fuzzing

# Issue #369: property-based, spec-derived API fuzzing. Schemathesis derives
# request cases from backend/openapi.yaml and attacks the *running* app (the
# all-in-one image, via docker-compose.test.yml — never a real DB) to catch
# 500s on malformed/edge input and auth-protected operations that return data
# without auth. It is the automated evidence for the API1/BOLA and API3/BOPLA
# rows in docs/security/asvs-l2.md, and complements the weekly ZAP DAST sweep
# (zap-dast.yml, issue #368) as a per-PR, path-gated check.
#
# Two Schemathesis passes run against one booted app:
#   - anonymous (no auth): not_a_server_error + ignored_auth — the ignored_auth
#     check fails when a protected operation returns 2xx without credentials;
#   - authenticated (a JWT from the login cookie): not_a_server_error only — it
#     fails when a spec-valid-but-odd body 500s (ignored_auth is omitted here
#     because it would false-flag against the real bearer token).
# The BOLA/IDOR cross-account sweep (backend/cmd/bolacheck) runs separately —
# Schemathesis has no second identity to vary resource IDs across accounts, so
# that check is the deterministic complement. backend/cmd/schemagate then
# applies the ignore-list (schemathesis/schemathesis.ignore) to the two JUnit
# reports and fails on unaccepted 5xx/auth findings.
#
# Schemathesis itself exits non-zero on any failure, including the expected
# anonymous-run 401/404s and occasional connection errors under concurrent
# load, so the scan steps do not fail on its exit code — schemagate is the gate.
#
# TEST-07 tiering follow-up (issue #435): the per-operation example budget is
# scaled by trigger like the rapid property suites. PRs keep the bounded smoke
# (3 examples/operation — enough to trip the gate tripwire), a push to main
# runs 10x deeper (30), and the nightly schedule goes deep
# (SCHEMA_MAX_EXAMPLES=100) so the search actually explores — with the job
# timeout raised accordingly, since a nightly run that takes a couple of hours
# is fine as long as it finishes before the next night's run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 4 * * *' # 04:30 UTC nightly (deep run; trails the consolidated nightly suite)
  # RC-02 (#446): release.yml dispatches this against a release/* ref when
  # cutting a release candidate (an RC-fix push to release/* does not trigger
  # push:main).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks — see unit-tests.yml for the pattern.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (see unit-tests.yml).
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "infra=$INFRA_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          INFRA_CHANGED: ${{ steps.filter.outputs.infra }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  schemathesis:
    permissions:
      contents: read
    name: Run Schemathesis fuzzing + BOLA sweep
    runs-on: ubuntu-latest
    # The 3-example PR smoke finishes in minutes; the deep nightly run
    # (SCHEMA_MAX_EXAMPLES=100) is allowed hours, mirroring unit-tests.yml's
    # tiered timeout.
    timeout-minutes: ${{ github.event_name == 'schedule' && 180 || 30 }}
    needs: changes
    # Fires when the API contract, the handlers, or the deployed artifact
    # change, and unconditionally on the nightly schedule (there is no diff to
    # gate on — the schedule is the deep pass). The openapi.yaml lives outside
    # backend/, so openapi is listed explicitly; infra covers the compose/image
    # the scan boots.
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true'

    env:
      # Per-operation example budget, tiered by trigger (rapid's RAPID_CHECKS
      # pattern, issue #435): 3 on PR/push (bounded smoke), 30 on a push to
      # main (i.e. a merge), 100 on the nightly deep run. seed 1 + deterministic
      # generation stays pinned on every tier so a finding is reproducible.
      SCHEMA_MAX_EXAMPLES: ${{ github.event_name == 'pull_request' && '3' || (github.event_name == 'push' && '30' || '100') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # bolacheck and schemagate are Go commands in the backend module; built
      # and run directly on the runner (not in the app image).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build the same all-in-one image e2e-tests.yml builds (the shipped
      # artifact), so Schemathesis attacks what actually ships.
      - name: Build all-in-one image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: mycorrhizal-crm-test:latest
          cache-from: type=gha,scope=combined
          cache-to: type=gha,scope=combined,mode=max

      - name: Start the app (throwaway test DB)
        run: |
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for the app to be ready..."
          timeout 120 bash -c 'until curl -s http://localhost:7300/health/live > /dev/null 2>&1; do sleep 2; done'
          echo "App is ready"

      # The BOLA/IDOR cross-account sweep: two throwaway users, one creates a
      # resource of each tracked entity, the other attempts GET/PUT/DELETE on
      # every one — a 2xx is a missing user_id scope, a 5xx is a crash.
      - name: Run BOLA/IDOR cross-account sweep
        working-directory: backend
        run: go run ./cmd/bolacheck
        env:
          BOLACHECK_BASE_URL: http://localhost:7300

      # Mint a session for the authenticated Schemathesis pass. The login sets
      # an httpOnly auth_token cookie (a JWT); read it out of the cookie jar and
      # use it as a bearer token — a stateless JWT cannot be revoked mid-scan the
      # way a DELETE /api-tokens/{id} would revoke a database-backed API token.
      # The token is written to the environment (never logged); the anonymous
      # pass runs without it.
      - name: Bootstrap authenticated session (register + login)
        run: |
          set -euo pipefail
          BASE="http://localhost:7300/api/v1"
          USER="sch_$(date +%s)"
          PASS='SchPassword123!'

          curl -sS -c /tmp/cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"${USER}\",\"email\":\"${USER}@example.com\",\"password\":\"${PASS}\"}" \
            "${BASE}/register"

          curl -sS -b /tmp/cookies.txt -c /tmp/cookies.txt -o /dev/null \
            -H 'Content-Type: application/json' \
            -d "{\"identifier\":\"${USER}\",\"password\":\"${PASS}\"}" \
            "${BASE}/login"

          TOKEN="$(awk '$6 == "auth_token" { print $7 }' /tmp/cookies.txt | tail -n 1)"

          test -n "${TOKEN}"
          echo "SCH_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
          echo "Authenticated session ready (JWT minted, not shown)."

      # The report dir must exist and be writable by the container (which runs
      # as root via --user 0; the dir itself is runner-owned, hence 777).
      - name: Prepare report directory
        run: mkdir -p schemathesis/report && chmod 777 schemathesis/report

      # Anonymous pass: no auth header. Catches protected operations that
      # return data without credentials (ignored_auth) and 5xx on public /
      # negative-input routes. The URL must include the spec's /api/v1 server
      # path — Schemathesis does not append it from `servers:`. `|| true`: the
      # scan exits non-zero on the expected anonymous 401/404s and occasional
      # connection errors; schemagate is the gate, not the exit code.
      - name: Run Schemathesis (anonymous)
        run: |
          docker run --rm --network host --user 0 \
            -v "$PWD/backend/openapi.yaml:/schema/openapi.yaml:ro" \
            -v "$PWD/schemathesis/report:/report" \
            ghcr.io/schemathesis/schemathesis@sha256:15aaf6cb003bfd47f27ec7cc98ad491208dd98868eadb0fcfb9329ff62d86266 \
            run /schema/openapi.yaml \
            --url http://localhost:7300/api/v1 \
            --checks not_a_server_error,ignored_auth \
            --report junit --report-dir /report --report-junit-path /report/anon.xml \
            --max-examples "$SCHEMA_MAX_EXAMPLES" --seed 1 --generation-deterministic \
            --suppress-health-check all \
            --workers 4 || true

      # Authenticated pass: catches 500s on spec-valid-but-odd input to
      # protected operations. Only not_a_server_error runs here — the
      # ignored_auth check is meaningless with valid credentials (Schemathesis's
      # negative auth cases would be "rescued" by the real bearer token and
      # false-flag), so that check lives in the anonymous pass only.
      - name: Run Schemathesis (authenticated)
        env:
          SCH_TOKEN: ${{ env.SCH_TOKEN }}
        run: |
          docker run --rm --network host --user 0 \
            -v "$PWD/backend/openapi.yaml:/schema/openapi.yaml:ro" \
            -v "$PWD/schemathesis/report:/report" \
            ghcr.io/schemathesis/schemathesis@sha256:15aaf6cb003bfd47f27ec7cc98ad491208dd98868eadb0fcfb9329ff62d86266 \
            run /schema/openapi.yaml \
            --url http://localhost:7300/api/v1 \
            -H "Authorization: Bearer ${SCH_TOKEN}" \
            --checks not_a_server_error \
            --report junit --report-dir /report --report-junit-path /report/auth.xml \
            --max-examples "$SCHEMA_MAX_EXAMPLES" --seed 1 --generation-deterministic \
            --suppress-health-check all \
            --workers 4 || true

      # The gate: apply schemathesis/schemathesis.ignore, fail on unaccepted
      # 5xx (not_a_server_error) and auth (ignored_auth) findings.
      - name: Gate on findings (schemagate)
        working-directory: backend
        run: go run ./cmd/schemagate
        env:
          SCHEMAGATE_REPORT: ../schemathesis/report/anon.xml,../schemathesis/report/auth.xml
          SCHEMAGATE_IGNORE: ../schemathesis/schemathesis.ignore

      - name: Upload Schemathesis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schemathesis-reports
          path: schemathesis/report/
          retention-days: 7

      - name: Show app logs on failure
        if: failure()
        run: |
          echo "=== Mycorrhizal logs ==="
          docker compose -f docker-compose.test.yml logs mycorrhizal

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
