name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Issue #578, B4: the nightly run is the full-length fuzz pass — the PR
  # path keeps the short smoke, the schedule event runs the same targets at
  # -fuzztime=2m (see the fuzz step's FUZZTIME env). The schedule also
  # re-runs the whole suite nightly (Tier 3 "full suite"), which is why the
  # suite jobs exempt the schedule event from path-gating below.
  schedule:
    - cron: '5 2 * * *' # 02:05 UTC nightly

permissions:
  contents: read

jobs:
  # Issue #264: path-gated checks. This job always runs and computes which
  # areas the PR/push touches (shared filters in .github/filters.yaml); the
  # suite jobs below run only when their area is affected. A suite job that
  # is skipped by its `if` conditional reports "Success", so every check here
  # can be made required in branch protection without unrelated areas
  # blocking a PR.
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      openapi: ${{ steps.filter.outputs.openapi }}
      workflows: ${{ steps.filter.outputs.workflows }}
      changelog-relevant: ${{ steps.filter.outputs.changelog-relevant }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      # Boolean outputs only, so this is safe to interpolate (the *_files
      # outputs are the attacker-influenced ones on PRs, and we don't use them).
      # Passed as env vars rather than inline ${{ }} in the run block so
      # zizmor's template-injection audit has nothing to flag even if the
      # outputs ever stopped being booleans.
      - name: Report gating decision
        run: |
          echo "backend=$BACKEND_CHANGED"
          echo "frontend=$FRONTEND_CHANGED"
          echo "openapi=$OPENAPI_CHANGED"
          echo "workflows=$WORKFLOWS_CHANGED"
          echo "changelog-relevant=$CHANGELOG_RELEVANT"
        env:
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          OPENAPI_CHANGED: ${{ steps.filter.outputs.openapi }}
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}
          CHANGELOG_RELEVANT: ${{ steps.filter.outputs.changelog-relevant }}

  # Issue #378: the security checklists (docs/security/asvs-l2.md,
  # masvs-l1.md, threat-model.md) claim a `file:line` or test citation behind
  # every control. Those citations rot when *code moves*, not when the doc is
  # edited — the 2026-08-26 ASVS L2 verification pass found 74 line ranges
  # that had drifted out from under their rows. So this job is deliberately
  # NOT path-gated: a PR that touches only backend/ or only android/ can
  # orphan a citation just as easily as one that edits the doc, and
  # .github/filters.yaml maps docs/** to nothing. It is a few seconds of pure
  # Go with no services, so running it unconditionally is cheaper than
  # reasoning about which paths could invalidate a citation.
  docs-citations:
    permissions:
      contents: read
    name: Docs & security-doc citations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Two gates in one command. (1) Every citation resolves to a real file
      # with an in-range line, every cited test identifier exists, and no row
      # is `satisfied` citing nothing. (2) No line-range citation has drifted
      # off its target beyond what docs/security/citation-drift.ignore
      # accepts — the class (1) structurally cannot see, and the one that
      # actually accumulated (74 of them before issue #378).
      #
      # `go run ./cmd/citecheck -drift` is the human tool, not a CI step: it
      # lists every candidate including the accepted ones, which is what a
      # verification pass wants and what CI does not.
      - name: Verify security-doc citations (resolution + drift)
        working-directory: backend
        run: go run ./cmd/citecheck

      # COMPAT-03 (issue #474): the dependency-advisory exception ledger
      # (docs/security/dependency-exceptions.ignore) promises a fix or a
      # renewal before an entry's `expires` date, not silence. Same job as
      # citecheck above so this runs on every backend PR and on the nightly
      # full-suite run (this workflow's `schedule` trigger), which is what
      # surfaces an expired exception even with no PR activity to trip it.
      - name: Verify dependency-exception ledger freshness
        working-directory: backend
        run: go run ./cmd/depexceptions

      # MAINT-01 (issue #490): the deprecation register (docs/deprecations.md)
      # promises that nothing on a covered surface is removed before its
      # window — at least one minor release and at least 90 days — has fully
      # elapsed, and that every deprecation is recorded before it ships. Same
      # job as the two gates above, for the same reason: it runs on every
      # backend PR and on the nightly full-suite run, so an over-window entry
      # surfaces within a day even with no PR activity.
      - name: Verify deprecation register
        working-directory: backend
        run: go run ./cmd/deprecations

      # DOC-04 (issue #489): the docs structure gate. docscheck verifies that
      # every internal link/anchor and repo-file reference in docs/ resolves,
      # that operator-facing command blocks do not assume a toolchain their
      # audience does not have, that the operator supported-versions page and
      # the DOC-03 integration-ownership page have not drifted from the code
      # (issues #486 / #488), and that deploy-smoke CI still runs the bring-up
      # command getting-started.md documents. Deliberately unconditional, like
      # citecheck above: a PR that edits only docs/ would never exercise a
      # path-gated check, and .github/filters.yaml maps docs/** to nothing.
      - name: Verify docs structure (links, commands, drift)
        working-directory: backend
        run: go run ./cmd/docscheck

      # REL-03 (issue #447): the release-gate registry. releasegatecheck
      # verifies .github/release-gates.json is well-formed, every gate names a
      # workflow file that exists, and docs/development/release-gates.md's table
      # matches the registry — so a listed gate can never lack a real job.
      # Same job/rationale as the checks above: unconditional, because a change
      # to a workflow file or the doc must exercise it and .github/** doesn't
      # map here.
      - name: Verify release-gate registry
        working-directory: backend
        run: go run ./cmd/releasegatecheck

  # REL-05 (issue #449): a PR that touches an operator-visible surface
  # (`changelog-relevant` in .github/filters.yaml — schema migrations, the
  # config surface, .env.example) must carry an `## Upgrade notes` /
  # `## Breaking changes` block in its description, so cmd/releasenotes can
  # harvest it into the release notes, or an explicit `no-changelog: <reason>`.
  # Pull-request only (there is no PR body on a push); a skipped job reports
  # success so it can be a required check. Policy: docs/changelog-policy.md.
  changelog-note:
    name: Changelog note for operator-visible change
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.changelog-relevant == 'true'
    permissions:
      contents: read
    steps:
      - name: Require an Upgrade notes block or an explicit opt-out
        env:
          # Via env, never inline ${{ }} — the PR body is attacker-controlled
          # (zizmor template-injection).
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -eu
          if printf '%s' "$PR_BODY" | grep -qiE '^#{1,6}[[:space:]]+(upgrade notes|breaking changes)[[:space:]]*$'; then
            echo "Found an Upgrade notes / Breaking changes block."
            exit 0
          fi
          if printf '%s' "$PR_BODY" | grep -qiE 'no-changelog:[[:space:]]*\S'; then
            echo "Found a 'no-changelog: <reason>' opt-out."
            exit 0
          fi
          echo "::error::This PR changes an operator-visible surface (a migration, the config surface, or .env.example) but its description has no '## Upgrade notes' block and no 'no-changelog: <reason>' line. See docs/changelog-policy.md."
          exit 1

  # Issue #630: the backend test suite is split into parallel legs
  # (`backend-tests` matrix) so `controllers` and `services` — each ~20 min
  # under -race + -covermode=atomic on GitHub's shared runners, the latter
  # tripping `go test`'s per-package -timeout and dragging unrelated tests
  # into the JUnit report as bystander "failures" — get their own runner and
  # their own wall-clock instead of serializing inside one job. Neither
  # package has any t.Parallel yet (issue #774), so its tests run serially on
  # one core no matter the runner size; the only lever left here is to cut
  # each in half by test-name regex. So `controllers` and `services` are
  # sharded into `-1` (`^(Test|Fuzz)[A-G]`) and `-2` (`^(Test|Fuzz)[H-Z]`)
  # legs — five legs total. Split by test count it lands ~1.5:1 (the heavy
  # half is ~55–58% of the package), so each leg is roughly half the old
  # single one; `rest` is every other package. The "Verify shard split is
  # exhaustive" step below fails the leg if a name ever falls outside A–Z, so
  # a shard can never silently drop a test.
  #
  # `internal/schemafixture` is deliberately NOT in any leg here — its
  # migration-hop / cross-version-restore suite (~17 min under -race, the old
  # `rest` long pole) is owned by migration-tests.yml, which already ran most
  # of it per-release on every backend PR. That workflow gained a
  # coverage-bearing full-package run so the `backend` Codecov flag still sees
  # those lines.
  # The non-test checks (fmt/vet, benchmarks, fuzz, govulncheck,
  # golangci-lint) run once in `backend-checks`. The `backend` job below is
  # kept as a thin gate + coverage/JUnit aggregator so the required status
  # check keeps the name "Backend (Go)" (branch protection references it
  # verbatim) and downstream (Codecov, test-report.yml) still sees one
  # combined upload.
  #
  # Issue #251 history: -race + -covermode=atomic stack their per-access /
  # per-block instrumentation, and every persistence test re-ran the full
  # real-schema migration set (database.InitDB) — issue #632 replaced that
  # with a per-package migrated-template copy (internal/dbtest), which is the
  # other half of this speed-up. PR #285 first bumped this job 15 -> 30 min;
  # the split plus the -timeout below (20 -> 25 min per leg) is the durable
  # fix, each leg now owning a whole runner.
  backend-checks:
    permissions:
      contents: read
    name: Backend checks (fmt/vet/bench/fuzz/lint)
    runs-on: ubuntu-latest
    # Issue #712: the nightly fuzz step is 8 targets at -fuzztime=2m (~16m),
    # and the golang/go#75804 hardening retries a deadline-boundary flake
    # once (up to +2m per target), so the schedule ceiling gets real headroom
    # — same trigger-scaled pattern as backend-tests below. PRs stay at the
    # tight 20m.
    timeout-minutes: ${{ github.event_name == 'schedule' && 40 || 20 }}
    needs: changes
    # Scheduled runs must always run the full suite (there is no diff to gate
    # on) — same exemption pattern as zizmor.yml/sast.yml.
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting and vet
        working-directory: backend
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
          go vet ./...

      - name: Run benchmarks (issue #261)
        working-directory: backend
        # Issue #261: exercise every benchmark body once. The regression gate
        # is the query-count assertions shipped alongside them (the
        # *_QueryCountIsBounded tests fail deterministically when a hot path
        # gains an N+1 or the reach-out job goes superlinear) — NOT wall-clock
        # time, which varies across CI hardware. -benchtime=1x keeps this
        # cheap while still compiling and executing the benchmark paths.
        run: go test -run '^$' -bench . -benchtime=1x ./...

      # Issue #265 (extended by #376 to the other hostile-input parsers): a
      # short, time-boxed native Go fuzz run per target, seeded from the
      # golden fixtures (docs/golden-fixtures — the RFC oracle) or, for the
      # CalDAV/CSV targets, inline fixtures mirroring their existing
      # httptest-based tests. go test -fuzz only accepts one target (a
      # regexp matching exactly one Fuzz function) per invocation, hence one
      # step per target. A found crash writes a regression file under
      # <pkg>/testdata/fuzz/ and fails the step — that's not hypothetical:
      # FuzzExtractICalEvents found a real go-ical decoder panic on its
      # first-ever run (fixed by calendar_sync_service.go's
      # decodeCalendarSafely, see that function's doc comment). -fuzztime is
      # deliberately short (a few seconds each) to keep CI cost low — see
      # each Fuzz function's own doc comment for the longer local run this
      # is not a substitute for.
      # Issue #712: the fuzz loop lives in a committed, tested script
      # (.github/scripts/run-fuzz-targets.sh) rather than inline, because it
      # is hardened against the golang/go#75804 deadline-boundary race — a
      # clean -fuzztime run can intermittently be reported as "context
      # deadline exceeded" when the budget expires mid-execution (fixed
      # upstream in go1.27 CL 804900; not backported to the 1.26 toolchain
      # this repo runs). The script retries a deadline-only failure once and
      # soft-fails only if it repeats; a real crash ("Failing input written
      # to", or a seed replay of a previously-found crash) still fails the
      # step. Its behaviour is pinned by
      # .github/scripts/tests/run-fuzz-targets.test.sh (run in
      # actionlint.yml).
      - name: Run fuzz targets (issues #265, #376, #712)
        working-directory: backend
        # Issue #578, B4: the PR/push path is the short smoke (15s — the
        # regression tripwire); the nightly schedule event runs the same
        # targets at 2m each. -fuzztime comes in via env, never inline.
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '2m' || '15s' }}
        run: bash "$GITHUB_WORKSPACE/.github/scripts/run-fuzz-targets.sh"

      - name: Vulnerability scan (govulncheck)
        working-directory: backend
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Issue #358: golangci-lint (config: backend/.golangci.yml) is the
      # complementary fast analyzer to CodeQL, replacing the old standalone
      # gosec step. Enables the security-focused set (gosec + bodyclose +
      # govet); the standard correctness layer and noctx are deliberately
      # deferred there — see the config's comments for the rationale (the
      # repo documents best-effort unhandled errors as accepted, and the
      # HTTP/DB layers don't thread contexts yet). Run via `go run ...@version`
      # rather than the golangci-lint-action so the binary comes from the Go
      # module proxy like every other Go tool here, not a raw release download.
      - name: Lint (golangci-lint gosec + bodyclose)
        working-directory: backend
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...

  backend-tests:
    permissions:
      contents: read
    name: Backend tests (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # Each leg owns a whole runner now. The ceiling is scaled by trigger: PRs
    # and main merges stay at the tight 35 min (a hung job must not eat a
    # runner), while the nightly schedule is allowed to run for hours — that
    # is where the deep generative/property pass lives (see the RAPID_CHECKS
    # notes on the test steps below), and it only needs to finish before the
    # next night's run starts.
    #
    # Where the speed levers stand after issues #630 / #632 / #774:
    #  - `runs-on` is the standard 4-vCPU `ubuntu-latest`; no paid larger
    #    runners. If `database` / `property` / `services` legs ever regrow past
    #    ~8 min, moving *those* legs to a larger runner label and raising
    #    `-parallel` to match is the next lever — but only after t.Parallel
    #    (#774): a bigger runner amplifies nothing while a package's tests run
    #    serially on one core.
    #  - `-p` and `-parallel` both already default to GOMAXPROCS = 4 here, so
    #    there is nothing to raise without a bigger runner.
    #  - The two passes below (gate `-race`, then a separate no-rerun
    #    `-coverprofile` pass) are deliberate and must not be collapsed:
    #    `gotestsum --rerun-fails` truncates the coverprofile on its rerun
    #    invocation (#639), so coverage has to come from a pass with no rerun.
    timeout-minutes: ${{ github.event_name == 'schedule' && 240 || 35 }}
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'
    strategy:
      # One slow/failing leg must not cancel the others — we want full signal
      # from every leg on every run.
      fail-fast: false
      matrix:
        # controllers-1/-2 and services-1/-2 are the same package sharded by
        # test-name regex (see the Resolve step). `database` is the migration /
        # persistence package — the next-heaviest after schemafixture, so it
        # gets its own leg instead of hiding in `rest`. `property` is the
        # rapid/large-data generative packages. `rest` is every other package.
        leg: [controllers-1, controllers-2, services-1, services-2, database, property, rest]

    env:
      # TEST-07 (#435): the property-based tests' iteration budget, tiered by
      # trigger. rapid reads RAPID_CHECKS natively. PRs get a bounded smoke
      # (200) that trips the regression tripwire cheaply; a push to main
      # (i.e. a merge) runs 5x deeper (1000); the nightly schedule is the
      # deep search (8000) that surfaces the shape bugs the other suites
      # cannot — and the only constraint on it is finishing before the next
      # night's run. The companion GO_TEST_TIMEOUT scales the per-test ceiling
      # so a deep nightly run is not killed by the PR-sized 25m timeout.
      RAPID_CHECKS: ${{ github.event_name == 'pull_request' && '200' || (github.event_name == 'push' && '1000' || '8000') }}
      GO_TEST_TIMEOUT: ${{ github.event_name == 'schedule' && '200m' || '25m' }}
      # The pre-rapid seeded property tests (services/address_normalization
      # _property_test.go) get the same tiered treatment: 200 iterations on
      # PR, 2000 on a merge, 10000 on the nightly deep run.
      ADDRESS_PROPERTY_ITERATIONS: ${{ github.event_name == 'pull_request' && '200' || (github.event_name == 'push' && '2000' || '10000') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Roll the -race build cache forward. actions/setup-go already restores
      # ~/.cache/go-build, but it keys purely on go.sum and does NOT re-save on
      # a hit — so the race-instrumented stdlib+deps objects are frozen at
      # whatever first populated that key, and every run after a go.sum bump
      # recompiles the world (~4-5 min on a cold cache). A unique `key` per run
      # + a prefix `restore-keys` fallback makes this cache restore the newest
      # prior snapshot and save an updated one every run, so incremental
      # compiles from source changes are carried between runs.
      - name: Cache Go race build objects
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-build-race-${{ runner.os }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-${{ github.run_id }}
          restore-keys: |
            go-build-race-${{ runner.os }}-${{ hashFiles('backend/go.mod', 'backend/go.sum') }}-

      # Issue #680 (TEST-08): the vCard-vobject differential tests live in
      # backend/differential, which is in the `rest` leg — so only that leg
      # needs the pinned reference (vobject 0.9.9). Installed with
      # --require-hashes from the committed requirements file (zizmor audits
      # pip installs for unpinned supply-chain refs).
      - name: Install vobject reference (TEST-08 differential)
        if: matrix.leg == 'rest'
        run: python3 -m pip install --quiet --break-system-packages --require-hashes -r backend/differential/reference/vobject/requirements.txt

      # Each leg resolves to a package list plus an optional -run regex:
      #   controllers-1 / services-1 → ./<pkg>/...  -run '^(Test|Fuzz)[A-G]'
      #   controllers-2 / services-2 → ./<pkg>/...  -run '^(Test|Fuzz)[H-Z]'
      #   database                   → ./database/...            no -run filter
      #   property                   → the rapid/large-data pkgs no -run filter
      #   rest                       → every OTHER package        no -run filter
      # `rest`'s exclusion grep is anchored (`$`) so a future subpackage of an
      # excluded tree lands in `rest` rather than being dropped from every leg.
      # It excludes: controllers/services (their own sharded legs);
      # internal/schemafixture (owned by migration-tests.yml — ~17 min under
      # -race here for zero extra signal); database and the property packages
      # (their own legs below). The [A-G]/[H-Z] shards are total only while
      # every Test/Fuzz name starts with an uppercase letter — the next step
      # enforces that so a shard can never silently skip a test.
      - name: Resolve packages for this leg
        id: pkgs
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            controllers-1) list="./controllers/..."; run='^(Test|Fuzz)[A-G]' ;;
            controllers-2) list="./controllers/..."; run='^(Test|Fuzz)[H-Z]' ;;
            services-1)    list="./services/...";    run='^(Test|Fuzz)[A-G]' ;;
            services-2)    list="./services/...";    run='^(Test|Fuzz)[H-Z]' ;;
            database)      list="./database/...";    run='' ;;
            property)      list="./internal/propertytest/... ./internal/largedata/... ./internal/contactgen/..."; run='' ;;
            rest)          list="$(go list ./... | grep -vE 'mycorrhizal/(controllers|services|database|internal/schemafixture|internal/propertytest|internal/largedata|internal/contactgen)$' | tr '\n' ' ')"; run='' ;;
            *)             echo "unknown leg: $LEG" >&2; exit 1 ;;
          esac
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # A -run shard silently drops any Test/Fuzz func matching neither half.
      # `rest` has the anchored-`$` package guard above; the sharded legs get
      # this one: every `func Test*` / `func Fuzz*` in the package must start
      # with an A–Z letter so `[A-G]` ∪ `[H-Z]` is total. Fails the leg loudly
      # on a future `Test_foo` / lowercase / digit name, and logs the balance.
      - name: Verify shard split is exhaustive
        if: steps.pkgs.outputs.run != ''
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          case "$LEG" in
            controllers-*) dir=controllers ;;
            services-*)    dir=services ;;
            *)             echo "shard guard on unexpected leg: $LEG" >&2; exit 1 ;;
          esac
          names="$(grep -rhoE '^func (Test|Fuzz)[A-Za-z0-9_]+' "$dir"/*_test.go | sed -E 's/^func (Test|Fuzz)//')"
          bad="$(printf '%s\n' "$names" | grep -vE '^[A-Z]' || true)"
          if [ -n "$bad" ]; then
            echo "::error::$dir: these Test/Fuzz funcs do not start A-Z, so the [A-G]/[H-Z] shards would skip them:"
            printf '%s\n' "$bad"
            exit 1
          fi
          a="$(printf '%s\n' "$names" | grep -cE '^[A-G]' || true)"
          b="$(printf '%s\n' "$names" | grep -cE '^[H-Z]' || true)"
          echo "$dir shard balance — [A-G]=$a  [H-Z]=$b  (total $((a + b)))"

      # Issue #268: the same gotestsum wrapper as before — a failed test is
      # retried once (`--rerun-fails=1`) instead of flaking the check, a JUnit
      # XML is produced for dorny/test-reporter (test-report.yml), and tests
      # that only passed on retry land in the rerun report — but scoped to
      # this leg's packages and suffixed so the three legs' artifacts don't
      # collide. -timeout 20m -> 25m (issue #630): a leg has the whole runner
      # now, but the inner ceiling stays explicit.
      #
      # Issue #639: NO -coverprofile here. gotestsum's --rerun-fails re-invokes
      # `go test` for just the failed test's package, and `go test`
      # *truncates and rewrites* the coverprofile on that second invocation —
      # so a single flaky test collapsed a whole leg's profile to just the
      # reran test (controllers 72.4% -> 1.2%, dragging the merged Codecov
      # number down ~10pt while the leg still reported green). Coverage is now
      # a separate no-rerun pass below; this run is purely the gate + JUnit +
      # flake signal. RAPID_CHECKS / GO_TEST_TIMEOUT come from the job-level
      # env above (tiered by trigger — see the comment there).
      # RUN is the leg's shard regex ('' for `rest`); `go test -run ''` matches
      # every test, so it is passed unconditionally.
      - name: Run tests (retry-on-failure)
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
          PKGS: ${{ steps.pkgs.outputs.list }}
          RUN: ${{ steps.pkgs.outputs.run }}
        run: >
          go run gotest.tools/gotestsum@v1.13.0
          --rerun-fails=1 --rerun-fails-max-failures=20
          --rerun-fails-report="rerun-fails-${LEG}.txt"
          --junitfile="junit-${LEG}.xml"
          --packages="$PKGS"
          -- -race -run "$RUN" -timeout="$GO_TEST_TIMEOUT"

      # Issue #639: dedicated coverage pass — no --rerun-fails, so nothing
      # rewrites the profile mid-run; no -race, which roughly halves the
      # wall-clock of this second pass and leaves the coverage numbers
      # identical (race instrumentation doesn't change which statements
      # execute). `go test` writes a complete -coverprofile even when a test
      # fails, so a flake here still produces an accurate profile;
      # continue-on-error keeps a flake (or an OOM/timeout) from failing the
      # leg, and the aggregator's guard drops the Codecov upload entirely if
      # a leg's profile went missing (carryforward then holds the last known
      # number) rather than uploading a partial.
      - name: Collect coverage (no retry)
        if: always()
        continue-on-error: true
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
          PKGS: ${{ steps.pkgs.outputs.list }}
          RUN: ${{ steps.pkgs.outputs.run }}
          # Same TEST-07 iteration budget as the gate run above, so the
          # coverage profile reflects the same property-test depth the PR
          # gate sees (a shallower coverage pass could miss generator lines
          # the gate run hit and tank the codecov/patch status).
        run: |
          read -ra pkgs <<< "$PKGS"
          go test "${pkgs[@]}" -run "$RUN" -timeout="$GO_TEST_TIMEOUT" -coverprofile="coverage-${LEG}.out" -covermode=atomic

      # Issue #268: the flake signal for Go — visibility only, does not fail
      # the leg (the rerun exists precisely to keep the gate green).
      - name: Report flaky tests (failed once, passed on retry)
        if: always()
        working-directory: backend
        env:
          LEG: ${{ matrix.leg }}
        run: |
          if [ -s "rerun-fails-${LEG}.txt" ]; then
            echo "::group::Flaky tests (passed only on retry) — ${LEG}"
            cat "rerun-fails-${LEG}.txt"
            echo "::endgroup::"
          else
            echo "No tests required a rerun in ${LEG}."
          fi

      # Per-leg parts; the `backend` gate job merges them into the single
      # backend-coverage / backend-junit-results artifacts the rest of CI
      # expects.
      - name: Upload test parts (coverage + JUnit + flake report)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-test-parts-${{ matrix.leg }}
          path: |
            backend/coverage-${{ matrix.leg }}.out
            backend/junit-${{ matrix.leg }}.xml
            backend/rerun-fails-${{ matrix.leg }}.txt
          retention-days: 7
          if-no-files-found: ignore

  backend:
    permissions:
      contents: read
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, backend-checks, backend-tests]
    # Always run so this required status check still reports when the two
    # upstream jobs are path-gated out — they come back "skipped", which the
    # gate step treats as green (same net effect as the old single job's
    # `if:` making a skipped job report Success, issue #264).
    if: always()

    steps:
      - name: Gate on backend-checks and backend-tests
        env:
          CHECKS: ${{ needs.backend-checks.result }}
          TESTS: ${{ needs.backend-tests.result }}
        run: |
          echo "backend-checks=$CHECKS  backend-tests=$TESTS"
          for r in "$CHECKS" "$TESTS"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::backend gate failed (result=$r)"; exit 1 ;;
            esac
          done

      - name: Checkout repository
        if: needs.backend-tests.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.backend-tests.result == 'success'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download test parts from all legs
        if: needs.backend-tests.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-test-parts-*
          merge-multiple: true
          path: backend

      # Issue #630: `database` / `property` / `rest` cover disjoint blocks, but
      # controllers-1/-2 (and services-1/-2) are the SAME package under
      # disjoint -run shards, so every block appears in both profiles — count 0
      # in the shard that didn't run it. A plain concat would list each of
      # those blocks twice and `go tool cover` would double-count. So sum the
      # count field per block key instead (atomic mode: counts are additive;
      # blocks from different packages never share a key, so the unsharded legs
      # merge the same way). First-seen order is source order — shard 1 already
      # emits every block — which is what `go tool cover` expects.
      #
      # Issue #639: require every leg's profile before uploading. Each leg's
      # coverage comes from a no-rerun `go test -coverprofile` pass that is
      # `continue-on-error`, so a crashed/timed-out coverage pass leaves its
      # `coverage-<leg>.out` missing rather than clobbered. Merging whatever
      # is present would silently upload a partial profile and tank the
      # number; instead skip the upload for this commit and let Codecov's
      # per-flag `carryforward` (codecov.yml) hold the last known coverage.
      # `ok=false` gates every coverage step below; it never fails the
      # required "Backend (Go)" check (coverage is informational).
      - name: Merge coverage profiles
        id: merge
        if: needs.backend-tests.result == 'success'
        working-directory: backend
        run: |
          files=""
          missing=""
          for leg in controllers-1 controllers-2 services-1 services-2 database property rest; do
            f="coverage-${leg}.out"
            if [ ! -s "$f" ] || [ "$(wc -l < "$f")" -lt 2 ]; then
              missing="$missing $leg"
            else
              files="$files $f"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::coverage profile missing for leg(s):$missing — skipping Codecov upload, carryforward holds last known coverage"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086 # $files is a controlled space-joined list
          awk '
            FNR == 1 { mode = $0; next }
            { if (!($1 in stmt)) { order[++n] = $1; stmt[$1] = $2 }
              count[$1] += $3 }
            END { print mode; for (i = 1; i <= n; i++) print order[i], stmt[order[i]], count[order[i]] }
          ' $files > coverage.out
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # Issue #294: durable coverage tracking + per-PR diff comment.
      # Informational only (see codecov.yml) — a failed upload (app not
      # installed yet, Codecov outage) must not fail the build, hence
      # fail_ci_if_error: false. disable_search so only the merged profile is
      # sent, not the per-leg coverage-*.out parts sitting alongside it
      # (issue #639).
      - name: Upload coverage to Codecov
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.out
          disable_search: true
          flags: backend
          fail_ci_if_error: false

      # Issue #251: the project-wide number stays informational. The hard
      # gate is the diff-based codecov/patch status (issue #267) — new
      # uncovered lines in the changed files fail the PR.
      - name: Coverage summary
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        working-directory: backend
        run: go tool cover -func=coverage.out

      - name: Render HTML coverage report
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        working-directory: backend
        run: go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage report
        if: needs.backend-tests.result == 'success' && steps.merge.outputs.ok == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-coverage
          path: |
            backend/coverage.out
            backend/coverage.html
          retention-days: 7

      # Issue #268: one combined JUnit + flake artifact (the per-leg
      # junit-*.xml / rerun-fails-*.txt gathered above) so test-report.yml
      # (dorny/test-reporter) needs no per-leg wiring — its `path` glob picks
      # up every leg.
      - name: Upload test results (JUnit + flake report)
        if: needs.backend-tests.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-junit-results
          path: |
            backend/junit-*.xml
            backend/rerun-fails-*.txt
          retention-days: 7

  frontend:
    permissions:
      contents: read
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    # Scheduled runs must always run the full suite (there is no diff to gate
    # on) — same exemption pattern as zizmor.yml/sast.yml.
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472) / COMPAT-02 (issue #473): read the floor
          # from frontend/package.json's "engines.node" (>=22.22.2, tightened
          # from the original 22.13.0 after COMPAT-02 hand-verified that
          # jsdom@30's own engines field, not this project's own requirement,
          # is the true binding constraint on the 22.x line) instead of
          # hardcoding it here, so the declared floor is the one CI actually
          # runs. That floor comfortably covers the older reason the 20.x
          # line was dropped in the first place: vitest's
          # --no-experimental-webstorage flag below needs Node >= 22.4.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run tests with coverage
        working-directory: frontend
        run: yarn test:coverage
        env:
          CI: true

      # Issue #294: see the backend job's identical step for why
      # fail_ci_if_error is false.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: yarn lint

      # Issue #251: the project-wide number stays informational. The hard
      # gate is the diff-based codecov/patch status (issue #267).
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

      # Issue #268: JUnit XML (written by vitest's junit reporter) consumed by
      # test-report.yml (dorny/test-reporter). Flaky vitest tests are surfaced
      # separately by the github-actions reporter's job summary.
      - name: Upload test results (JUnit)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-junit-results
          path: frontend/junit.xml
          retention-days: 7

  # Issue #556 (web PERF counterpart to #468-#471): the client bundle-size
  # budget. A production `vite build` then `yarn budget`, which fails when a
  # chunk (or the total) grows past frontend/bundle-budget.json by more than
  # the stated tolerance. Deterministic bytes are the gate; the per-chunk
  # table it writes to the job summary is the attribution. Wall-clock load
  # time is a trend, measured by the Playwright @perf specs, not here.
  # Separate job from `frontend` above because it needs the full build the
  # vitest/tsc/lint job deliberately skips. Same path gating.
  frontend-bundle-budget:
    permissions:
      contents: read
    name: Frontend bundle-size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.openapi == 'true' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # COMPAT-01 (issue #472): floor comes from frontend/package.json's
          # "engines.node" rather than a hardcoded number here.
          node-version-file: frontend/package.json
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build production bundle
        working-directory: frontend
        run: yarn build

      - name: Check bundle-size budget
        working-directory: frontend
        run: yarn budget
