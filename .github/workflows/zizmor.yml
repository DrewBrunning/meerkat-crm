name: GitHub Actions Security (zizmor)

# Issue #358: zizmor scans .github/ (all workflows + dependabot.yml) for
# supply-chain and injection bugs that CodeQL and Scorecard do not cover:
# template injection into `run:` blocks, unpinned/impostor action refs,
# credential persistence into artifacts, excessive permissions, dangerous
# triggers. Unlike CodeQL's taint analysis it is definition-only — it reads
# the workflow YAML, never executes it — which makes it fast enough to be a
# hard gate on every `.github/**` change.
#
# Path-gated on the `workflows` filter (issue #264 pattern) since it only
# scans .github/; the scheduled run re-scans everything so new audit rules
# are exercised against the latest workflows even with no activity.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: '3 3 * * 1' # Monday 03:03 UTC
  # Issue #543: lets release.yml / docker-publish.yml's mandatory-gate step
  # dispatch this workflow against an exact release commit instead of
  # passively waiting for check-runs a `push` to release/** never produces
  # (deliberately -- a `push: release/**` trigger here would trip zizmor's
  # cache-poisoning audit; workflow_dispatch has no such exposure since it
  # can only be invoked by an actor with write access, not by anyone who can
  # merely push a branch). Not meant for ad hoc manual runs.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    permissions:
      contents: read
      pull-requests: read
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection on push needs the previous commit on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: .github/filters.yaml

      - name: Report gating decision
        run: |
          echo "workflows=$WORKFLOWS_CHANGED"
        env:
          # Boolean output only, so this is safe to interpolate (the *_files
          # outputs are the attacker-influenced ones on PRs, and we don't use
          # them). Passed as an env var so zizmor's own template-injection
          # audit has nothing to flag in this workflow either.
          WORKFLOWS_CHANGED: ${{ steps.filter.outputs.workflows }}

  zizmor:
    name: Scan workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # security-events: write — upload the SARIF to the Security tab.
      # actions: read — zizmor's online audits query the API for pinned refs.
      contents: read
      actions: read
      security-events: write
    needs: changes
    # Scheduled runs must always scan (there is no diff to gate on).
    if: github.event_name == 'schedule' || needs.changes.outputs.workflows == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # GH_TOKEN switches zizmor into online mode so the audits that need the
      # API (archived-uses, known-vulnerable-actions, unpinned-uses, impostor
      # refs) run rather than being skipped. GITHUB_TOKEN is sufficient: all
      # workflows are public.
      - name: Run zizmor -> SARIF (Security tab)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Scan and emit SARIF
        run: uvx "zizmor@1.29.0" --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
          category: zizmor

      # The hard gate: unlike --format=sarif (which always exits 0 so SARIF
      # consumers don't mistake findings for an internal error), the plain
      # format exits 11+ when findings exist, which fails this check. The
      # baseline is zero reported findings; new findings must be fixed or
      # explicitly ignored with a justification (see the ignores in
      # docker-publish.yml and test-report.yml).
      - name: Gate on findings
        run: uvx "zizmor@1.29.0" .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
