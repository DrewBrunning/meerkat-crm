[versions]
agp = "9.3.1"
kotlin = "2.3.10"
ksp = "2.3.11"
firebaseMessaging = "24.1.2"
googleServices = "4.4.4"
coreKtx = "1.15.0"
coreSplashscreen = "1.2.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2026.08.00"
navigationCompose = "2.8.5"
hilt = "2.60.1"
hiltNavigationCompose = "1.2.0"
room = "2.8.4"
okhttp = "4.12.0"
moshi = "1.15.1"
coil = "3.0.4"
ucrop = "2.2.9"
kotlinxDatetime = "0.6.1"
kotlinxCoroutines = "1.9.0"
datastore = "1.1.1"
securityCrypto = "1.1.0-alpha06"
work = "2.9.1"
turbine = "1.2.0"
mockk = "1.13.13"
junit = "4.13.2"
junit5 = "5.10.2"
robolectric = "4.16.1"
androidxTest = "1.6.1"
androidxTestExtJunit = "1.2.1"
mockwebserver = "4.12.0"
espresso = "3.7.0"
# Issue #263: the :macrobenchmark module — androidx.benchmark.macro
# (MacrobenchmarkRule) for cold/warm/hot startup + dashboard frame timing,
# plus uiautomator to drive the login flow before the dashboard scenario.
# Only the runtime library is used (no androidx.benchmark Gradle plugin), so
# there is no AGP-version gate to satisfy — the :macrobenchmark module is a
# plain `com.android.test` module.
benchmark = "1.3.4"
uiautomator = "2.3.0"
# Issue #268: retry failed JVM/Robolectric tests in CI so a flake doesn't
# fail the required check; flaky tests are surfaced by the CI step that
# scans the test-results XML (a test that passed only on retry still leaves
# its failure in the XML even though the task succeeded).
gradleTestRetry = "1.6.5"
# Issue #385: SQLCipher whole-DB encryption of the Room mirror
# (mycorrhizal-cache.db). Ships x86_64 + arm64-v8a .so ABIs so Robolectric
# (JVM) unit tests exercise the same native path as devices.
sqlcipher = "4.18.0"
# Issue #814 Phase 2: render the 2FA enrollment QR code. com.google.zxing:core
# is a pure-Java encoder (QRCodeWriter) — no camera/MLKit/barcode scanning is
# involved, only rendering the otpauth:// URI as a bitmap for the scanner app.
zxing = "3.5.3"
# Issue #358: detekt is the Kotlin smell/correctness analyzer complementing
# CodeQL (taint) + mobsfscan (manifest/intent/secret rules) for the Android
# app. Applied to every module via the build-logic convention plugins.
detekt = "1.23.8"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

[libraries]
# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Issue #150: WindowWidthSizeClass for the tablet layout. The BOM-pinned 1.3.1
# windowsizeclass artifact is deprecated (replaced by material3-adaptive) but
# stays the simplest correct call here — see MycorrhizalApp.kt.
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigationCompose" }

hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-android-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigationCompose" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Issue #385: SQLCipher for Android (Room integration via SupportOpenHelperFactory).
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# Issue #814 Phase 2: pure-Java QR encoder for the TOTP enrollment URI.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "mockwebserver" }

moshi = { group = "com.squareup.moshi", name = "moshi", version.ref = "moshi" }
moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshi" }
moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshi" }

coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
coil-network-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil" }

# Issue #219/#220: uCrop — the profile-photo crop step (Yalantis, JitPack-only).
ucrop = { group = "com.github.yalantis", name = "uCrop", version.ref = "ucrop" }

# M5 §5a (issue #152): Firebase Cloud Messaging. The google-services.json is an
# external resource (per-deploy Firebase project), so the Google Services Gradle
# plugin is applied conditionally in :app — see app/build.gradle.kts. The SDK
# itself still compiles without it; runtime degrades to the polling workers.
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging", version.ref = "firebaseMessaging" }

kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# M5 §5a (issue #152): bridges com.google.android.gms.tasks.Task (Firebase
# token fetch) into suspend functions.
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutines" }

androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# Test-only: WorkManagerTestInitHelper resets WorkManager's state cleanly between
# test methods (plain WorkManager.initialize(...) throws "already initialized" on
# the second call within the same Robolectric JVM fork -- issue #320 Phase B).
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltNavigationCompose" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltNavigationCompose" }
androidx-startup = { group = "androidx.startup", name = "startup-runtime", version = "1.1.1" }
# Issue #238: espresso 3.7.0 (androidTest) needs concurrent-futures 1.2.0, but
# work-runtime 2.9.1 (main) pulls 1.1.0; Gradle 9's consistent resolution forces
# every configuration to agree, so :app pins 1.2.0 explicitly (backwards-compatible).
androidx-concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures", version = "1.2.0" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit5" }
junit-vintage = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junit5" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTest" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTest" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
# Issue #263: macrobenchmark harness (:macrobenchmark module only).
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
# Issue #268: the org.gradle.test-retry plugin marker — resolved from the
# Gradle Plugin Portal (build-logic/settings.gradle.kts) so the convention
# plugin can apply it by id to every module's Test tasks.
gradle-test-retry-plugin = { group = "org.gradle.test-retry", name = "org.gradle.test-retry.gradle.plugin", version.ref = "gradleTestRetry" }
