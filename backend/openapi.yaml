        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation agenda item, or the linked activity, was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

