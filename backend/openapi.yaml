    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get the contact-detail composite (M4)
      operationId: getContactDetail
      description: >
        Read-only aggregation of everything the contact detail screen renders
        for one contact: the full contact record, notes, activities,
        reminder completions, reminders, confirmed relationship edges (other-
        party name resolved), life events (related-contact names resolved),
        conversation agenda, gifts, custom field values, external identities
        and activities, this contact's circle memberships and tags, the
        current user's enabled-fields, and (when the user has an Immich
        config) an Immich summary block. Pure aggregation, no writes, no
        cache; every collection block is always present and serializes as
        `[]` when empty, never `null`/absent. The six timeline-eligible
        blocks (notes, activities, completions, life events, external
        activities, gifts) are bounded at 5 each — enough to build the
        default 5-item timeline preview correctly — and ordered by the
        timeline's event-date key; the rest are the client's whole screen in
