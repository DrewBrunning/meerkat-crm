  # --- Contacts ---
  /contacts:
    get:
      summary: List contacts (slim projection)
      operationId: listContacts
      description: >
        Returns a page of ContactSummary items — never the full Card, so a
        mobile contact-list screen doesn't have to fetch every contact's
        nested data (see docs/adrs/0001-neutral-hub-and-spoke-contact-model.md).
        Pagination is cursor-based (T17): rows are ordered by the
        (updated_at, id) feed key and a page is resumed with next_cursor.
        ?since= turns the endpoint into a change feed returning every row
        changed after the cursor — including soft-deleted rows marked
        deleted:true — for incremental sync. An exact `total` count is
        deliberately gone. The fields= partial-projection param is gone (Gap
        3) and has no effect if sent. A `sort` query (T73) selects the
        cursor order: the default (updated_at, id) feed key, or a
        name-ordered (sort_name, id) key — sort=name never combines with
        ?since=, which is sync state (400), and any other sort value is a
        400, not a silent fallback.
      parameters:
        - name: sort
          in: query
          description: >
            Cursor order for the list. updated_at (default) is T17's
            (updated_at, id) feed key — most-recently-edited first when
            combined with the default order=desc. name orders by the
            denormalized sort_name key (lower(trim(lastname)) else
            lower(trim(firstname))), resume cursors taking the
            (sort_name, id) shape. Valid only on ?cursor= browsing: ?since=
            combined with sort=name is a 400, and an unrecognized value is a
            400. Changing the default is the web control's call (T77), not
            the server's.
          schema: { type: string, enum: [updated_at, name], default: updated_at }
        - name: cursor
          in: query
          description: >
            Opaque resume token returned as next_cursor by the previous page.
            Resumes the list after that position in the selected sort's key
            ((updated_at, id), or (sort_name, id) under sort=name). Ignored
            when since is present. A cursor from one sort used under the
            other is rejected (400) rather than silently misapplied.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every row changed after this position —
            created, updated, AND soft-deleted (deleted:true) — ordered
            forward, ignoring search/circle/archive filters and always in the
            (updated_at, id) feed order (never name order). A cursor older
            than DELETED_RETENTION_DAYS returns 410 Gone (tombstones were
            purged; full resync required).
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the selected sort's cursor order (updated_at, id) or (sort_name, id). since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: search
          in: query
          description: >
            Free-text search across name/nickname/email/phone/address
            (including secondary array entries), composable with every other
            filter, sort and cursor on this endpoint. Matching is the union of
            substring matching over those fields and, for terms of two or more
            characters, an FTS5 prefix-token match over the same index /search
            uses — which additionally covers organization. Results stay in the
            selected sort order; relevance is deliberately not a sort mode
            here (T85). A phone-shaped term is normalized, so punctuation,
            grouping and country-code differences still match.
          schema: { type: string }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
        - name: archived
          in: query
          description: When true (and include_archived is not set), return only archived contacts.
          schema: { type: boolean, default: false }
        - name: favorites
          in: query
          description: >
            When true, return only contacts the caller has marked as
            favorites (issue #173). Composes with search/circle/archived/
            sort/cursor like the other filters. Ignored by ?since= (the
            change feed is sync state and must return every row regardless
            of filters).
          schema: { type: boolean, default: false }
        - name: has_contact_info
          in: query
          description: >
            When true, return only contacts with at least one non-empty email,
            phone or URL (the flat email/phone scalars or any entry in the
            emails/phones/urls JSON arrays) — i.e. contacts you can actually
            contact. Defaults to false for API consumers; the web Contacts page
            opts in by default. Any value other than true/false is a 400, not a
            silent fallback. When the filter is active, the response carries
            hidden_count: how many contacts matched the other filters
            (archive/search/circle) but were excluded by this predicate.
            Ignored by ?since= (the change feed is sync state and must return
            every row regardless of filters) and ?vcard_uid= (a by-UID lookup).
          schema: { type: boolean, default: false }
        - name: circle
          in: query
          schema: { type: string }
        - name: circle_legacy
          in: query
          description: >
            Temporary T2-migration shim that filters against the legacy flat
            contacts.circles JSON column. Remove once the migration is
            complete; do not build on it.
          schema: { type: string }
        - name: vcard_uid
          in: query
          description: >
            Repeatable batch by-VCardUID lookup (e.g. ?vcard_uid=a&vcard_uid=b).
            Bypasses pagination/search/sort entirely and returns only the
            requested contacts (the RelationshipEdge frontend uses this to
            resolve VCardUID references). Respects include_archived.
          schema: { type: string }
        - name: includes
          in: query
          description: >
            Comma-separated subset of notes,activities,reminders. When set,
            each item is a ContactSummaryWithRelations instead of a plain
            ContactSummary. includes=relationships was removed and
            is a no-op (not an error).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: Malformed cursor or since value, an unrecognized sort value, or sort=name combined with since.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: >
            The ?since= cursor is older than DELETED_RETENTION_DAYS — deleted
            rows have been purged, so incremental sync can no longer converge.
            Full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of contacts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      anyOf:
                        - $ref: "#/components/schemas/ContactSummary"
                        - $ref: "#/components/schemas/ContactSummaryWithRelations"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  hidden_count:
                    type: integer
                    description: >
                      Present only when has_contact_info=true: how many contacts
                      matched the other filters but were excluded by the
                      contact-info predicate, so the client can disclose that
                      rows are hidden.
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
              example:
                contacts:
                  - id: 12
                    uid: "0836c948-4c37-4ac8-bb27-358936e6b67c"
                    firstname: "Fixture"
                    lastname: "Other"
                    nickname: ""
                    fn: "Fixture Other"
                    primary_email: ""
                    primary_phone: ""
                    birthday: ""
                    org: ""
                    photo: ""
                    archived: false
                    is_favorite: false
                    revision: 3
                  - id: 11
                    uid: "458bc9ba-b9a7-4853-a3f8-d9cd907bbc9f"
                    firstname: "Fixture"
                    lastname: "Primary"
                    nickname: "Fix"
                    fn: "Fixture Primary"
                    primary_email: "fixture.primary@example.com"
                    primary_phone: "+1 555-0100"
                    birthday: "1990-06-15"
                    org: ""
                    photo: ""
                    archived: false
                    is_favorite: false
                    revision: 7
                  - id: 6
                    uid: "26861acc-8372-4be8-9113-84fb27995aaa"
                    firstname: "Eve"
                    lastname: "Davis"
                    nickname: ""
                    fn: "Eve Davis"
                    primary_email: "eve@example.com"
                    primary_phone: "+1 555-0105"
                    birthday: ""
                    org: ""
                    photo: ""
                    archived: false
                    is_favorite: false
                    revision: 2
                limit: 25
                next_cursor: ""
                sync:
                  mode: incremental
                  incremental: [contacts, notes, activities, life_events, preferences, cadence_policies, conversation_agenda, gifts]
                  full_resync: [circles, households, tags, relationship_edges, field_definitions, external_identities, external_activities]
    post:
      summary: Create a contact
      operationId: createContact
      description: >
        Accepts the full neutral Card/CRM shape (ContactRecordInput), not the
        legacy flat DTO. At least one name component (kind=given) or
        card.name.full is required.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRecordInput"
      responses:
        "201":
          description: Contact created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Contact created successfully" }
                  contact:
                    $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request with this Idempotency-Key is still being processed (CON-04, ADR 0010); retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The Idempotency-Key was already used for a different request body (CON-04, ADR 0010).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contacts/circles:
    get:
      summary: List the user's circle names
      operationId: listCircleNames
      description: >
        Returns a bare JSON array of circle names (the same Circle entities
        listed by /circles, projected to names only). ?legacy=true reads the
        legacy flat contacts.circles JSON column instead (T2 triage shim).
      parameters:
        - name: legacy
          in: query
          schema: { type: boolean, default: false }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Circle names.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
  /contacts/random:
    get:
      summary: List five random, non-archived contacts
      operationId: getRandomContacts
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Random contacts (raw Contact rows plus photo_thumbnail).
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactResponse"
  /contacts/birthdays:
    get:
      summary: List upcoming birthdays
      operationId: getUpcomingBirthdays
      description: Up to 5 results, extended to include all birthdays within two weeks.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Upcoming birthdays.
          content:
            application/json:
              schema:
                type: object
                properties:
                  birthdays:
                    type: array
                    items:
                      $ref: "#/components/schemas/Birthday"
  /contacts/merge/preview:
    post:
      summary: Preview merging two contacts
      operationId: previewContactMerge
      description: Computes the field union, conflicts, and per-association counts without mutating anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMergeRequest"
      responses:
        "200":
          description: Merge preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactMergePreviewResponse"
        "400":
          description: keep_id equals merge_id, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One of the two contacts not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/merge:
    post:
      summary: Merge two contacts (keep_id survives, merge_id is absorbed)
      operationId: commitContactMerge
      description: >
        Every field conflict must be resolved in the resolutions map or the
        request fails with 400. The loser is soft-deleted; an audit note is
        attached to the keeper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactMergeRequest"
      responses:
        "200":
          description: Merge committed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Contacts merged" }
                  contact:
                    $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: keep_id equals merge_id, unresolved conflicts, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One of the two contacts not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/duplicates:
    get:
      summary: Scan the address book for duplicate candidate pairs (T93)
      operationId: getDuplicatePairs
      description: >
        Re-derives duplicate candidates across three tiers — email, exact
        name, and phone (last-10-digit PhoneKey over every number, not just
        the primary) — as unordered pairs, strongest-first, offset-paginated.
        Already-dismissed pairs are filtered out. Read-only and idempotent.
        Archived contacts are included (flagged by each summary's `archived`);
        soft-deleted ones are excluded.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 }, description: "1-based page number." }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 100 }, description: "Page size." }
      responses:
        "200":
          description: Candidate pairs found (possibly none).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicatePairsResponse"
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/duplicates/dismiss:
    post:
      summary: Mark a duplicate-candidate pair as not a duplicate (T93)
      operationId: dismissDuplicatePair
      description: >
        Records a permanent dismissal for the pair identified by the two
        contacts' VCardUIDs, so the scanner never offers it again. Idempotent:
        dismissing an already-dismissed pair succeeds. Both contacts must be
        the caller's own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DuplicateDismissalInput"
      responses:
        "200":
          description: Pair dismissed (or already dismissed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Pair dismissed" }
        "400":
          description: Validation failed (missing or malformed uid).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: One or both contacts not found / not owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/bulk:
    post:
      summary: Run one bulk action across many contacts (N5)
      operationId: bulkContactOperation
      description: >
        Applies a single action (add/remove circle, add/remove tag, archive,
        unarchive, delete) to many contacts at once, with partial-success
        semantics: the response reports how many succeeded and which failed.
        Targets are Contact.VCardUID values, scoped to the authenticated user —
        a VCardUID that is not the user's own contact is reported as a failure,
        never silently skipped. Membership actions are idempotent: adding to
        something already present (or removing from something already absent)
        counts as success rather than the 409 the per-contact endpoints return.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkContactOperationInput"
      responses:
        "200":
          description: >
            The operation ran; check `succeeded`/`failed` for the per-contact
            outcome. `failed > 0` is still a 200 (partial success).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkOperationResult"
        "400":
          description: Invalid action, empty uid list, or a missing circle_id/tag_id for a membership action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Household not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- T40 address-based household suggestions ---
  /households/suggest-addresses:
    post:
      summary: Scan contacts for shared-address household suggestions
      operationId: suggestAddressHouseholds
      description: >
        T40: groups the caller's non-archived contacts by normalized address
        and returns every group of two or more that is not already a
        co-resident household and has not been dismissed. Read-only and
        idempotent — nothing is persisted.
      responses:
        "200":
          description: Suggestions found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AddressHouseholdSuggestion"
                  total: { type: integer }
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /households/suggestions/accept:
    post:
      summary: Accept a shared-address household suggestion
      operationId: acceptAddressHouseholdSuggestion
      description: >
        T40: creates a Household plus its member rows for a suggested group,
        identified by its member VCardUIDs. The shared address is re-derived
        server-side from the members' real data; the group must not already be
        co-residents and must not have been dismissed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptHouseholdSuggestionInput"
      responses:
        "201":
          description: Household created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  household:
                    $ref: "#/components/schemas/Household"
        "400":
          description: Invalid group (too few members, bad type).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: A suggested member contact no longer exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Group already co-residents or already dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /households/suggestions/dismiss:
    post:
      summary: Dismiss a shared-address household suggestion
      operationId: dismissAddressHouseholdSuggestion
      description: >
        T40: permanently records a suggested group (identified by its member
        VCardUIDs) as rejected so the detection pass stops offering it. The
        hash pair is recomputed server-side.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissHouseholdSuggestionInput"
      responses:
        "200":
          description: Suggestion dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Household suggestion dismissed" }
        "400":
          description: Invalid group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Group already dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Contact-address suggestions (inverse of T40): propose addresses a
  # contact probably shares, from confirmed relationships and households. ---
  /contacts/address-suggestions:
    post:
      summary: Scan for contact-address suggestions
      operationId: suggestContactAddresses
      description: >
        Proposes addresses for a contact based on who they are related to
        (confirmed parent/child, spouse, roommate edges) and which household
        they are in. Read-only and idempotent — nothing is persisted; the
        client renders the suggestions and lets the user apply or ignore each
        one via /contacts/address-suggestions/apply.
      responses:
        "200":
          description: Suggestions found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactAddressSuggestion"
                  total: { type: integer }
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contacts/address-suggestions/apply:
    post:
      summary: Apply a contact-address suggestion
      operationId: applyContactAddressSuggestion
      description: >
        Adds the address a suggestion points at to the contact, re-deriving it
        server-side from the current graph (the confirmed relationship or
        household membership must still hold, and the source must still carry
        that address) rather than trusting the client. Appending goes through
        the same save path as a normal contact edit, so no other contact data
        is touched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyContactAddressSuggestionInput"
      responses:
        "200":
          description: Address added to the contact.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  contact_vcard_uid: { type: string, format: uuid }
        "400":
          description: Invalid suggestion identity (bad source_kind or missing fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact or source not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The link, address, or membership no longer holds, or the contact already has the address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a contact (full neutral Record/Card)
      operationId: getContact
      responses:
        "200":
          description: The contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRecordResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a contact
      operationId: updateContact
      description: Same request/response shape as POST /contacts (symmetric read/write contract).
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRecordInput"
      responses:
        "200":
          description: Updated contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactRecordResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the contact was modified since the client last read it; the row was not changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a contact
      operationId: deleteContact
      description: Soft-deletes the contact and cascade-deletes all its associations (notes, activities links, reminders, edges, memberships, life events, field values, sync links).
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the contact was modified since the client last read it; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/briefing:
    parameters:
