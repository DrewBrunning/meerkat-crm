            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Remove the current user's Seafile connection
      operationId: deleteSeafileConfig
      description: Linked ExternalIdentity rows are kept.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /seafile/test-connection:
    post:
      summary: Test the current user's saved Seafile connection
      operationId: testSeafileConnection
      description: >
        Checks reachability (unauthenticated ping) then API token validity
        (GET /api2/auth/ping) against the currently saved connection, reporting
        which stage failed rather than a generic error. Always 200 when the
        check itself could run — ok:false is a successful diagnosis.
      responses:
        "200":
          description: The diagnosis (ok may be true or false).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeafileConnectionTestResult"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: >
            No Seafile connection configured, or the saved API token is
            invalid/expired (issue #524 — the caller's own setup, not a
            server malfunction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /seafile/libraries:
    get:
      summary: Browse the user's Seafile libraries (L1 picker)
      operationId: listSeafileLibraries
      description: Lists every library the token can access. Requires a configured connection.
      responses:
        "200":
          description: The library list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  libraries:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeafileLibrary"
        "400":
          description: >
            No Seafile connection configured, or the saved API token is
            invalid/expired (issue #524 — the caller's own setup, not a
            server malfunction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Seafile is configured but genuinely unreachable, or returned an unparseable response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /seafile/libraries/{repo_id}/dir:
    parameters:
      - name: repo_id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: List a Seafile library folder's contents (L1 picker)
      operationId: listSeafileDir
      description: ?path= defaults to "/" (the library root).
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The folder's file/dir entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeafileItem"
        "400":
          description: >
            No Seafile connection configured, or the saved API token is
            invalid/expired (issue #524 — the caller's own setup, not a
            server malfunction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Seafile is configured but genuinely unreachable, or returned an unparseable response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /seafile/contacts/{vcard_uid}/link:
    parameters:
      - name: vcard_uid
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Link a Seafile file/folder to a contact
      operationId: linkSeafileContact
      description: >
        Persists the link as an ExternalIdentity with system "seafile" — never
        a column on Contact. The external_id is repo_id + ":" + path; the URL
        is the web-app /lib/ URL (not a share link, which can itself carry a
        password/expiry). Body: {repo_id, path, name, type, size?, mtime?}.
        409 on a duplicate link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_id, path, name, type]
              properties:
                repo_id: { type: string }
                path: { type: string }
                name: { type: string }
                type: { type: string, enum: [file, dir] }
                size: { type: integer }
                mtime: { type: integer }
      responses:
        "201":
          description: Linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  external_identity:
                    $ref: "#/components/schemas/ExternalIdentity"
        "404":
          description: Contact not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The file/folder is already linked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /seafile/contacts/{vcard_uid}/links/{identity_id}:
    parameters:
      - name: vcard_uid
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: identity_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Unlink a specific Seafile file/folder from a contact
      operationId: unlinkSeafileContact
      description: >
        A contact can link many files/folders, so the ExternalIdentity id
        identifies which one. Hard deletes the link row.
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No such Seafile link for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Nextcloud / ownCloud WebDAV (P2c) ---
  /nextcloud/config:
    get:
      summary: Get the current user's Nextcloud/ownCloud connection config
      operationId: getWebDAVConfig
      description: >
        Returns an empty default when not configured (200, not 404). The app
        password is never returned — only whether one is stored
        (has_app_password).
      responses:
        "200":
          description: The config (without the app password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebDAVConfigResponse"
    put:
      summary: Create or update the current user's Nextcloud/ownCloud connection
      operationId: saveWebDAVConfig
      description: >
        The app password is encrypted at rest (derived from JWT_SECRET_KEY). An
        empty app_password on update keeps the stored password; a first-time
        connect requires one. Only an app password is accepted — never the
        account password.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebDAVConfigInput"
      responses:
        "200":
          description: The updated config (without the app password).
          content:
            application/json:
