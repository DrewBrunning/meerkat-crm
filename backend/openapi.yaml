                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Note not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the note was modified since the client last read it; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

