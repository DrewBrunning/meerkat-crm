          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contact-subscriptions/{id}/sync:
