        entity is a 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadencePolicyInput"
      responses:
        "201":
          description: Cadence policy created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Cadence policy created" }
                  cadence_policy:
                    $ref: "#/components/schemas/CadencePolicyWithHealth"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The subject contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A cadence policy already exists for this contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /cadence-policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a cadence policy
      operationId: getCadencePolicy
      responses:
        "200":
          description: The cadence policy with its derived health (raw, embedded).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadencePolicyWithHealth"
        "404":
          description: Cadence policy not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a cadence policy (full replace)
      operationId: updateCadencePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CadencePolicyInput"
      responses:
        "200":
          description: The updated cadence policy with its derived health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CadencePolicyWithHealth"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Cadence policy (or subject contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Another cadence policy already exists for the new subject contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a cadence policy (soft delete)
      operationId: deleteCadencePolicy
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Cadence policy not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Reminders ---
  /reminders:
    get:
      summary: List all reminders
      operationId: listAllReminders
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's reminders (no pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
  /reminders/upcoming:
    get:
      summary: List upcoming (next 7 days) reminders
      operationId: listUpcomingReminders
      description: Up to 5 incomplete reminders, or the next 5 incomplete overall.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Upcoming reminders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
  /reminders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a reminder
      operationId: getReminder
      responses:
        "200":
          description: The reminder (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
        "404":
          description: Reminder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a reminder
      operationId: updateReminder
      description: The Reminder model doubles as the request body — required fields (message, remind_at, recurrence, contact_id) must be re-sent.
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reminder"
      responses:
        "200":
          description: Reminder updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Reminder updated successfully" }
                  reminder:
                    $ref: "#/components/schemas/Reminder"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reminder (or referenced contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the reminder was modified since the client last read it; the row was not changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a reminder (soft delete)
      operationId: deleteReminder
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Reminder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the reminder was modified since the client last read it; nothing was deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reminders/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Complete a reminder
      operationId: completeReminder
      description: >
        Marks the reminder complete. With ?skip=true the timeline completion
        record is skipped. Recurring reminders are rescheduled (and return the
        reminder); once reminders are hard-deleted (message-only response).
      parameters:
        - name: skip
          in: query
          description: Skip writing the ReminderCompletion timeline record.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Completed (and rescheduled if recurring).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderCompleteResponse"
        "404":
          description: Reminder not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contacts/{id}/reminders:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's reminders
      operationId: listContactReminders
      responses:
        "200":
          description: The contact's reminders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reminders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reminder"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a reminder for a contact
      operationId: createReminder
      description: >
        The contact_id from the URL overrides any body contact_id, but the
        field is still required in the body by validation (the Reminder model
        is the request schema). remind_at's time-of-day is zeroed server-side.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Reminder"
      responses:
        "200":
          description: Reminder created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Reminder created successfully" }
                  reminder:
                    $ref: "#/components/schemas/Reminder"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request with this Idempotency-Key is still being processed (CON-04, ADR 0010); retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The Idempotency-Key was already used for a different request body (CON-04, ADR 0010).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /contacts/{id}/reminder-completions:
    parameters:
      - name: id
