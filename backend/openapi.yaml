openapi: 3.0.3
info:
  title: Mycorrhizal CRM API
  description: >
    REST API for Mycorrhizal's contact model. As  (P2,
    docs/adrs/0001-neutral-hub-and-spoke-contact-model.md), the contact endpoints speak
    the neutral RFC 9553-shaped model (contactmodel.Record/Card) rather than
    the legacy flat Contact DTO. GET /contacts (list) returns a slim
    ContactSummary per item; GET/POST/PUT /contacts/{id} exchange the full
    Card/CRM shape (ContactRecordResponse / ContactRecordInput) — a
    symmetric read/write contract.


    T8 (T8) extended this spec to cover
    the whole REST surface: every route registered by
    backend/routes/routes.go under /api/v1 plus the unversioned health
    endpoints (/health, /health/live, /health/ready — issue #421). The
    drift test (backend/openapi_test.go) enumerates the live Gin router and
    fails on any registered route with no spec entry, so this file cannot go
    stale again.

    Coverage notes:

    - **Auth:** every path under /api/v1 except the public auth group
      (register, login, logout, check-password-strength, password-reset,
      auth/oidc/config) requires a session cookie (`auth_token`, set by login
      and OIDC callback) or an `Authorization: Bearer <token>` header. API
      tokens (mycorrhizal_…) are accepted on the general REST path only when
      their scope is `full`; a `carddav`-scoped token is rejected with 403.
      API tokens cannot access the admin paths at all.
    - **OIDC:** `/auth/oidc/login` and `/auth/oidc/callback` are registered
      only when OIDC is enabled at server startup (`OIDC_ENABLED=true`); they
      are documented here for completeness but 404 on a non-OIDC build.
      `/auth/oidc/config` is always present.
    - **CardDAV:** the CardDAV surface (`.well-known/carddav`,
      `/carddav/*`) is a WebDAV/XML protocol, not JSON REST, and is out of
      scope for this spec by design. It is enabled separately via
      `CARDDAV_ENABLED`.
    - **Deliberate omissions (not bugs):** `fields=` on GET /contacts is
      gone  and is silently ignored if sent;
      `includes=relationships` was removed and is likewise a no-op
      rather than an error. The only Redocly lint warnings left are on
      genuinely-public endpoints that return no 4xx by design — /health
      (200/503), /auth/oidc/config (200), the OIDC login/callback redirects
      (302), and /logout (200) — do not add fake 4xx responses to silence
      them.
    - **Pagination:** every list endpoint returns the offset-shaped envelope
      `{ <items>: [...], "total", "page", "limit" }` documented below. T17
      (T17) will replace this with
      cursor-based pagination pre-alpha; when that lands, every paginated
      response in this spec must be revised together (the drift test keeps the
      route surface honest, not the envelope).
    - **Response-envelope asymmetry is real and intentional:** several create
      endpoints wrap their object (`{"note": …}`, `{"circle": …}`) while their
      update/single-GET siblings return it raw. Each operation documents what
      it actually returns; the RelationshipEdge asymmetry
      (create wraps `{"relationship_edge": …}`, update/accept return raw) has
      already burned a frontend once.
  version: "1.0.0"
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  # Unversioned health surface (registered outside /api/v1 in routes.go —
  # served at the app root, hence the path-level server override). Three
  # endpoints, each answering a different operator question (issue #421); all
  # unauthenticated and secret-free.
  /health/live:
    servers:
      - url: /
    get:
      summary: Liveness probe
      description: >
        Is the process running? Returns immediately, touching no database,
        filesystem, or config. This is what a container restart policy should
        hit — it must never fail because a dependency is slow or down.
      operationId: getHealthLive
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
  /health/ready:
    servers:
      - url: /
    get:
      summary: Readiness probe
      description: >
        Can this instance serve requests? Checks database connectivity,
        migration state (applied, not dirty, none pending), and required
        filesystem access. This is what a load balancer should gate traffic on.
      operationId: getHealthReady
      security: []
      responses:
        "200":
          description: The instance is ready to serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: >
            Not ready (same body shape, status not_ready) — the database or
            filesystem is unreachable, or migrations are pending/dirty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
  /health:
    servers:
      - url: /
    get:
      summary: Deep health check
      description: >
        Is the CRM actually operational? Everything /health/ready checks, plus
        the last recorded DB-integrity-check and restore-drill outcomes,
        background-job lock state, and reachability of server-scoped
        integrations. status is healthy | degraded | unhealthy; only a
        database read failure returns 503. "degraded" (an optional integration
        unreachable, a scheduled job stale) is still 200 — degraded-but-alive
        is not down.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The service is healthy or degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The database is unreachable (same body shape, status unhealthy).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  # --- OIDC (public) ---
  /auth/oidc/config:
    get:
      summary: OIDC availability/config
      operationId: getOIDCConfig
      security: []
      description: Always registered, whether or not OIDC is enabled.
      responses:
        "200":
          description: Whether OIDC login is enabled and the provider name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OIDCConfigResponse"
  /auth/oidc/login:
    get:
      summary: Start an OIDC login (only present when OIDC is enabled)
      operationId: oidcLogin
      security: []
      description: >
        Only registered when OIDC_ENABLED=true. Sets three httpOnly cookies
        (oidc_state, oidc_nonce, oidc_pkce) and 302-redirects to the
        provider's authorization endpoint. With ?client=android, also sets an
        oidc_client cookie so the callback returns the token to the native
        app's deep link instead of the web SPA (M6 §4).
      parameters:
        - name: client
          in: query
          schema: { type: string, enum: [android], description: "When present and equal to android, the callback delivers the JWT via the mycorrhizal://oidc/callback deep link." }
      responses:
        "302":
          description: Redirect to the provider's authorization URL.
        "500":
          description: Failed to generate state/nonce.
  /auth/oidc/callback:
    get:
      summary: OIDC callback (only present when OIDC is enabled)
      operationId: oidcCallback
      security: []
      description: >
        Only registered when OIDC_ENABLED=true. Exchanges the code, verifies
        the ID token, provisions/finds the user and 302-redirects to / (or to
        /login?error=… on any failure), setting the auth_token and id_token
        cookies on success. When the flow was started with ?client=android
        (oidc_client cookie), success instead redirects to
        mycorrhizal://oidc/callback?token=…&language=…&date_format=… and sets
        no cookies; failures redirect to the same deep link with error=…
        (M6 §4). state/nonce/PKCE are enforced identically for both flows.
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirect to / (success) or /login?error=… (failure); the android flow uses the mycorrhizal://oidc/callback deep link for both.

  # --- Public auth ---
  /register:
    post:
      summary: Register a new user account
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Account created. The first account ever is made admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation failed (weak password, bad email, etc.).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Registration is disabled (REGISTRATION_ENABLED=false).
        "409":
          description: Email or username already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /login:
    post:
      summary: Log in with username or email
      operationId: login
      security: []
      description: >
        Sets the httpOnly auth_token cookie on success; the token is never in
        the response body. Accepts either `identifier` (username or email) or
        the legacy `email` alias. For accounts with two-factor authentication
        (N8) the password alone is NOT enough: the response instead carries
        `two_factor_required: true` and sets a short-lived httpOnly 2fa_pending
        cookie that must be exchanged via POST /login/2fa for the real session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: >
            Logged in (auth_token cookie set), or 2FA pending — when
            two_factor_required is true the client must call POST /login/2fa
            with a TOTP or recovery code before a session exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing identifier/password or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials (deliberately identical for unknown user vs wrong password).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Account temporarily locked after repeated failures.
  /login/2fa:
    post:
      summary: Complete login with a TOTP or recovery code
      operationId: login2FA
      security: []
      description: >
        Step 2 of interactive login for accounts with 2FA enabled. Requires the
        short-lived 2fa_pending cookie set by POST /login and a valid TOTP code
        or unused recovery code (which is consumed). On success sets the real
        auth_token session cookie and clears 2fa_pending. The code-verification
        step is rate-limited by account like the password step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: Logged in; auth_token cookie set, 2fa_pending cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  language: { type: string }
                  date_format: { type: string }
        "400":
          description: Missing code or invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing/expired 2fa_pending challenge, or 2FA no longer enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Account temporarily locked after repeated failed codes.
  /logout:
    post:
      summary: Log out (clears session cookies)
      operationId: logout
      security: []
      description: >
        Always clears auth_token and id_token cookies. When the session used
        OIDC and the provider advertises an end-session endpoint, the response
        also carries a redirect_url for RP-Initiated Logout.
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
  /auth/device/session:
    post:
      summary: Exchange a device grant for a fresh session (biometric login)
      operationId: exchangeDeviceGrant
      security: []
      description: >
        Issue #722: the possession half of fully biometric login. A device
        that holds an unrevoked grant — and whose owner has just passed the
        device's own biometric check — exchanges it for a fresh session JWT,
        minted exactly like a password login (auth_token cookie). Revoked,
        unknown, or deleted-account grants are rejected like bad credentials.
        Rate-limited like /login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGrantSessionInput"
      responses:
        "200":
          description: Fresh session issued via auth_token cookie.
          content:
            application/json:
              schema:
                type: object
                properties:
                  language: { type: string }
                  date_format: { type: string }
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unknown or revoked device grant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited.
  /check-password-strength:
    post:
      summary: Evaluate a password's strength without changing it
      operationId: checkPasswordStrength
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        "200":
          description: Strength evaluation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordStrength"
        "400":
          description: Missing password.
  /password-reset/request:
    post:
      summary: Request a password reset email
      operationId: requestPasswordReset
      security: []
      description: Always returns the same response whether or not the email exists (anti-enumeration).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: Instructions sent (or would have been).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.
        "502":
          description: The reset email could not be sent.
  /password-reset/confirm:
    post:
      summary: Complete a password reset with the emailed token
      operationId: confirmPasswordReset
      security: []
      description: Bumps the user's token_version, invalidating all existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid/expired token or weak new password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.

  # --- Current user (protected) ---
  /users/change-password:
    post:
      summary: Rotate the authenticated user's password
      operationId: changePassword
      description: Bumps token_version (kills other sessions) and, for cookie sessions, re-issues a fresh auth_token cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Password updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Wrong current password, or new password equals current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Password changes are disabled in demo mode.
  # --- N8 two-factor auth (issue #158) ---
  /users/2fa/status:
    get:
      summary: Report whether the authenticated user has 2FA enabled
      operationId: getTwoFactorStatus
      description: UI switch only; never exposes the TOTP secret or recovery-code state.
      responses:
        "200":
          description: The 2FA enrollment state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorStatusResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/2fa/setup:
    post:
      summary: Begin 2FA enrollment (mint a TOTP secret)
      operationId: setupTwoFactor
      description: >
        Generates a fresh TOTP secret, stores its encrypted form, and returns
        the plaintext secret + otpauth:// URL so the client can render a QR
        code. 2FA is not enforced yet — POST /users/2fa/confirm flips it on.
        Unavailable (403) for OIDC-provisioned accounts, whose second factor
        belongs to their identity provider.
      responses:
        "200":
          description: The pending TOTP secret and its otpauth URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorSetupResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: OIDC-provisioned account (2FA unavailable) or demo mode.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA is already enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/2fa/confirm:
    post:
      summary: Confirm 2FA enrollment with a live TOTP code
      operationId: confirmTwoFactor
      description: >
        Validates a TOTP code against the secret minted by setup. On success
        2FA is enabled, ten single-use recovery codes are minted (returned
        plaintext, exactly once) and token_version is bumped, invalidating all
        other sessions; the current session's cookie is re-issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: 2FA enabled; the one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorConfirmResponse"
        "400":
          description: Missing or invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA already enabled, or setup was never run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/2fa/disable:
    post:
      summary: Disable 2FA
      operationId: disableTwoFactor
      description: >
        Requires a valid TOTP code. Clears the secret and all recovery codes and
        bumps token_version (other sessions invalidated; the current session's
        cookie is re-issued).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: 2FA disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Missing or invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/2fa/recovery-codes/regenerate:
    post:
      summary: Regenerate the single-use recovery codes
      operationId: regenerateRecoveryCodes
      description: >
        Requires a valid TOTP code (the recovery path must be gated on the
        strongest available proof). Replaces all unused codes with a fresh set,
        returned plaintext exactly once; the old codes stop working.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TwoFactorCodeInput"
      responses:
        "200":
          description: The new one-time recovery codes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoFactorConfirmResponse"
        "400":
          description: Missing or invalid code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: 2FA is not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/language:
    patch:
      summary: Update the authenticated user's UI language
      operationId: updateLanguage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLanguageInput"
      responses:
        "200":
          description: Language updated (normalized to lowercase).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  language: { type: string }
        "400":
          description: Unsupported language or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/date-format:
    patch:
      summary: Update the authenticated user's date format
      operationId: updateDateFormat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDateFormatInput"
      responses:
        "200":
          description: Date format updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  date_format: { type: string }
        "400":
          description: Unsupported date format or malformed JSON.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/enabled-contact-fields:
    get:
      summary: Get the user's enabled (visible) contact fields
      operationId: getEnabledContactFields
      description: enabled_contact_fields is null when the user has never configured it (the client then applies its default set).
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The enabled contact fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled_contact_fields:
                    type: array
                    items: { type: string }
                    nullable: true
    patch:
      summary: Set the user's enabled (visible) contact fields
      operationId: updateEnabledContactFields
      description: A nil/absent fields list means "reset to the default set".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnabledContactFieldsInput"
      responses:
        "200":
          description: Fields updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  enabled_contact_fields:
                    type: array
                    items: { type: string }
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      summary: Get the authenticated user
      operationId: getCurrentUser
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me/self-contact:
    patch:
      summary: Set or clear the caller's "Me" contact
      operationId: updateSelfContact
      description: >
        Points users.self_contact_vcard_uid at one of the caller's own contacts
        (T90), or clears it with a null/empty vcard_uid. A non-empty vcard_uid
        must resolve to a non-deleted contact owned by the caller — 404
        otherwise. Setting it is a pointer move only: the previously linked
        contact is neither deleted nor modified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelfContactInput"
      responses:
        "200":
          description: The self contact was set or cleared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  self_contact_vcard_uid:
                    type: string
                    nullable: true
        "404":
          description: The vcard_uid does not resolve to a contact owned by the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/directory:
    get:
      summary: List every other user on the instance (id + username only)
      operationId: listUserDirectory
      description: >
        Unlike admin-only GET /admin/users, any authenticated user can call
        this — it exists to populate the recipient picker for P1 contact
        sharing and deliberately returns nothing beyond id/username.
      responses:
        "200":
          description: Every user except the caller.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
