  # --- CadencePolicies (T19) ---
  /cadence-policies/overdue:
    get:
      summary: List overdue cadence policies
      operationId: listOverdueCadences
      description: >
        Every cadence policy that is currently overdue, most-overdue first,
        joined with the contact's numeric ID and display name. Health is
        derived from the timeline (never stored); a policy with no qualifying
        interaction ever can never be overdue.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The overdue list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  overdue:
                    type: array
                    items:
                      $ref: "#/components/schemas/OverdueCadence"
  /reach-out-suggestions:
    get:
      summary: List pending reach-out suggestions
      operationId: listReachOutSuggestions
      description: >
        Every pending event-driven reach-out suggestion for the user
        (issue #177) — an organization/title/address change detected by
        diffing audit-event snapshots — newest first, joined with the
        contact's numeric ID/display name/photo thumbnail.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The pending suggestion list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReachOutSuggestion"
  /reach-out-suggestions/{id}/dismiss:
    post:
      summary: Dismiss a reach-out suggestion
      operationId: dismissReachOutSuggestion
      description: >
        Marks a reach-out suggestion dismissed so it stops appearing on the
        dashboard. Idempotent — dismissing an already-dismissed suggestion is
        still a 200, not an error.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such suggestion, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The suggestion was dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /contact-sync-conflicts:
    get:
      summary: List pending CardDAV sync conflicts
      operationId: listContactSyncConflicts
      description: >
        Every pending sync conflict for the user (issue #395) — a CardDAV
        remote change overwrote a local edit, and this notice names the
        field, the overwritten local value, and the remote value that
        replaced it — newest first, joined with the contact's display
        identity and the subscription's name.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The pending conflict list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sync_conflicts:
                    type: array
                    items:
                      $ref: "#/components/schemas/ContactSyncConflict"
  /contact-sync-conflicts/{id}/restore:
    post:
      summary: Restore a sync conflict's overwritten local value
      operationId: restoreContactSyncConflict
      description: >
        Re-applies a conflict's LocalValue onto its contact (through the
        normal contact-save path, so the Card merge and audit trail run on
        it), then marks the conflict dismissed. A conflict that is already
        dismissed is a 409 — the local value is only offered back once.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such conflict, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The conflict is already dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The local value was restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /contact-sync-conflicts/{id}/dismiss:
    post:
      summary: Dismiss a sync conflict without restoring
      operationId: dismissContactSyncConflict
      description: >
        Acknowledges a sync conflict and accepts the remote value, so it
        stops appearing on the dashboard. Idempotent — dismissing an
        already-dismissed conflict is still a 200, not an error.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such conflict, or it belongs to another user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The conflict was dismissed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
