                $ref: "#/components/schemas/Error"

  # --- Export ---
  /export:
    get:
      summary: Export all personal data as CSV
      operationId: exportDataCsv
      description: >
        The full per-user backup as a single CSV file with section banner
        rows (CONTACTS/RELATIONSHIPS/ACTIVITIES/NOTES/REMINDERS) and header
        rows per section. Values are formula-injection-neutralized. This
        endpoint does not take sections/include_sensitive params — those
        apply only to the vCard/JSContact exports.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A CSV file.
          content:
            text/csv:
              schema: { type: string, format: binary }
  /export/vcf:
    get:
      summary: Export all contacts as a vCard (.vcf) file
      operationId: exportContactsVcf
      parameters:
        - name: version
          in: query
          description: vCard version to export. Defaults to 4.0.
          schema: { type: string, enum: ["4", "4.0", "3", "3.0"], default: "4" }
        - name: sections
          in: query
          description: >
            Comma-separated field sections to include (T9 selective
            export). One of: emails, phones, addresses, organizations,
            anniversaries, media, online_services, links, notes, keywords,
            related_to, personal_info, speak_to_as, members, languages,
            custom_fields. Absent means all sections. Identity (name/UID) is
            always included. An unknown token is a 400.
          schema:
            type: string
            example: "emails,phones,addresses"
        - name: include_sensitive
          in: query
          description: >
            Explicit opt-in override : when true, private/secret
            items in the selected sensitivity-bearing sections (related_to,
            personal_info, custom_fields) are included in this one export.
            Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A .vcf file (one or more concatenated vCard blocks).
          headers:
            X-Mycorrhizal-Export-Loss-Report:
              description: >
                DATA-02 (issue #442): URL-encoded JSON carrying the loss
                reports for the file actually returned — which contact lost
                which field to this format, and why (the DATA-01 matrix
                bucket + reason). Decode with url.QueryUnescape then JSON.parse.
                The object is {"format","count","truncated","diagnostics"}; the
                diagnostics list is bounded to a documented header-size cap, and
                when count exceeds what the header carries, truncated is true and
                GET /export/preflight (same params) returns the complete list.
              schema: { type: string }
          content:
            text/vcard:
              schema: { type: string, format: binary }
        "400":
          description: An unknown sections token was supplied.
  /export/jscontact:
    get:
      summary: Export all contacts as a JSContact (RFC 9553) JSON document
      operationId: exportContactsJscontact
      description: A JSON array of JSContact Card objects, one per contact.
      parameters:
        - name: sections
          in: query
          description: >
            Comma-separated field sections to include (T9 selective
            export). One of: emails, phones, addresses, organizations,
            anniversaries, media, online_services, links, notes, keywords,
            related_to, personal_info, speak_to_as, members, languages,
            custom_fields. Absent means all sections. Identity (name/UID) is
            always included.
          schema:
            type: string
            example: "emails,phones,addresses"
        - name: include_sensitive
          in: query
          description: >
            Explicit opt-in override : when true, private/secret
            items in the selected sensitivity-bearing sections (related_to,
            personal_info, custom_fields) are included in this one export.
            Defaults to false.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: A JSON array of JSContact Card documents.
          headers:
            X-Mycorrhizal-Export-Loss-Report:
              description: >
                DATA-02 (issue #442): URL-encoded JSON carrying the loss
                reports for the file actually returned — which contact lost
                which field to this format, and why (the DATA-01 matrix
                bucket + reason). Decode with url.QueryUnescape then JSON.parse.
                The object is {"format","count","truncated","diagnostics"}; the
                diagnostics list is bounded to a documented header-size cap, and
                when count exceeds what the header carries, truncated is true and
                GET /export/preflight (same params) returns the complete list.
              schema: { type: string }
          content:
            application/jscontact+json:
              schema:
                type: array
                items:
                  type: object
                  description: An RFC 9553 JSContact Card document.
        "400":
          description: An unknown sections token was supplied.
  /export/preflight:
    get:
      summary: Compute what an export would lose, without producing the file
      operationId: exportLossPreflight
      description: >
        DATA-02 (issue #442). Answers "if I export these contacts to this
        format with this field selection, what will be lost?" before anything
        is written. Runs the exact same shared per-contact computation as the
        export handlers (GET /export/vcf and /export/jscontact) and returns the
        loss reports only — which contact lost which field to which format, and
        why (the DATA-01 matrix bucket + reason). For unchanged data, the
        reports here are identical to the X-Mycorrhizal-Export-Loss-Report
        header on the actual export.
      parameters:
        - name: format
          in: query
          required: true
          description: The serialized format to preflight.
          schema: { type: string, enum: [vcard4, vcard3, jscontact] }
        - name: sections
          in: query
          description: >
            Comma-separated field sections to include (T9 selective
            export), mirroring the export endpoints. One of: emails, phones,
            addresses, organizations, anniversaries, media, online_services,
            links, notes, keywords, related_to, personal_info, speak_to_as,
            members, languages, custom_fields. Absent means all sections.
          schema:
            type: string
            example: "emails,phones,addresses"
        - name: include_sensitive
          in: query
          description: >
            Explicit opt-in override : when true, private/secret items in the
            selected sensitivity-bearing sections are included in this one
            export. Defaults to false. Sensitivity exclusions are a policy
            decision, not a fidelity loss — they never appear in the report.
          schema: { type: boolean, default: false }
        - name: vcard_uid
          in: query
          description: Restrict the preflight to a single contact.
          schema: { type: string }
      responses:
        "200":
          description: The loss reports an export with these params would produce.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportLossPreflightResponse"
        "400":
          description: An unknown format or sections token was supplied.
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Graph ---
  /graph:
    get:
      summary: Get the network graph (contacts + confirmed edges + activities)
      operationId: getGraph
      description: >
        Contact nodes (all non-archived contacts), activity nodes (only
        activities with 2+ participants), relationship edges (only status=confirmed),
        and activity star-edges. Error responses on this endpoint use a plain
        {"error": "..."} body, not the standard Error envelope.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphResponse"
        "500":
          description: Failed to fetch contacts/edges/activities.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /graph/connections:
    get:
      summary: Traverse the relationship graph from a contact (multi-hop chains)
      operationId: getGraphConnections
      description: >
        Graph traversal + multi-hop chains (T10). From a starting contact
        (?from, a Contact.VCardUID), list every reachable contact within
        ?depth hops, each with the chain of relation steps describing how it
        is related to the anchor ("John's sister's husband"). Inferred
        relations (a grandparent from two parent_of edges) are computed, never
        stored. Only status=confirmed, sensitivity!=secret edges participate;
        direction is applied via the relation-type registry's inverse. The
        optional ?relation param accepts a canonical token OR a registry
        synonym ("brother" -> sibling_of) and returns only chains containing a
        matching step.
      parameters:
        - name: from
          in: query
          required: true
          description: The starting contact's VCardUID.
          schema: { type: string, format: uuid }
        - name: depth
          in: query
          description: Maximum hops (1..5, default 3).
          schema: { type: integer, minimum: 1, maximum: 5, default: 3 }
        - name: relation
          in: query
          description: Canonical relation token or registry synonym to filter chains by.
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The reachable chains.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphConnectionsResponse"
        "400":
          description: Missing/invalid from, or depth out of range.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The from contact was not found (or is not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /search:
    get:
      summary: Full-text search across contacts, notes, and interactions
      operationId: searchAll
      description: >
        FTS5-backed search (T11) over the caller's contacts, notes, and
        interactions (activities), grouped into three sections. User-scoped
        (never crosses users); soft-deleted and secret items are excluded. When
        the whole query is a relation-type synonym ("brother"), resolved_relation
        echoes the canonical token ("sibling_of").
      parameters:
        - name: q
          in: query
          required: true
          description: The search term (>= 2 characters).
          schema: { type: string }
        - name: limit
          in: query
          description: Max results per section (default 10, max 50).
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
        - name: household_id
          in: query
          description: Restrict contact results to members of this household (T11's "everyone in the Smith household"). The household must belong to the caller.
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Grouped search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          description: Missing q or invalid limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Search query failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- API tokens ---
  /auth/device/grants:
    get:
      summary: List the user's enrolled devices (device grants)
      operationId: listDeviceGrants
      description: >
        Issue #722: the server half of fully biometric login. Never returns
        the token — only enough to recognise and revoke a device.
      responses:
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's device grants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  device_grants:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceGrantResponse"
    post:
      summary: Enroll this device (create a device grant)
      operationId: createDeviceGrant
      description: >
        Issue #722: mints a grant for the authenticated caller — the
        enrollment moment is always right after an interactive login. The
        plaintext token is returned only here, once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceGrantInput"
      responses:
        "201":
          description: Device enrolled (raw response, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceGrantCreateResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/device/grants/revoke-all:
    post:
      summary: Revoke every standing device grant for the current user
      operationId: revokeAllDeviceGrants
      description: >
        Issue #722: the lost-phone path — end every remembered device at once
        without knowing which one leaked.
      responses:
        "200":
          description: Grants revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer, description: "How many previously-active grants were revoked." }
  /auth/device/grants/{id}:
    delete:
      summary: Revoke one device grant
      operationId: revokeDeviceGrant
      description: Soft-revoke (sets revoked_at). Ownership is scoped to the caller.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Device grant revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device grant not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-tokens:
    get:
      summary: List the user's API tokens
      operationId: listApiTokens
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's tokens (no pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiTokenResponse"
    post:
      summary: Create an API token
      operationId: createApiToken
      description: The plaintext token is returned only here, once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApiTokenInput"
      responses:
        "201":
          description: Token created (raw response, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-tokens/revoke-all:
    post:
      summary: Revoke every standing API token for the current user
      operationId: revokeAllApiTokens
      description: |
        Issue #413: self-service complement to an admin password reset and the
        recovery-path password reset, both of which already bulk-revoke a
        user's API tokens. Lets a user end every token at once (e.g. a lost
        device) without knowing which one leaked. Already-revoked tokens are
        left untouched and not recounted.
      responses:
        "200":
          description: Tokens revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
                    description: How many previously-active tokens were revoked.
  /api-tokens/{id}:
    delete:
      summary: Revoke an API token
      operationId: revokeApiToken
      description: Soft-revoke (sets revoked_at).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Token revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Token not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api-tokens/{id}/rotate:
    post:
      summary: Revoke a token and reissue a new one with the same name and scope
      operationId: rotateApiToken
      description: |
        Issue #413: revoke + reissue in one round trip, for callers that want
        continuity (a script keeps running under a fresh credential) instead
        of the create-then-revoke two-step. The new plaintext token is shown
        exactly once, like createApiToken's.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "201":
          description: Old token revoked; new token created (raw response, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiTokenCreateResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Token not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Token is already revoked; nothing to rotate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

