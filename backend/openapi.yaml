  /contacts/{id}/timeline:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a contact's merged, paginated, filterable timeline (T66)
      operationId: getContactTimeline
      description: >
        A page of a contact's merged timeline across all six event types —
        note, activity, completion (reminder completions), life_event,
        external_activity, gift — sorted by each event's date (newest first
        by default). Cursor-paginated over a normalized (event_date, type,
        id) key: the opaque cursor resumes strictly after the previous
        page's last item, and every item is returned exactly once when pages
        are walked to the end. Filter with ?type= (comma-separated subset of
        the six tokens; empty means all) and ?bucket= (one of last_7_days,
        last_30_days, last_90_days, this_year, all). Life events sort by
        their resolved date (a PartialDate); undated ideas are not timeline
        gifts. Read-only, scoped to the owning user; unknown type/bucket
        tokens and malformed cursors are 400s, never silent fallbacks.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (event_date, type, id) cursor order.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
        - name: type
          in: query
          description: >
            Comma-separated subset of event types to include. Empty means
            all six. Any unknown token is a 400.
          schema:
            type: string
            example: note,activity
        - name: bucket
          in: query
          description: >
            Recency filter: last_7_days, last_30_days, last_90_days,
            this_year, or all (default).
          schema:
            type: string
            enum: [last_7_days, last_30_days, last_90_days, this_year, all]
            default: all
      responses:
        "200":
          description: A page of merged timeline items.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "400":
          description: Unknown type/bucket token or malformed cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
