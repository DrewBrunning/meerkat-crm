  # --- Admin ---
  /admin/system-events:
    get:
      summary: List operational events (admin)
      operationId: adminListSystemEvents
      description: >
        The system event timeline (issue #424) — reverse-chronological by
        occurrence, filterable by component / severity / event_type /
        correlation_id / time range. Instance-wide operational diagnostics,
        admin-only, read-only. Filter by correlation_id to see every event in
        one chain of work (the timeline's "view related" drill-down).
      parameters:
        - name: component
          in: query
          required: false
          schema: { type: string }
        - name: severity
          in: query
          required: false
          schema: { type: string, enum: [info, warn, error] }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: correlation_id
          in: query
          required: false
          schema: { type: string }
        - name: since
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: ids
          in: query
          required: false
          description: >
            Comma-separated system_events row ids — the exact-row drill-down
            used by the error-aggregation surface (issue #426) to open the
            events behind one cause bucket. Non-numeric tokens are skipped;
            caps at 500.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: System events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  system_events:
                    type: array
                    items:
                      $ref: "#/components/schemas/SystemEvent"
                  total: { type: integer }
        "400":
          description: Invalid since/until timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/subsystem-health:
    get:
      summary: Per-subsystem last-known-good state (admin)
      operationId: adminGetSubsystemHealth
      description: >
        The last-known-good state (issue #427) of every tracked operational
        subsystem — CardDAV sync, CalDAV sync, notification dispatch,
        backup/restore drill, the scheduler, and webhook delivery. For each:
        current status, last attempt / success / failure, the first failure of
        the current incident, the consecutive-failure count, and the most
        recent error. Derived on read from the operational-event stream
        (system_events), so it survives a restart and never drifts. The
        scheduler and webhook subsystems emit only a failure event today, so
        they report `failing` / `unknown` (never `healthy`) until a
        success-side event exists. Instance-wide, admin-only, read-only.
      responses:
        "200":
          description: One entry per tracked subsystem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subsystems:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubsystemHealth"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/job-runs:
    get:
      summary: Background-job run history (admin)
      operationId: adminListJobRuns
      description: >
        Per-run outcome history for the scheduled background jobs (issue #391),
        newest-first: job name, trigger (scheduled / initial / manual),
        start/finish, duration, result (success / failure / skipped), the error
        on the failure path, and — for jobs that report it — the number of items
        processed. Backs the per-job drill-down in the background-job monitor.
        Instance-wide, admin-only, read-only.
      parameters:
        - name: job_name
          in: query
          required: false
          description: Filter to one canonical job name (e.g. daily_reminders).
          schema: { type: string }
        - name: result
          in: query
          required: false
          schema: { type: string, enum: [success, failure, skipped] }
        - name: since
          in: query
          required: false
          description: Only runs started at or after this RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          required: false
          description: Only runs started at or before this RFC3339 timestamp.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          required: false
          description: Max rows to return.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Job-run history, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobRun"
                  total: { type: integer }
        "400":
          description: Invalid since / until timestamp.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/job-runs/health:
    get:
      summary: Per-job background-job run health (admin)
      operationId: adminGetJobRunHealth
      description: >
        The folded run health of every known background job (issue #391),
        derived on read from job_runs: current status, last run / success /
        failure, the consecutive-failure run and its first-failure time, and an
        average / maximum duration trend over recent executed runs (so "normally
        1s, crept to 40s" is visible). Skipped runs are transparent to status
        and the failure streak. Instance-wide, admin-only, read-only.
      responses:
        "200":
          description: One entry per known background job, in scheduler-registration order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/JobRunHealth"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/error-aggregation:
    get:
      summary: Operational errors bucketed by cause (admin)
      operationId: adminGetErrorAggregation
      description: >
        Operational failures over a rolling window (issue #426), aggregated by
        *cause* rather than by raw message: one bucket per (component,
        normalized error string), so the same failure across many runs collapses
        to a single row with a count. Each bucket carries the count, whether it
        recurs, the first/last time it was seen, a sample of the raw error, and
        the exact system_events row ids behind it — pass those to
        `GET /admin/system-events?ids=` to open the underlying events. Derived on
        read from system_events; instance-wide, admin-only, read-only.
      parameters:
        - name: window_hours
          in: query
          required: false
          description: Rolling window to aggregate over, in hours.
          schema: { type: integer, default: 24, minimum: 1, maximum: 168 }
      responses:
        "200":
          description: Error buckets over the window, most frequent first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorAggregationResponse"
        "400":
          description: Invalid window_hours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/notification-health:
    get:
      summary: Per-channel notification delivery health (admin)
      operationId: adminGetNotificationHealth
      description: >
        The delivery-health state of every reminder notification channel —
        email, ntfy, Gotify, and Web Push (issue #422). For each: whether it
        is configured, whether it is currently reachable, how many users have
        it enabled, the last successful delivery / last failure, the
        consecutive-failure run, the last failure reason, and the
        attempted / successfully-delivered totals. Derived on read from
        notification_deliveries and the per-user channel config, so it
        survives a restart and never drifts. The status separates three
        different remedies: `unconfigured` (nothing to deliver on), `failing`
        (configured but the last attempt failed), and `no_devices` (push is
        provisioned but no browser subscription / mobile device can receive —
        not a red failure). Instance-wide, admin-only, read-only. Never
        contains a Gotify token or per-user delivery content.
      responses:
        "200":
          description: One entry per delivery channel, in dispatch order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  channels:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationChannelHealth"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/diagnostics:
    get:
      summary: Run instance diagnostics (admin)
      operationId: adminRunDiagnostics
      description: >
        The admin-gated "is this install healthy?" sweep (issue #423) — run
        after an install, an upgrade, a migration, or a config change. One
        read-only pass folds the same single-check paths the continuous
        surfaces use into an ok / warning / error checklist with a summary
        ("2 warnings, 0 errors"): configuration and required environment
        variables (redacted — only the *names* of failing variables are ever
        reported), database connectivity + migration state, filesystem
        writability for the storage directories (profile photos, attachments,
        the database directory where backups land by default) + the FCM
        service-account file, the persisted restore-drill result (the latest
        backup-validity proof), per-channel notification delivery health,
        integration reachability (CardDAV/CalDAV serve locally; the distinct
        configured Immich / Paperless / Seafile / Nextcloud base URLs are
        probed with a short timeout, honoring each integration's
        block-private-URLs SSRF policy), disk usage, background-job liveness,
        and version/update state.

        Every check is time-bounded and the whole sweep runs under a total
        budget, so an unreachable remote cannot hang it. The response never
        contains a secret: config values are not echoed and integration base
        URLs / transport errors go to the log only. A broken install still
        returns 200 — the diagnosis IS the payload. Instance-wide,
        admin-only, read-only.
      responses:
        "200":
          description: The diagnostics checklist and summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticsResponse"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/integrity-check:
    get:
      summary: Run the data-integrity checker (admin)
      operationId: adminRunIntegrityCheck
      description: >
        The on-demand data-integrity sweep (DB-01, issue #460) — the "is the
        data meaningful?" check an operator runs after a restore, a migration,
        or a bulk import. It folds two passes:

        - the storage pass: `PRAGMA integrity_check` (pages, indexes, b-tree
          structure) and `PRAGMA foreign_key_check` (declared foreign keys with
          no parent — a hole only possible if enforcement was ever bypassed);

        - the data pass: one probe per invariant in
          `docs/adrs/0012-canonical-database-invariants.md` —
          relationships pointing at a missing or soft-deleted contact,
          reciprocal-type-registry inconsistency, orphaned circle/household/tag
          memberships and field values, dangling external references, missing
          attachment/photo files, malformed `Card` JSON, and FTS index
          divergence.

        Read-only and secret-free: every finding carries a table/column name
        and a row count, never a value, an id, or a file path. Detection only —
        there is no repair over HTTP; the `doctor` CLI performs repair behind
        an explicit `-confirm`. A broken database still returns HTTP 200 with
        `ok: false` — the diagnosis IS the payload. Instance-wide, admin-only.
      responses:
        "200":
          description: The combined storage + data integrity report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrityCheckResponse"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/system-status:
    get:
      summary: Aggregated system status (admin)
      operationId: adminGetSystemStatus
      description: >
        The authenticated, admin-scoped operational snapshot (issue #388): the
        rolled-up deep-health status and its full per-facet breakdown (the same
        value GET /health returns), build identity, process uptime, migration
        numbers (applied / latest / pending / dirty), a live read-back of
        cfg.Validate(), the enabled feature-flag set, SQLite operational facts
        (version, journal mode, -wal size), storage sizing (database
        footprint, the filesystem holding it, and a recursive walk of each
        configured storage directory), and the opt-in update-availability
        block (issue #650). This is the counterpart to the
        unauthenticated /health surface, which deliberately withholds
        build/version, migration numbers and storage facts, and to /metrics,
        which is Prometheus-only behind METRICS_TOKEN. Instance-wide,
        admin-only, read-only. Carries no secret value — the feature block is
        booleans only, and each config-validation entry is a field name plus a
        remediation message, never the offending value.
      responses:
        "200":
          description: The system-status snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatus"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.

  /admin/users:
    get:
      summary: List all users (admin)
      operationId: adminListUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
      responses:
        "200":
          description: A page of users.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersListResponse"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.
    post:
      summary: Create a new user (admin)
      operationId: adminCreateUser
      description: >
        Password is set directly by the admin, matching the existing admin-reset
        pattern (PATCH's password field) rather than an invite-email flow.
        Reuses the same username/email/password validation as self-registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserCreateInput"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Validation failed (weak password, missing fields, etc).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (cookie or full-scope bearer token required).
        "403":
          description: Not an admin, or an API token was used on an admin path.
        "409":
          description: Username or email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a user (admin)
      operationId: adminGetUser
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: Update a user (admin)
      operationId: adminUpdateUser
      description: Setting a password bumps the user's token_version (kills their sessions). You cannot remove your own admin status or demote the last admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdateInput"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Non-integer id or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cannot remove your own admin status or the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username or email already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a user and all their data (admin)
      operationId: adminDeleteUser
      description: Hard-deletes the user and every dependent table in a transaction. Cannot delete your own account or the last admin.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Cannot delete your own account or the last admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/reset-2fa:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Reset a user's two-factor authentication (admin)
      operationId: adminResetUserTwoFactor
      description: >
        Operator-side recovery for a user locked out of their own account
        (TOTP device and recovery codes both lost). Disables TOTP and
        hard-deletes all recovery codes for the target user, and bumps their
        token_version (kills their sessions). Unlike the self-service
        disable-2FA endpoint, requires no proof from the target — the acting
        admin's own authenticated session is the trust boundary. Idempotent:
        calling this on a user with no 2FA enabled is a no-op that still
        returns 200.
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/trigger-reminders:
    post:
      summary: Trigger the reminder email job now (admin)
      operationId: adminTriggerReminders
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Job ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "500":
          description: The job failed.
  /admin/trigger-purge:
    post:
      summary: Trigger the retention purge jobs now (admin)
      operationId: adminTriggerPurge
      description: Runs the soft-delete, contact-share, and webhook-delivery retention purges on demand. Best-effort; always reports success.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Purge ran.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /admin/search/rebuild:
    post:
      summary: Rebuild the FTS search index (admin)
      operationId: adminRebuildSearchIndex
      description: >
        Rebuilds all three FTS5 full-text indexes (contacts, notes,
        activities) from canonical base-table data (T11, SEARCH-01 issue
        #461). Idempotent — the index is derived data, so a rebuild always
        converges on what the maintenance triggers would have produced. Run it
        after a bulk import, a raw-SQL migration that bypassed the FTS
        triggers, or a restore from backup.


        The whole rebuild runs in one transaction: an interruption leaves the
        previous index intact, never a partial one, and search keeps serving
        the old index until the rebuild commits. The rebuild is recorded as a
        `search_index_rebuild` job run (visible via GET /admin/job-runs). A
        rebuild already in progress returns 409.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A rebuild is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The rebuild failed; the previous index is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Index rebuilt.
          content:
            application/json:
              schema:
                type: object
                required: [message, indexed]
                properties:
                  message:
                    type: string
                    example: Search index rebuilt
                  indexed:
                    type: object
                    description: Rows written to each FTS index (live rows only).
                    required: [contacts, notes, activities]
                    properties:
                      contacts: { type: integer, format: int64, example: 1284 }
                      notes: { type: integer, format: int64, example: 4021 }
                      activities: { type: integer, format: int64, example: 903 }
  /admin/contacts/rebuild-derived:
    post:
      summary: Rebuild the denormalized contact columns (admin)
      operationId: adminRebuildDerivedColumns
      description: >
        Re-derives every live contact's denormalized columns — the flat
        `contacts.*` projection scalars, `sort_name`, `addresses_flat` and
        `phones_normalized` — from the authoritative nested Card (issue #497).
        The flat-column analogue of POST /admin/search/rebuild. Idempotent —
        these columns are derived data, so a rebuild always converges on what a
        plain re-save through the ordinary write path would have produced. Run
        it after a bulk import that INSERTed contact rows directly, a raw-SQL
        migration that touched a base column, or a restore from backup; run it
        alongside the search-index rebuild.


        Commits page by page rather than in one transaction, so an interrupted
        run resumes cleanly and a large instance never holds the write lock for
        the whole pass. Recorded as a `derived_columns_rebuild` job run
        (visible via GET /admin/job-runs). A rebuild already in progress
        returns 409. On a faithful database it rewrites nothing.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A rebuild is already in progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: The rebuild failed; every page it had already committed is correct.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: Derived columns rebuilt.
          content:
            application/json:
              schema:
                type: object
                required: [message, contacts_scanned, contacts_updated]
                properties:
                  message:
                    type: string
                    example: Derived contact columns rebuilt
                  contacts_scanned: { type: integer, format: int64, example: 1284 }
                  contacts_updated: { type: integer, format: int64, example: 0 }
                  column_updates:
                    type: object
                    nullable: true
                    description: >
                      Per-column count of rows rewritten; null when nothing
                      drifted. Keys are column names
                      (`firstname`, `sort_name`, `addresses_flat`, …).
                    additionalProperties: { type: integer, format: int64 }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: auth_token
      description: The httpOnly session cookie set by POST /login and the OIDC callback.
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        A JWT or a `mycorrhizal_…` API token. On the general REST path a
        carddav-scoped token is rejected with 403 (only `full`-scope tokens
        work); API tokens are rejected on every /admin path entirely.
  parameters:
    IfMatchRevision:
      name: If-Match
      in: header
      required: false
      description: >
        CON-01 optimistic-concurrency precondition (issue #456, ADR 0008).
        Optional: when present, the write proceeds only if the target row's
        current `revision` (issue #591, ADR 0006) matches; a mismatch is
        rejected with 412 Precondition Failed and the row is left untouched.
        When absent, the write is unconditional (last-writer-wins), unchanged
        from before this feature. The value is the decimal `revision` integer
        the client last read — quotes optional, an optional weak `W/` prefix is
        tolerated, `*` matches any existing row, and a comma-separated list
        matches if any member matches. This is the bare `revision` integer, not
        the CardDAV `etag` string derived from it.
      schema:
        type: string
        example: '"7"'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >
        CON-04 retry-safety key (issue #459, ADR 0010). Optional, and honoured
        on **every authenticated POST** (the middleware is installed once on the
        whole group). When a client that cannot tolerate an ambiguous failure
        — the write committed but the response was lost — sends an opaque key,
        the first request runs the handler and its outcome is stored; every
        later request with the same key and the same body replays that stored
        response verbatim (with an `Idempotency-Replayed: true` response
        header) without re-running the handler, so exactly one row and one side
        effect (webhook, push) result no matter how many retries. Reusing a key
        with a *different* request body is `422 IDEMPOTENCY_KEY_REUSED`; a
        retry that arrives while the first call is still in flight is
        `409 IDEMPOTENCY_IN_PROGRESS` (retry shortly). Keys are retained for
        `IDEMPOTENCY_KEY_RETENTION_HOURS` (default 24). `PUT`/`DELETE` are
        already idempotent and ignore this header.
      schema:
        type: string
        maxLength: 255
        example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
  schemas:
    # --- Common ---
    Error:
      type: object
      description: The standard error envelope produced by apperrors.AbortWithError.
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
    SyncInfo:
      type: object
      description: >
        T17 sync-mode contract carried by every cursor-paginated list
        response. `mode` is how THIS collection syncs; the two arrays are the
        static map of every syncable collection, so a client can plan a full
        sync without hardcoding endpoint names. Incremental collections are
        soft-deleted, support ?since= change feeds, and drop `total`;
        full_resync collections are hard-deleted, are re-pulled wholesale, and
        keep `total`.
      properties:
        mode: { type: string, enum: [incremental, full_resync] }
        incremental:
          type: array
          items: { type: string }
          description: "Collections that sync incrementally via ?since=: contacts, notes, activities, life_events, preferences, cadence_policies, conversation_agenda, gifts."
        full_resync:
          type: array
          items: { type: string }
          description: "Collections that require a full re-pull: circles, households, tags, relationship_edges, field_definitions, external_identities, external_activities."
    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }
      additionalProperties: true
    LogoutResponse:
      type: object
      properties:
        message: { type: string }
        redirect_url: { type: string, description: "Present only for OIDC sessions whose provider advertises an end-session endpoint." }
    LivenessResponse:
      type: object
      properties:
        status: { type: string, enum: [live] }
    ReadinessResponse:
      type: object
      description: >
        checks maps each readiness facet (database, migrations, filesystem) to
        its status; any failed facet makes the overall status not_ready and the
        response 503.
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, failed] }
              reason: { type: string }
    HealthCheckDetail:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded, unhealthy, not_configured] }
        reason: { type: string }
    HealthResponse:
      type: object
      description: >
        The flat status/database/version fields are retained from the
        pre-split /health; the per-facet breakdown is under checks.
      properties:
        status: { type: string, enum: [healthy, degraded, unhealthy] }
        timestamp: { type: string, format: date-time }
        database:
          type: object
          properties:
            status: { type: string, enum: [healthy, unhealthy] }
            response_time_ms: { type: number }
        version: { type: string, example: "0.1.0" }
        commit: { type: string }
        build_date: { type: string }
        checks:
          type: object
          properties:
            status: { type: string, enum: [healthy, degraded, unhealthy] }
            database: { $ref: "#/components/schemas/HealthCheckDetail" }
            migrations: { $ref: "#/components/schemas/HealthCheckDetail" }
            integrity_check: { $ref: "#/components/schemas/HealthCheckDetail" }
            restore_drill: { $ref: "#/components/schemas/HealthCheckDetail" }
            background_jobs:
              type: object
              properties:
                status: { type: string, enum: [ok, degraded] }
                reason: { type: string }
                jobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      last_run_at: { type: string, format: date-time }
                      locked: { type: boolean }
                      stuck: { type: boolean }
            integrations:
              type: object
              additionalProperties: { $ref: "#/components/schemas/HealthCheckDetail" }

    # --- Auth & users ---
    UserRegistrationInput:
      type: object
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, example: "correct-horse-battery-staple-9" }
        language: { type: string, enum: [en, de, it, es, fr] }
    LoginInput:
      type: object
      properties:
        identifier: { type: string, description: "Username or email." }
        email: { type: string, description: "Legacy alias for identifier." }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        language: { type: string }
        date_format: { type: string }
        two_factor_required:
          type: boolean
          description: "Present and true when the account has 2FA enabled: a session is NOT issued; POST /login/2fa with a TOTP/recovery code completes the login."
    TwoFactorCodeInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: "A 6-digit TOTP code or a recovery code (XXXXX-XXXXX-XXXXX)."
    TwoFactorStatusResponse:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    TwoFactorSetupResponse:
      type: object
      required: [secret, otpauth_url]
      properties:
        secret: { type: string, description: "Base32 TOTP shared secret (plaintext, shown exactly once)." }
        otpauth_url: { type: string, description: "otpauth:// URI for the QR code." }
    TwoFactorConfirmResponse:
      type: object
      properties:
        message: { type: string }
        recovery_codes:
          type: array
          items: { type: string }
          description: "The new single-use recovery codes, returned plaintext exactly once."
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirmInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 16 }
        password: { type: string, minLength: 8, example: "correct-horse-battery-staple-9" }
    ChangePasswordInput:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 8, example: "correct-horse-battery-staple-9" }
    UpdateLanguageInput:
      type: object
      required: [language]
      properties:
        language: { type: string, enum: [en, de, it, es, fr] }
    UpdateDateFormatInput:
      type: object
      required: [date_format]
      properties:
        date_format: { type: string, enum: [eu, us, iso, ca, eu-hyphen, us-mmm, us-mmmm, eu-mmm, eu-mmmm] }
    EnabledContactFieldsInput:
      type: object
      properties:
        fields:
          type: array
          items: { type: string, maxLength: 50 }
          description: "Nil/absent resets to the client default set."
    PasswordStrength:
      type: object
      properties:
        is_valid: { type: boolean }
        entropy: { type: number }
        score: { type: integer, description: "0-4 (weak..very strong)." }
        feedback: { type: string }
        min_entropy: { type: number }
        char_set_size: { type: integer }
        length: { type: integer }
    OIDCConfigResponse:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        provider_name: { type: string, description: "Present only when enabled." }
    AdminUserResponse:
      type: object
      description: A user as seen by admins (and by /users/me, which adds enabled_contact_fields).
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        language: { type: string }
        date_format: { type: string }
        is_admin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CurrentUserResponse:
      allOf:
        - $ref: "#/components/schemas/AdminUserResponse"
        - type: object
          properties:
            enabled_contact_fields:
              type: array
              items: { type: string }
              nullable: true
            self_contact_vcard_uid:
              type: string
              nullable: true
              description: VCardUID of the caller's "Me" contact, if set (T90).
    SelfContactInput:
      type: object
      description: >
        Body for PATCH /users/me/self-contact. A null/empty vcard_uid clears
        the link; a non-empty value must resolve to a non-deleted contact
        owned by the caller.
      properties:
        vcard_uid:
          type: string
          format: uuid
          nullable: true
    AdminUsersListResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUserResponse"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
        total_pages: { type: integer }
    AdminUserUpdateInput:
      type: object
      description: All fields optional; only supplied fields are changed.
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, example: "correct-horse-battery-staple-9" }
        is_admin: { type: boolean }
    AdminUserCreateInput:
      type: object
      description: Unlike self-registration, is_admin may be set directly (the caller already passed admin auth to reach this route).
      required: [username, email, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, example: "correct-horse-battery-staple-9" }
        is_admin: { type: boolean, default: false }

    # --- Contacts ---
    ContactSummary:
      type: object
      description: >
        Slim per-item shape for GET /contacts (list) — wraps
        contactmodel.Projection's own fields plus identity/photo.
      properties:
        id: { type: integer }
        uid: { type: string }
        firstname: { type: string }
        lastname: { type: string }
        nickname: { type: string }
        fn: { type: string, description: "Full/display name (vCard FN)." }
        primary_email: { type: string }
        primary_phone: { type: string }
        birthday: { type: string, description: "ISO YYYY-MM-DD or year-less --MM-DD." }
        org: { type: string }
        photo: { type: string }
        photo_thumbnail:
          type: string
          description: >
            M6: relative URL to the contact's profile-picture endpoint
            (GET /contacts/{id}/profile_picture), preferring ?thumbnail=true
            when a base64 thumbnail is stored. Omitted entirely when the
            contact has no photo. Never the raw base64 data URI or a legacy
            disk-file name.
        archived: { type: boolean }
        is_favorite:
          type: boolean
          description: >
            Issue #173: whether the caller marked this contact as a favorite.
            Always present (a false default is still on the wire so clients
            can treat it as required). CRM-local — never exported or synced.
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only,
            always present (migration 000044 backfills every row). Two writes
            inside the same second produce different revisions — the token a
            client echoes back in a conditional write (ADR 0006).
        deleted:
          type: boolean
          description: >
            Change-feed tombstone marker (T17): true only when the row was
            returned by ?since= as a soft-deleted contact. Never set on a
            plain list request.
          default: false
    ContactSummaryWithRelations:
      description: ContactSummary extended with the sub-resource arrays requested via includes=.
      allOf:
        - $ref: "#/components/schemas/ContactSummary"
        - type: object
          properties:
            notes: { type: array, items: { type: object } }
            activities: { type: array, items: { type: object } }
            reminders: { type: array, items: { type: object } }
    ContactRecordInput:
      type: object
      description: >
        Request body for POST /contacts and PUT /contacts/{id}. Gender rides
        alongside card/crm for backward compat, and now ALSO inside
        crm.gender (issue #515, its authoritative neutral-model home — the
        read path echoes it there). When both are present, crm.gender wins.
      properties:
        gender:
          type: string
          enum: [male, female, other, prefer_not_to_say]
        card:
          $ref: "#/components/schemas/Card"
        crm:
          $ref: "#/components/schemas/CRMEnvelope"
        passthrough:
          $ref: "#/components/schemas/Passthrough"
    ContactRecordResponse:
      type: object
      description: Full neutral detail-view response for GET/POST/PUT /contacts.
      properties:
        id: { type: integer }
        uid: { type: string }
        etag: { type: string }
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only,
            always present. The etag above is derived from it
            (e-{id}-{revision}); a client reads revision to build a
            conditional write (ADR 0006).
        gender: { type: string }
        card:
          $ref: "#/components/schemas/Card"
        crm:
          $ref: "#/components/schemas/CRMEnvelope"
        passthrough:
          $ref: "#/components/schemas/Passthrough"
        photo: { type: string }
        photo_thumbnail:
          type: string
          description: >
            M6: relative URL to the contact's profile-picture endpoint
            (GET /contacts/{id}/profile_picture), preferring ?thumbnail=true
            when a base64 thumbnail is stored. Omitted entirely when the
            contact has no photo. The Card.Media photo entry's uri carries
            the same URL (full-photo variant) on this response.
        archived: { type: boolean }
        is_favorite:
          type: boolean
          description: >
            Issue #173: whether the caller marked this contact as a favorite.
            Always present. CRM-local — never exported or synced.
        notes: { type: array, items: { type: object } }
        activities: { type: array, items: { type: object } }
        reminders: { type: array, items: { type: object } }
    DashboardResponse:
      type: object
      description: >
        Read-only M3 dashboard composite (GET /dashboard). Pure aggregation
        of existing per-user queries; every block is always present and
        serializes as `[]` when empty, never `null`/absent.
      properties:
        birthdays:
          type: array
          items: { $ref: "#/components/schemas/Birthday" }
        random_contacts:
          type: array
          items: { $ref: "#/components/schemas/ContactResponse" }
        favorites:
          type: array
          description: >
            Issue #173: the caller's favorite, non-archived contacts, sorted
            by name (a quick-access block alongside random_contacts).
          items: { $ref: "#/components/schemas/ContactResponse" }
        upcoming_reminders:
          type: array
          items: { $ref: "#/components/schemas/DashboardReminder" }
        overdue:
          type: array
          items: { $ref: "#/components/schemas/OverdueCadence" }
        reach_out_suggestions:
          type: array
          description: "Issue #177: pending event-driven reach-out suggestions."
          items: { $ref: "#/components/schemas/ReachOutSuggestion" }
    DashboardReminder:
      description: >
        A Reminder enriched with its contact's display name (nickname-
        preferred, falling back to firstname+lastname), so the dashboard
        composite's consumer never needs a second per-reminder fetch.
      allOf:
        - $ref: "#/components/schemas/Reminder"
        - type: object
          properties:
            contact_name: { type: string }
    ContactDetailResponse:
      type: object
      description: >
        Read-only M4 contact-detail composite (GET /contacts/{id}/detail).
        Pure aggregation of existing per-contact queries; every collection
        block is always present and serializes as `[]` when empty, never
        `null`/absent. `immich` is the one legitimately-absent block (present
        only when the user has an Immich config at all).
      properties:
        contact:
          $ref: "#/components/schemas/ContactRecordResponse"
        user:
          $ref: "#/components/schemas/ContactDetailUser"
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        completions:
          type: array
          items: { $ref: "#/components/schemas/ReminderCompletion" }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
        relationship_edges:
          type: array
          items: { $ref: "#/components/schemas/BriefingRelationship" }
        life_events:
          type: array
          items: { $ref: "#/components/schemas/ContactDetailLifeEvent" }
        agenda:
          type: array
          items: { $ref: "#/components/schemas/ConversationAgenda" }
        gifts:
          type: array
          items: { $ref: "#/components/schemas/Gift" }
        field_values:
          type: array
          items: { $ref: "#/components/schemas/FieldValue" }
        external_identities:
          type: array
          items: { $ref: "#/components/schemas/ExternalIdentity" }
        external_activities:
          type: array
          items: { $ref: "#/components/schemas/ExternalActivity" }
        circles:
          type: array
          description: This contact's circle memberships (not the global per-user list GET /circles returns).
          items: { $ref: "#/components/schemas/Circle" }
        tags:
          type: array
          description: This contact's tags (not the global per-user list GET /tags returns).
          items: { $ref: "#/components/schemas/Tag" }
        immich:
          $ref: "#/components/schemas/ContactDetailImmich"
    ContactDetailUser:
      type: object
      description: The current user's fields the detail screen needs — deliberately thinner than the admin user object.
      properties:
        enabled_contact_fields:
          type: array
          items: { type: string }
          nullable: true
          description: Null when the user has never configured their visible fields (the client then applies its default set).
    ContactDetailLifeEvent:
      description: A LifeEvent enriched with its RelatedEntityIDs' display names, batch-resolved once per contact.
      allOf:
        - $ref: "#/components/schemas/LifeEvent"
        - type: object
          properties:
            related_entity_names:
              type: object
              additionalProperties: { type: string }
              description: Keyed by Contact.VCardUID.
    ContactDetailImmich:
      type: object
      description: >
        Present only when the requesting user has an Immich config, regardless
        of whether this particular contact is linked to an Immich person yet.
      properties:
        summary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImmichPersonSummary"
    TimelineItem:
      type: object
      description: >
        One entry in a contact's merged timeline (T66): the raw entity under
        `data`, plus the normalized sort key the merge and cursor are built
        on. `type` discriminates which entity shape `data` carries — note,
        activity, completion, life_event, external_activity, or gift. `id` is
        always the entity's primary key as a string (the six tables mix uint
        and UUID-string PKs). `date` is the resolved event date the timeline
        sorts on: the entity's own timestamp for the five timestamped types,
        and the resolved PartialDate for life events.
      required: [type, id, date, data]
      properties:
        type:
          type: string
          enum: [note, activity, completion, life_event, external_activity, gift]
        id: { type: string }
        date: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: "#/components/schemas/Note"
            - $ref: "#/components/schemas/Activity"
            - $ref: "#/components/schemas/ReminderCompletion"
            - $ref: "#/components/schemas/LifeEvent"
            - $ref: "#/components/schemas/ExternalActivity"
            - $ref: "#/components/schemas/Gift"
          description: The raw entity, whose shape follows `type`.
    TimelineResponse:
      type: object
      description: >
        One page of the merged timeline (GET /contacts/{id}/timeline). Items
        serialize as `[]` when the page is empty, never `null`/absent.
        `next_cursor` is empty when there are no more rows; walking pages by
        following it returns every matching item exactly once.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TimelineItem" }
        next_cursor:
          type: string
          description: Resume token for the next page; empty when there are no more rows.
        limit: { type: integer }
    ContactBriefing:
      type: object
      description: >
        Read-only N2 prep-view composition (GET /contacts/{id}/briefing). A
        pure aggregation of existing data; every block degrades to empty when
        its source is absent or the feature isn't built yet.
      properties:
        contact_id: { type: integer }
        uid: { type: string }
        name: { type: string }
        photo_thumbnail: { type: string }
        kind: { type: string, description: "CRMEnvelope.Kind (human|animal)" }
        last_activity:
          $ref: "#/components/schemas/BriefingActivity"
        recent_notes:
          type: array
          items: { type: object }
        cadence:
          $ref: "#/components/schemas/BriefingCadence"
        open_agenda_items:
          type: array
          items: { $ref: "#/components/schemas/ConversationAgenda" }
        relationships:
          type: array
          items: { $ref: "#/components/schemas/BriefingRelationship" }
        life_events:
          type: array
          items: { $ref: "#/components/schemas/LifeEvent" }
        upcoming_reminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
        upcoming_dates:
          type: array
          items: { $ref: "#/components/schemas/BriefingUpcomingDate" }
    BriefingActivity:
      type: object
      description: Slim projection of an Activity shown as the briefing's "last interaction".
      properties:
        id: { type: integer }
        uuid: { type: string }
        title: { type: string }
        description: { type: string }
        type: { type: string }
        location: { type: string }
        date: { type: string, format: date-time }
    BriefingCadence:
      type: object
      description: A contact's cadence policy bundled with its derived health.
      properties:
        policy:
          $ref: "#/components/schemas/CadencePolicy"
        health:
          $ref: "#/components/schemas/BriefingCadenceHealth"
    BriefingCadenceHealth:
      type: object
      description: >
        The DERIVED relationship-health read-model , never stored.
        has_qualifying_interaction stays false until the contact has at least
        one qualifying interaction; overdue_by is whole calendar days past due
        (0 when due today or later).
      properties:
        has_qualifying_interaction: { type: boolean }
        last_interaction: { type: string, format: date-time, nullable: true }
        next_due: { type: string, format: date-time, nullable: true }
        overdue_by: { type: integer }
    BriefingRelationship:
      type: object
      description: One confirmed relationship edge resolved for display.
      properties:
        edge:
          $ref: "#/components/schemas/RelationshipEdge"
        other_party_contact_id:
          type: integer
          description: The other contact's numeric ID (for linking to /contacts/:id).
        other_party_name: { type: string }
        other_party_uid: { type: string }
        display_token:
          type: string
          description: >
            relationship_type_registry token describing the other party from
            this contact's perspective.
    BriefingUpcomingDate:
      type: object
      description: One upcoming birthday/anniversary for the briefing.
      properties:
        label: { type: string, enum: [birthday, anniversary] }
        date: { type: string, description: "YYYY-MM-DD or --MM-DD" }
        days_until: { type: integer }
    ContactFlat:
      type: object
      description: >
        The raw serialization of models.Contact (legacy flat DTO) returned by
        the archive/unarchive, random, and profile-picture endpoints. Because
        Contact embeds gorm.Model (which has no JSON tags), identity/timestamp
        keys serialize in PascalCase. The collection fields (circles, emails,
        phones, addresses, urls, impps) serialize as `null` when empty — a
        nil Go slice has no omitempty — never as `[]`; a client must accept
        null here (the neutral Card endpoints never emit this shape).
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        firstname: { type: string }
        lastname: { type: string }
        nickname: { type: string }
        gender: { type: string }
        email: { type: string }
        phone: { type: string }
        birthday: { type: string }
        photo: { type: string }
        address: { type: string }
        how_we_met: { type: string }
        work_information: { type: string }
        contact_information: { type: string }
        circles:
          type: array
          items: { type: string }
          nullable: true
        emails:
          type: array
          items: { $ref: "#/components/schemas/ContactEmail" }
          nullable: true
        phones:
          type: array
          items: { $ref: "#/components/schemas/ContactPhone" }
          nullable: true
        addresses:
          type: array
          items: { $ref: "#/components/schemas/ContactAddress" }
          nullable: true
        urls:
          type: array
          items: { $ref: "#/components/schemas/ContactURL" }
          nullable: true
        impps:
          type: array
          items: { $ref: "#/components/schemas/ContactIMPP" }
          nullable: true
        prefix: { type: string }
        middle_name: { type: string }
        suffix: { type: string }
        organization: { type: string }
        department: { type: string }
        job_title: { type: string }
        role: { type: string }
        anniversary: { type: string }
        archived: { type: boolean }
        activities:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/Note" }
        reminders:
          type: array
          items: { $ref: "#/components/schemas/Reminder" }
    ContactResponse:
      description: ContactFlat plus the always-present photo_thumbnail, as returned by GET /contacts/random.
      allOf:
        - $ref: "#/components/schemas/ContactFlat"
        - type: object
          properties:
            photo_thumbnail: { type: string }
    ContactEmail:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, format: email }
    ContactPhone:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string }
    ContactURL:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, format: uri, maxLength: 500 }
    ContactIMPP:
      type: object
      properties:
        type: { type: string, maxLength: 30 }
        value: { type: string, maxLength: 200 }
    ContactAddress:
      type: object
      description: >
        One structured postal address in the flat legacy shape. The three
        sub-street fields (PO box, apartment, floor) were added in T79
        (T79);
        the remaining RFC 9553 component kinds ride the nested Card shape's
        AddressComponent kinds instead.
      properties:
        type: { type: string, maxLength: 30 }
        street: { type: string, maxLength: 500 }
        pobox: { type: string, maxLength: 200 }
        apartment: { type: string, maxLength: 200 }
        floor: { type: string, maxLength: 100 }
        city: { type: string, maxLength: 200 }
        region: { type: string, maxLength: 200 }
        postal: { type: string, maxLength: 30 }
        country: { type: string, maxLength: 100 }
    Birthday:
      type: object
      description: One upcoming contact birthday.
      properties:
        type: { type: string, example: "contact" }
        name: { type: string }
        birthday: { type: string, description: "ISO YYYY-MM-DD." }
        photo_thumbnail: { type: string }
        contact_id: { type: integer }

    # --- Duplicate scan (T93) ---
    DuplicatePair:
      type: object
      properties:
        a:
          $ref: "#/components/schemas/ContactSummary"
        b:
          $ref: "#/components/schemas/ContactSummary"
        reasons:
          type: array
          description: >
            The full set of tiers both contacts matched on, in canonical
            order (email, name, phone). Never just the first hit.
          items:
            type: string
            enum: [email, name, phone]
        confidence:
          type: number
          format: float
          description: >
            0-1 heuristic for how likely the pair really is a duplicate — a
            pure function of which tiers matched (phone+email ~0.95, name
            alone ~0.5). The review surface sorts by it.
      required: [a, b, reasons, confidence]
    DuplicatePairsResponse:
      type: object
      properties:
        pairs:
          type: array
          description: "Candidate pairs, strongest first. Always an array, never null."
          items:
            $ref: "#/components/schemas/DuplicatePair"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [pairs, total, page, limit]
    DuplicateDismissalInput:
      type: object
      required: [uid_a, uid_b]
      properties:
        uid_a:
          type: string
          format: uuid
          description: "One contact's VCardUID."
        uid_b:
          type: string
          format: uuid
          description: "The other contact's VCardUID."

    # --- Contact merge ---
    ContactMergeRequest:
      type: object
      required: [keep_id, merge_id]
      properties:
        keep_id: { type: integer, minimum: 1 }
        merge_id: { type: integer, minimum: 1 }
        resolutions:
          type: object
          additionalProperties: { type: string }
          description: "Required on commit for every conflicting field; ignored on preview. Keyed by scalar field name or FieldDefinition.ID."
    ContactMergePreviewResponse:
      type: object
      properties:
        keep_id: { type: integer }
        merge_id: { type: integer }
        resolution:
          $ref: "#/components/schemas/ContactMergeResolution"
        association_counts:
          $ref: "#/components/schemas/ContactMergeAssociationCounts"
    ContactMergeResolution:
      type: object
      properties:
        emails:
          type: array
          items: { $ref: "#/components/schemas/ContactEmail" }
        phones:
          type: array
          items: { $ref: "#/components/schemas/ContactPhone" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/ContactAddress" }
        urls:
          type: array
          items: { $ref: "#/components/schemas/ContactURL" }
        impps:
          type: array
          items: { $ref: "#/components/schemas/ContactIMPP" }
        circles:
          type: array
          items: { type: string }
        resolved_scalars:
          type: object
          additionalProperties: { type: string }
          description: Complete post-merge value of every scalar field, including agreed ones.
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/ContactMergeFieldConflict" }
        field_value_conflicts:
          type: array
          items: { $ref: "#/components/schemas/ContactMergeFieldConflict" }
    ContactMergeFieldConflict:
      type: object
      properties:
        field: { type: string }
        label: { type: string }
        keeper_value: { type: string }
        loser_value: { type: string }
    ContactMergeAssociationCounts:
      type: object
      properties:
        notes: { type: integer }
        activities: { type: integer }
        reminders: { type: integer }
        reminder_completions: { type: integer }
        relationship_edges: { type: integer }
        household_memberships: { type: integer }
        circle_memberships: { type: integer }
        tags: { type: integer }
        life_events: { type: integer }
        life_event_references: { type: integer }
        field_values: { type: integer }
        contact_sync_links: { type: integer }
        attachments: { type: integer }
        preferences: { type: integer }
        external_identities: { type: integer }
        external_activities: { type: integer }
        cadence_policies: { type: integer, description: "0 or 1 -- at most one per contact." }
        reach_out_suggestions: { type: integer, description: "Issue #177." }

    # --- Notes / Activities / Reminders (gorm.Model PascalCase identity) ---
    Note:
      type: object
      description: >
        A note. Emits gorm.Model identity/timestamps in PascalCase and always
        includes a nested contact object (struct value, never omitted).
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        content: { type: string, maxLength: 5000 }
        date: { type: string, format: date-time }
        contact_id: { type: integer, nullable: true }
        contact:
          $ref: "#/components/schemas/ContactFlat"
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only.
            New in migration 000044 — notes never carried a sync token before.
            A client reads it to build a conditional write (ADR 0006).
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted note."
          default: false
    NoteInput:
      type: object
      required: [content, date]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        date: { type: string, format: date-time }
        contact_id: { type: integer, minimum: 1, nullable: true }
    Activity:
      type: object
      description: >
        An activity/Interaction. gorm.Model identity keys in PascalCase.
        Type is a conventional, open classifier (call, visit, meal, message,
        gift, photo, ...).
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        uuid: { type: string }
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 300 }
        date: { type: string, format: date-time }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/ContactFlat" }
        type: { type: string }
        external_ref: { type: string }
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only.
            The CalDAV etag is derived from it. A client reads it to build a
            conditional write (ADR 0006).
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted activity."
          default: false
    ActivityInput:
      type: object
      required: [title, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        location: { type: string, maxLength: 300 }
        date: { type: string, format: date-time }
        contact_ids:
          type: array
          items: { type: integer }
        type: { type: string }
        external_ref: { type: string }
    Reminder:
      type: object
      description: >
        A reminder. Doubles as the request body for create/update, so the
        required fields (message, remind_at, recurrence, contact_id) must be
        present on every write.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        message: { type: string, minLength: 1, maxLength: 500 }
        by_mail: { type: boolean, nullable: true }
        remind_at: { type: string, format: date-time }
        recurrence: { type: string, enum: [once, weekly, monthly, quarterly, six-months, yearly] }
        reoccur_from_completion: { type: boolean, nullable: true }
        completed: { type: boolean }
        email_sent: { type: boolean }
        last_sent: { type: string, format: date-time, nullable: true }
        contact_id: { type: integer, nullable: true }
        life_event_id: { type: string }
        contact:
          $ref: "#/components/schemas/ContactFlat"
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only.
            New in migration 000044 — reminders never carried a sync token
            before. A client reads it to build a conditional write (ADR 0006).
    ReminderCompleteResponse:
      type: object
      description: "Recurring reminders return reminder + message; once reminders are soft-deleted and return only a message."
      properties:
        message: { type: string }
        reminder:
          $ref: "#/components/schemas/Reminder"
    ReminderCompletion:
      type: object
      description: A timeline entry recording that a reminder was completed.
      properties:
        ID: { type: integer }
        CreatedAt: { type: string, format: date-time }
        UpdatedAt: { type: string, format: date-time }
        DeletedAt: { type: string, format: date-time, nullable: true }
        reminder_id: { type: integer, nullable: true }
        contact_id: { type: integer }
        message: { type: string }
        completed_at: { type: string, format: date-time }

    # --- Circles / Households / Tags ---
    Circle:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
    CircleInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    CircleMember:
      type: object
      description: A circle membership join row.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        circle_id: { type: string, format: uuid }
        member_vcard_uid: { type: string, format: uuid }
    CircleMemberInput:
      type: object
      required: [member_vcard_uid]
      properties:
        member_vcard_uid: { type: string, format: uuid }
    ContactShareInput:
      type: object
      description: T9 field-selection sections, plus who to share with and which contact.
      required: [to_user_id, vcard_uid, sections]
      properties:
        to_user_id: { type: integer }
        vcard_uid: { type: string, format: uuid }
        sections:
          type: array
          minItems: 1
          items: { type: string }
        include_sensitive:
          type: boolean
          description: opt-in override to include private/secret items within the selected sections.
    ContactShare:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        from_user_id: { type: integer }
        to_user_id: { type: integer }
        contact_display_name: { type: string }
        status: { type: string, enum: [pending, accepted, declined] }
        responded_at: { type: string, format: date-time, nullable: true }
    ContactShareListResponse:
      type: object
      properties:
        contact_shares:
          type: array
          items:
            $ref: "#/components/schemas/ContactShare"
        usernames:
          type: object
          description: Maps the OTHER party's user ID (as a string key) to their username.
          additionalProperties: { type: string }
        total: { type: integer }
        next_cursor: { type: string }
        limit: { type: integer }
    BulkContactOperationInput:
      type: object
      description: One bulk action across many contacts (N5). Targets are Contact.VCardUID values.
      required: [action, vcard_uids]
      properties:
        action:
          type: string
          enum: [add_circle, remove_circle, add_tag, remove_tag, archive, unarchive, delete]
        vcard_uids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
        circle_id: { type: string, format: uuid }
        tag_id: { type: string, format: uuid }
    BulkOperationResult:
      type: object
      description: Partial-success outcome of a bulk operation.
      properties:
        action: { type: string }
        total: { type: integer }
        succeeded: { type: integer }
        failed: { type: integer }
        failures:
          type: array
          items:
            type: object
            properties:
              vcard_uid: { type: string, format: uuid }
              reason: { type: string }
    Household:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
        type: { type: string, enum: [family_unit, roommates, other] }
        address:
          $ref: "#/components/schemas/Address"
    HouseholdInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        type: { type: string, enum: [family_unit, roommates, other] }
        address:
          $ref: "#/components/schemas/Address"
    HouseholdMember:
      type: object
      description: A household membership join row.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        household_id: { type: string, format: uuid }
        member_vcard_uid: { type: string, format: uuid }
        role: { type: string }
        since: { type: string }
        until: { type: string }
    HouseholdMemberInput:
      type: object
      required: [member_vcard_uid]
      properties:
        member_vcard_uid: { type: string, format: uuid }
        role: { type: string }
        since: { type: string }
        until: { type: string }
    AddressHouseholdSuggestion:
      type: object
      description: >
        One T40 shared-address household suggestion: a group of 2+ contacts
        sharing a normalized address, identified by a stable hash pair.
      properties:
        address_hash: { type: string, description: "SHA-256 of the normalized shared-address key" }
        member_hash: { type: string, description: "SHA-256 of the sorted member VCardUIDs joined" }
        member_vcard_uids:
          type: array
          items: { type: string, format: uuid }
        address:
          $ref: "#/components/schemas/Address"
    AcceptHouseholdSuggestionInput:
      type: object
      required: [member_vcard_uids]
      properties:
        member_vcard_uids:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        type: { type: string, enum: [family_unit, roommates, other] }
    DismissHouseholdSuggestionInput:
      type: object
      required: [member_vcard_uids]
      properties:
        member_vcard_uids:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
    ContactAddressSuggestion:
      type: object
      description: >
        One contact-address suggestion: the recipient contact should consider
        the address the Source carries, because a confirmed relationship
        (parent/child, spouse, roommate) or household membership implies a
        shared residence. SourceKind is "relationship" or "household"; for a
        relationship source, SourceID is the other contact's VCardUID and
        RelationType reads from the recipient's perspective.
      properties:
        contact_vcard_uid: { type: string, format: uuid }
        contact_name: { type: string }
        source_kind: { type: string, enum: [relationship, household] }
        source_id: { type: string }
        source_name: { type: string }
        relation_type: { type: string }
        address:
          $ref: "#/components/schemas/Address"
        address_key:
          type: string
          description: Normalized address identity (street + city/region + postal + country).
    ApplyContactAddressSuggestionInput:
      type: object
      description: >
        Names one address suggestion by its identity. The address itself is
        never sent: the server re-derives it from the current graph.
      required: [contact_vcard_uid, source_kind, source_id, address_key]
      properties:
        contact_vcard_uid: { type: string, format: uuid }
        source_kind: { type: string, enum: [relationship, household] }
        source_id: { type: string }
        address_key: { type: string }
    SystemEvent:
      type: object
      description: >
        One persisted operational event (issue #424) — application start/stop,
        a migration, a scheduled job run, a sync run, a notification dispatch,
        a backup/restore drill. Distinct from AuditEvent (who changed user
        data). System-generated, read-only, admin-only, bounded retention
        (SYSTEM_EVENT_RETENTION_DAYS). Enum values mirror
        backend/models/system_event.go and migration 000038 — keep in sync.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time, description: "When the row was written" }
        occurred_at: { type: string, format: date-time, description: "When the event actually happened" }
        event_type:
          type: string
          enum: [application_started, application_stopped, migration_started, migration_completed, migration_failed, job_started, job_completed, job_failed, sync_started, sync_completed, sync_failed, notification_sent, notification_failed, backup_completed, backup_failed, restore_test_completed, integration_failed]
        severity: { type: string, enum: [info, warn, error] }
        component: { type: string, description: "Subsystem, e.g. scheduler, contact_sync, notification" }
        operation: { type: string, description: "The specific unit of work, e.g. a job name" }
        duration_ms: { type: integer, nullable: true, description: "Wall-clock duration; absent for instantaneous events" }
        result: { type: string, nullable: true, enum: [success, failure, skipped] }
        correlation_id: { type: string, description: "Ties the event to its chain of work: an HTTP request id, or job:<name>:<uuid>" }
        error: { type: string, description: "Sanitized, length-capped error string on the failure path" }
        detail: { type: string, description: "Bounded low-cardinality context (counts, subsystem names) — never a contact id or raw URL" }
        user_id: { type: integer, nullable: true, description: "The acting user when attributable; absent for background work" }
    SubsystemHealth:
      type: object
      description: >
        The last-known-good state of one operational subsystem (issue #427),
        derived on read from the system_events stream. `subsystem` is the
        system_events `component` value (contact_sync, calendar_sync,
        notification, backup, scheduler, webhook).
      properties:
        subsystem: { type: string, enum: [contact_sync, calendar_sync, notification, backup, scheduler, webhook] }
        status:
          type: string
          enum: [healthy, failing, unknown]
          description: "healthy = last terminal event was a success; failing = last was a failure; unknown = no terminal event on record"
        last_attempt_at: { type: string, format: date-time, nullable: true, description: "Most recent terminal event (success or failure)" }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        incident_first_failure_at:
          type: string
          format: date-time
          nullable: true
          description: "First failure of the current unbroken run — non-null exactly when consecutive_failures > 0"
        consecutive_failures: { type: integer, description: "Failures in a row since the last success; a success resets it to 0" }
        last_error: { type: string, description: "Sanitized error of the most recent failure; empty unless status is failing" }
    JobRun:
      type: object
      description: >
        One persisted background-job execution outcome (issue #391).
        System-generated, read-only, admin-only.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        job_name: { type: string, description: "Canonical job name (see JobExecution.job_name)" }
        trigger:
          type: string
          enum: [scheduled, initial, manual]
          description: "cron tick, boot-time catch-up run, or an operator-forced /admin/trigger-* run"
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer }
        result:
          type: string
          enum: [success, failure, skipped]
          description: "skipped = the run did not execute (job lock held / ran too recently)"
        error: { type: string, description: "Sanitized, length-capped; empty unless result is failure" }
        items_processed:
          type: integer
          nullable: true
          description: "Count of items the run acted on, when the job reports one; null otherwise"
        detail: { type: string, description: "Bounded, low-cardinality extra context" }
        correlation_id: { type: string, description: "Ties the run to its system_events chain — job:<name>:<uuid>" }
    JobRunHealth:
      type: object
      description: >
        The folded run health of one background job (issue #391), derived on
        read from job_runs.
      properties:
        job_name: { type: string }
        status:
          type: string
          enum: [healthy, failing, unknown]
          description: "healthy = last executed run succeeded; failing = last executed run failed; unknown = no executed run on record"
        last_run_at: { type: string, format: date-time, nullable: true, description: "Most recent run of any result, including skipped" }
        last_result: { type: string, description: "Result of that most recent run" }
        last_trigger: { type: string }
        last_duration_ms: { type: integer, nullable: true }
        last_items_processed: { type: integer, nullable: true }
        last_success_at: { type: string, format: date-time, nullable: true }
        last_failure_at: { type: string, format: date-time, nullable: true }
        last_error: { type: string, description: "Sanitized error of the most recent failure; empty unless status is failing" }
        incident_first_failure_at:
          type: string
          format: date-time
          nullable: true
          description: "First failure of the current unbroken run — non-null exactly when consecutive_failures > 0"
        consecutive_failures: { type: integer, description: "Failures in a row since the last success; skipped runs do not break the streak" }
        duration_sample_size: { type: integer, description: "How many recent executed runs the avg/max were computed over" }
        avg_duration_ms: { type: integer, nullable: true }
        max_duration_ms: { type: integer, nullable: true }
    NotificationChannelHealth:
      type: object
      description: >
        The delivery-health state of one reminder notification channel (issue
        #422), derived on read from notification_deliveries and the per-user
        channel config. `channel` is one of email, ntfy, gotify, push. The
        `status` distinguishes three remedies: `unconfigured` (the server for
        email, or no user for the push-style channels, has nothing set up),
        `failing` (configured, but the most recent delivery attempt failed),
        and `no_devices` (push is provisioned but no browser subscription or
        mobile device can currently receive), alongside `healthy`.
      properties:
        channel: { type: string, enum: [email, ntfy, gotify, push], description: "The notification channel wire name, in dispatch order" }
        status:
          type: string
          enum: [unconfigured, no_devices, healthy, failing]
          description: "unconfigured = nothing to deliver on; no_devices = push provisioned but no endpoint registered; healthy = configured and the last terminal delivery succeeded; failing = configured and the last terminal delivery failed"
        configured: { type: boolean, description: "The channel can be dispatched at all (server mailer for email; at least one user's connection settings for ntfy/Gotify; VAPID keys / FCM service account for push)" }
        reachable: { type: boolean, description: "True exactly when status is healthy — the other statuses are each a different reason the channel cannot deliver right now" }
        enabled_user_count: { type: integer, description: "Number of users for whom the channel is actually on (per-user toggle + usable per-user config)" }
        device_count: { type: integer, description: "Currently-receivable push endpoints (web subscriptions + FCM devices when FCM is configured); 0 for non-push channels" }
        fcm_configured: { type: boolean, description: "Push-only: the server has an FCM service account file (M2); false for non-push channels" }
        last_attempt_at: { type: string, format: date-time, nullable: true, description: "Most recent terminal delivery (sent or failed)" }
        last_sent_at: { type: string, format: date-time, nullable: true, description: "Most recent successful delivery" }
        last_failed_at: { type: string, format: date-time, nullable: true, description: "Most recent failed delivery" }
        consecutive_failures: { type: integer, description: "Unbroken failed-delivery run since the last success; non-zero exactly when status is failing" }
        last_error: { type: string, description: "Length-capped error of the most recent failed delivery; empty unless status is failing" }
        attempted_count: { type: integer, description: "Terminal delivery attempts (sent + failed); pending rows are not attempts" }
        delivered_count: { type: integer, description: "Successfully-delivered rows" }
    DiagnosticCheck:
      type: object
      description: >
        One row of the instance-diagnostics sweep (issue #423): a stable
        identifier, an ok / warning / error status, and a short, secret-free
        human message. Check names: `config`, `database`, `migrations`,
        `filesystem`, `backup`, `notification_<channel>` (one per delivery
        channel), `integration_<system>` (carddav, caldav, immich, paperless,
        seafile, nextcloud), `disk_space`, `background_jobs`, `search_index`
        (FTS index consistency, SEARCH-02), `version`.
      properties:
        name: { type: string, description: "Stable snake_case identifier" }
        status: { type: string, enum: [ok, warning, error] }
        message: { type: string, description: "Short, secret-free human detail" }
    DiagnosticsResponse:
      type: object
      description: >
        The instance-diagnostics sweep output (issue #423). Read-only and
        secret-free: config values are never echoed and integration base URLs /
        transport errors go to the log only. Always HTTP 200 when the caller is
        an admin — a broken install is reported in the checklist, not as a
        non-2xx.
      required: [timestamp, summary, checks]
      properties:
        timestamp: { type: string, format: date-time }
        summary:
          type: object
          required: [status, ok, warnings, errors]
          properties:
            status: { type: string, enum: [ok, warning, error], description: "error dominates warning dominates ok" }
            ok: { type: integer }
            warnings: { type: integer }
            errors: { type: integer }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticCheck"
    StorageIntegrityReport:
      type: object
      description: >
        The storage-level pass of the integrity checker (DB-01, issue #460):
        the two SQLite structural pragmas. `ok` is true only when both are
        clean.
      required: [ok, integrity_check, foreign_key_check]
      properties:
        ok: { type: boolean }
        integrity_check:
          type: string
          description: '`ok`, or the "; "-joined problem lines from PRAGMA integrity_check.'
        foreign_key_check:
          type: string
          description: '`ok`, or a "; "-joined summary of PRAGMA foreign_key_check violations ("<table> row <rowid> -> <parent>").'
    IntegrityFinding:
      type: object
      description: >
        One class of data-invariant problem found by one probe, aggregated per
        owning user. Secret-free: table/column names and counts only.
      required: [invariant, check, severity, count, detail, repairable]
      properties:
        invariant:
          type: string
          description: "ADR 0012 identifier, e.g. INV-D1."
        check:
          type: string
          description: "Stable probe slug, e.g. relationship_edge.endpoint_missing."
        severity:
          type: string
          enum: [violation, info]
          description: "Only `violation` flips the report's `ok`, records a failed check, or fires the alert."
        user_id:
          type: integer
          description: "Owner of the affected rows; omitted / 0 for an instance-wide probe."
        count: { type: integer, description: "Affected rows/references for this (check, user)." }
        detail: { type: string, description: "Short, secret-free human message." }
        repairable:
          type: boolean
          description: "True when the `doctor` CLI can safely remove the affected rows (a truly-orphaned hard-delete join/edge row)."
    DataIntegrityReport:
      type: object
      description: >
        The application-invariant pass of the integrity checker (DB-01, issue
        #460): one probe per at-rest invariant in ADR 0012.
      required: [timestamp, ok, findings]
      properties:
        timestamp: { type: string, format: date-time }
        ok:
          type: boolean
          description: "True when no `violation`-severity finding was produced and every probe completed."
        findings:
          type: array
          items:
            $ref: "#/components/schemas/IntegrityFinding"
    IntegrityCheckResponse:
      type: object
      description: >
        The combined output of GET /admin/integrity-check (DB-01, issue #460):
        the storage pass and the data pass, reported distinctly. Always HTTP
        200 for an admin caller — a broken database is reported in the body,
        not as a non-2xx.
      required: [timestamp, ok, storage, data]
      properties:
        timestamp: { type: string, format: date-time }
        ok:
          type: boolean
          description: "True only when both passes are clean."
        storage:
          $ref: "#/components/schemas/StorageIntegrityReport"
        data:
          $ref: "#/components/schemas/DataIntegrityReport"
    ErrorBucket:
      type: object
      description: >
        One aggregated operational-error cause over the window (issue #426):
        every system_events failure row sharing a `component` and a normalized
        error string, collapsed to one row with a count.
      properties:
        component: { type: string, description: "The system_events component the failures share" }
        cause: { type: string, description: "The normalized error string — the low-cardinality bucket key" }
        sample_error: { type: string, description: "The most recent raw error string in the bucket (sanitized, length-capped)" }
        event_types:
          type: array
          items: { type: string }
          description: "Sorted distinct event_type values in the bucket (usually one, e.g. sync_failed)"
        count: { type: integer }
        recurring: { type: boolean, description: "count >= 3 — a repeating cause, worth surfacing prominently; a single transient failure is false" }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        event_ids:
          type: array
          items: { type: integer }
          description: "The system_events row ids in the bucket (capped at 500); pass to GET /admin/system-events?ids="
        event_ids_truncated: { type: boolean, description: "True when the bucket has more than 500 rows and event_ids was capped" }
    ErrorAggregationResponse:
      type: object
      properties:
        window_hours: { type: integer, description: "The rolling window aggregated over" }
        since: { type: string, format: date-time }
        until: { type: string, format: date-time }
        total_events: { type: integer, description: "Total failure rows folded (across all buckets)" }
        buckets:
          type: array
          items:
            $ref: "#/components/schemas/ErrorBucket"
          description: "Most frequent first, then most recently seen"
    SystemStatus:
      type: object
      description: >
        The admin-scoped operational snapshot (issue #388). No field carries a
        secret value: `config.features` is booleans only and each
        `config.validation` entry is a field name plus a remediation message.
        `update` is the opt-in update-availability block (issue #650): when
        `UPDATE_CHECK_ENABLED` is unset it is exactly `{"enabled": false}` and
        no outbound call is made.
      properties:
        overall:
          type: string
          enum: [healthy, degraded, unhealthy]
          description: "services.DeepHealthSnapshot(...).Status verbatim — the same roll-up GET /health returns"
        health:
          type: object
          description: "The full deep-health breakdown (identical shape to HealthResponse.checks); reason strings are already sanitized for an unauthenticated caller"
          properties:
            status: { type: string, enum: [healthy, degraded, unhealthy] }
            database: { $ref: "#/components/schemas/HealthCheckDetail" }
            migrations: { $ref: "#/components/schemas/HealthCheckDetail" }
            integrity_check: { $ref: "#/components/schemas/HealthCheckDetail" }
            restore_drill: { $ref: "#/components/schemas/HealthCheckDetail" }
            background_jobs:
              type: object
              properties:
                status: { type: string, enum: [ok, degraded] }
                reason: { type: string }
                jobs:
                  type: array
                  items:
                    type: object
                    properties:
                      name: { type: string }
                      last_run_at: { type: string, format: date-time }
                      locked: { type: boolean }
                      stuck: { type: boolean }
            integrations:
              type: object
              additionalProperties: { $ref: "#/components/schemas/HealthCheckDetail" }
        version:
          type: object
          description: "buildinfo.Get() — identity of the running binary"
          properties:
            version: { type: string, example: "v0.6.2" }
            commit: { type: string }
            build_date: { type: string }
        uptime:
          type: object
          properties:
            started_at: { type: string, format: date-time, description: "Process start instant (RFC3339)" }
            uptime_seconds: { type: integer }
        migration:
          type: object
          properties:
            applied: { type: integer, description: "Migration version the database is currently at (0 if none applied)" }
            latest: { type: integer, description: "Highest migration bundled in the binary" }
            pending: { type: integer, description: "latest - applied, floored at 0" }
            dirty: { type: boolean, description: "The last migration left the version marker dirty" }
        config:
          type: object
          properties:
            validation:
              type: array
              description: "Live cfg.Validate() result — [] on a clean boot, never null"
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
            features:
              type: object
              description: "Which optional subsystems are enabled — booleans only"
              properties:
                carddav: { type: boolean }
                caldav: { type: boolean }
                oidc: { type: boolean }
                email: { type: boolean }
                metrics: { type: boolean }
                db_integrity_check: { type: boolean }
                db_restore_drill: { type: boolean }
        database:
          type: object
          properties:
            sqlite_version: { type: string }
            journal_mode: { type: string, description: "PRAGMA journal_mode — normally wal" }
            wal_bytes: { type: integer, description: "Size of the -wal sidecar, 0 when absent" }
        storage:
          type: object
          description: >
            On-disk sizing (issue #388) plus the storage-growth trend and
            tiered threshold (issue #652). Trend fields are null until the
            storage_samples series has enough history (the daily sampler needs
            ~2 days for the 7d delta, 14+ days for a projection).
          properties:
            database_bytes: { type: integer, description: "Main DB file + -wal + -shm" }
            filesystem:
              type: object
              properties:
                free_bytes: { type: integer }
                total_bytes: { type: integer }
            directories:
              type: array
              description: "One entry per configured storage directory (profile photos, attachments); [] when none, never null"
              items:
                type: object
                properties:
                  path: { type: string }
                  bytes: { type: integer }
                  file_count: { type: integer }
                  truncated: { type: boolean, description: "A hard cap (200000 entries or depth 8) stopped the walk early; bytes is a lower bound" }
            growth_7d_bytes:
              type: integer
              description: "Latest database_bytes minus the oldest sample in the last 7 days; null when the window holds fewer than two samples"
            growth_30d_bytes:
              type: integer
              description: "Same delta over the last 30 days"
            growth_90d_bytes:
              type: integer
              description: "Same delta over the last 90 days"
            projected_full_at:
              type: string
              format: date-time
              description: "Linear fit of fs_used_bytes over the last 30 days extrapolated to fs_total_bytes; null when slope <= 0 or history < 14 days"
            usage_percent:
              type: integer
              description: "Filesystem holding the DB, used as a percentage of total; null when it cannot be stat'ed"
            threshold:
              type: string
              enum: [ok, warning, critical]
              description: >
                usage_percent folded against STORAGE_WARN_PERCENT (default 75)
                / STORAGE_CRITICAL_PERCENT (default 90) with -5% hysteresis.
                Warning or critical elevates `overall` to at least degraded.
        update:
          type: object
          description: >
            Opt-in update-availability block (issue #650). `enabled` mirrors
            UPDATE_CHECK_ENABLED (default off). When off the block is exactly
            `{"enabled": false}` and no outbound call is made. When on,
            `current` is the running build's version and a lookup error leaves
            `latest` absent ("unknown") with `update_available` absent — the
            endpoint still returns 200.
          properties:
            enabled: { type: boolean, description: "UPDATE_CHECK_ENABLED — when false, nothing else is populated" }
            current: { type: string, description: "buildinfo version of the running build" }
            latest: { type: string, description: "Latest published release tag, or absent when unknown/disabled" }
            update_available: { type: boolean, description: "Present only when a comparison was possible; true when a newer release exists" }
            checked_at: { type: string, format: date-time, description: "When the latest release was last fetched (cached 6h)" }
    AuditEvent:
      type: object
      description: One immutable create/update/delete or auth/admin lifecycle record in the audit log (T18, issue #381).
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        entity_type: { type: string, enum: [contact, note, activity, life_event, gift, circle, tag, household, reminder, user, auth, api_token] }
        entity_id: { type: string }
        operation: { type: string, enum: [create, update, delete, login, login_failed, register, password_change, password_reset, password_reset_requested, totp_enable, totp_disable, recovery_regenerate, revoke, role_change] }
        before_snapshot: { type: string, description: "Redacted JSON of the pre-update/pre-delete state (empty for creates)" }
        hash: { type: string, description: "SHA-256 of (prev_hash || canonical content); the tamper-evident chain link (issue #381)" }
        prev_hash: { type: string, description: "Hash of the preceding audit row (empty for the head of the chain)" }
    Attachment:
      type: object
      description: One file/document attached to a contact (N7). The bytes live on disk under a server-generated UUID name.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contact_vcard_uid: { type: string, format: uuid }
        original_name: { type: string, description: "Display-only; never used to build a filesystem path" }
        content_type: { type: string }
        size_bytes: { type: integer }
    Tag:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
    TagInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
    ContactTag:
      type: object
      description: A tagging join row (contact x tag).
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        tag_id: { type: string, format: uuid }
        contact_vcard_uid: { type: string, format: uuid }
    ContactTagInput:
      type: object
      required: [contact_vcard_uid]
      properties:
        contact_vcard_uid: { type: string, format: uuid }

    # --- Relationship edges ---
    RelationshipEdge:
      type: object
      description: >
        A directed edge in the relationship graph; Type describes the source's
        role relative to the target. Only status=confirmed edges are fact;
        suggested edges await review.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        type: { type: string }
        directional: { type: boolean }
        metadata:
          type: object
          additionalProperties: true
        source: { type: string, enum: [user-confirmed, household-inferred, imported, ai-suggested] }
        confidence: { type: number }
        status: { type: string, enum: [confirmed, suggested] }
        sensitivity: { type: string, enum: [normal, private, secret] }
    RelationshipEdgeInput:
      type: object
      required: [type]
      description: >
        Exactly one of source_id/source_thin and one of target_id/target_thin
        per endpoint, enforced by the controller. Source/Confidence/Status are
        server-derived and cannot be set by a client.
      properties:
        source_id: { type: string, format: uuid }
        source_thin:
          $ref: "#/components/schemas/ThinContactInput"
        target_id: { type: string, format: uuid }
        target_thin:
          $ref: "#/components/schemas/ThinContactInput"
        type: { type: string, description: "A registered relationship type (models/relationship_type_registry.go).", example: "friend_of" }
        sensitivity: { type: string, enum: [normal, private, secret] }
        metadata:
          type: object
          additionalProperties: true
    ThinContactInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        gender: { type: string, enum: [male, female, other, prefer_not_to_say] }
        birthday: { type: string, description: "ISO YYYY-MM-DD or year-less --MM-DD.", example: "1990-05-15" }

    # --- External identity / activity substrate (T14) ---
    ExternalIdentity:
      type: object
      description: >
        "This contact IS this thing in that external system." Keyed by
        entity_id (a Contact.VCardUID), never the numeric ID. System-specific
        data lives in metadata (JSON), never in a per-system column.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        system: { type: string, description: "Integration token, e.g. immich, paperless." }
        external_id: { type: string }
        url: { type: string }
        metadata:
          type: object
          additionalProperties: true
        sync_status: { type: string, enum: [idle, syncing, synced, error] }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
    ExternalIdentityInput:
      type: object
      required: [entity_id, system, external_id]
      properties:
        entity_id: { type: string, format: uuid }
        system: { type: string }
        external_id: { type: string }
        url: { type: string, example: "https://example.com/item" }
        metadata:
          type: object
          additionalProperties: true
        sync_status: { type: string, enum: [idle, syncing, synced, error] }
    ExternalActivity:
      type: object
      description: >
        An event contributed by an external system, linkable into a contact's
        timeline. The CRM stores a reference + timeline entry; the source data
        stays in the external system.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        source_system: { type: string }
        external_id: { type: string }
        type: { type: string, description: "Open classifier, e.g. photo-appearance." }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        provenance: { type: string, enum: [external, user] }
        sync_state: { type: string, enum: [synced, pending] }
    ExternalActivityInput:
      type: object
      required: [entity_id, source_system, external_id, type, occurred_at]
      properties:
        entity_id: { type: string, format: uuid }
        source_system: { type: string }
        external_id: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        payload:
          type: object
          additionalProperties: true
        provenance: { type: string, enum: [external, user] }
        sync_state: { type: string, enum: [synced, pending] }

    # --- Immich integration (T15/T16) ---
    ImmichConfigResponse:
      type: object
      description: The API-visible shape of a user's Immich connection. The API key is never exposed.
      properties:
        base_url: { type: string }
        has_api_key: { type: boolean }
        sync_enabled: { type: boolean }
        last_synced_at:
          type: string
          format: date-time
          nullable: true
        last_sync_status: { type: string }
        last_sync_error: { type: string }
    ImmichConfigInput:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string, example: "https://immich.example.com" }
        api_key: { type: string, description: "Write-only: empty on update keeps the stored key; required on first connect." }
        sync_enabled: { type: boolean }
    ImmichConnectionTestResult:
      type: object
      description: >
        Stage-by-stage diagnosis of a "Test connection" check — reachability
        (unauthenticated ping) then auth (API key). ok:false is a successful
        diagnosis of an upstream problem, not an application error, so this
        is always returned with HTTP 200.
      properties:
        ok: { type: boolean }
        stage: { type: string, enum: [reachability, auth, ok] }
        message: { type: string }
    ImmichPerson:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    ImmichPersonSummary:
      type: object
      description: A contact's Immich link plus live (or cached, on failure) person info.
      properties:
        identity:
          $ref: "#/components/schemas/ExternalIdentity"
        person_name: { type: string }
        photo_count: { type: integer }
        latest_asset_id: { type: string }
        latest_at:
          type: string
          format: date-time
          nullable: true
    ImmichAssetSummary:
      type: object
      description: One of a linked contact's recent Immich photos (profile-photo picker).
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }

    # --- Paperless-ngx (P2a) ---
    PaperlessConfigResponse:
      type: object
      description: The API-visible shape of a user's Paperless connection. The API token is never exposed.
      properties:
        base_url: { type: string }
        has_api_token: { type: boolean }
    PaperlessConfigInput:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string, example: "https://paperless.example.com" }
        api_token: { type: string, description: "Write-only: empty on update keeps the stored token; required on first connect." }
    PaperlessConnectionTestResult:
      type: object
      description: >
        Stage-by-stage diagnosis of a "Test connection" check — reachability
        (unauthenticated ping) then auth (API token). ok:false is a successful
        diagnosis of an upstream problem, not an application error, so this is
        always returned with HTTP 200.
      properties:
        ok: { type: boolean }
        stage: { type: string, enum: [reachability, auth, ok] }
        message: { type: string }
    PaperlessDocument:
      type: object
      description: A Paperless-ngx document as browsed by the L1 picker.
      properties:
        id: { type: integer }
        title: { type: string }
        file_name: { type: string }
        created: { type: string, description: "Document creation date (RFC 3339)." }
        added: { type: string, description: "Date the document entered the archive (RFC 3339)." }

    # --- Seafile (P2b) ---
    SeafileConfigResponse:
      type: object
      description: The API-visible shape of a user's Seafile connection. The API token is never exposed.
      properties:
        base_url: { type: string }
        has_api_token: { type: boolean }
    SeafileConfigInput:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string, example: "https://seafile.example.com" }
        api_token: { type: string, description: "Write-only: empty on update keeps the stored token; required on first connect." }
    SeafileConnectionTestResult:
      type: object
      description: >
        Stage-by-stage diagnosis of a "Test connection" check — reachability
        (unauthenticated ping) then auth (API token). ok:false is a successful
        diagnosis of an upstream problem, not an application error.
      properties:
        ok: { type: boolean }
        stage: { type: string, enum: [reachability, auth, ok] }
        message: { type: string }
    SeafileLibrary:
      type: object
      description: A Seafile library (repo) as browsed by the L1 picker.
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: "library or virtual" }
    SeafileItem:
      type: object
      description: One entry of a Seafile library folder listing (file or subfolder).
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, description: "file or dir" }
        size: { type: integer, description: "File size in bytes (0 for directories)." }
        mtime: { type: integer, description: "Unix mtime seconds." }
        parent_dir: { type: string }

    # --- Nextcloud / ownCloud WebDAV (P2c) ---
    WebDAVConfigResponse:
      type: object
      description: The API-visible shape of a user's Nextcloud/ownCloud connection. The app password is never exposed.
      properties:
        base_url: { type: string }
        username: { type: string }
        has_app_password: { type: boolean }
    WebDAVConfigInput:
      type: object
      required: [base_url, username]
      properties:
        base_url: { type: string, example: "https://cloud.example.com" }
        username: { type: string }
        app_password: { type: string, description: "Write-only: empty on update keeps the stored password; required on first connect. Only an app password is accepted — never the account password." }
    WebDAVConnectionTestResult:
      type: object
      description: >
        Diagnosis of a "Test connection" check. WebDAV has no unauthenticated
        reachability probe, so this is a single stage: a 401/403 is a
        credential problem, anything else transport. ok:false is a successful
        diagnosis of an upstream problem, not an application error.
      properties:
        ok: { type: boolean }
        stage: { type: string, enum: [reachability, ok] }
        message: { type: string }
    WebDAVItem:
      type: object
      description: One entry of a PROPFIND Depth:1 listing (file or folder).
      properties:
        name: { type: string }
        path: { type: string, description: "WebDAV path relative to the user's dav root, starting with '/'." }
        type: { type: string, description: "file or dir" }
        size: { type: integer, description: "File size in bytes." }
        modified_at: { type: string, format: date-time, description: "Last-modified, normalized to RFC 3339 UTC." }
        file_id: { type: string, description: "The server's stable file id, when exposed." }

    # --- Life events ---
    LifeEvent:
      type: object
      description: A permanent fact about an entity's life. remind=false is omitted on the wire (omitempty).
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        type: { type: string }
        category:
          type: string
          enum: [home_living, health_wellness, work_education, travel_experiences, family_relationships]
          description: "T36: nullable on the wire. Only backfilled (migration 000011) for pre-existing rows whose type mapped onto one of the original seven LifeEventType* constants; otherwise absent/uncategorized."
        date:
          $ref: "#/components/schemas/PartialDate"
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [user, imported, ai-suggested] }
        related_entity_ids:
          type: array
          items: { type: string, format: uuid }
        remind: { type: boolean }
        revision:
          type: integer
          description: >
            Issue #591 (CON-01a): monotonic per-row write counter, read-only.
            The CalDAV etag is derived from it (e-{id}-{revision}). A client
            reads it to build a conditional write (ADR 0006).
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted life event."
          default: false
    LifeEventInput:
      type: object
      required: [entity_id]
      properties:
        entity_id: { type: string, format: uuid }
        type: { type: string }
        category:
          type: string
          enum: [home_living, health_wellness, work_education, travel_experiences, family_relationships]
        date:
          $ref: "#/components/schemas/PartialDate"
        description: { type: string, maxLength: 2000 }
        source: { type: string, enum: [user, imported, ai-suggested] }
        related_entity_ids:
          type: array
          items: { type: string, format: uuid }
        remind: { type: boolean }

    # --- Link field types (T34) ---
    LinkFieldType:
      type: object
      description: >
        A user-configurable messaging/social link type (name, {value}-templated
        protocol, category, icon, position). Deliberately not a hardcoded
        oneof-validated enum — see the ticket's "Decisions made" section.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        name: { type: string }
        protocol:
          type: string
          description: >
            URI template with a literal "{value}" placeholder, e.g.
            "https://wa.me/{value}". May be empty for a seeded default with
            no stable public profile-by-handle URL (e.g. Discord) — user
            editable, not resolvable to a link until filled in.
        category: { type: string, enum: [messaging, social, other] }
        icon: { type: string }
        is_default:
          type: boolean
          description: True for a seeded row; false for a user-added one. Provenance only — editing a default keeps it flagged as a default.
        position: { type: integer }
    LinkFieldTypeInput:
      type: object
      required: [name, category]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        protocol: { type: string, maxLength: 2000 }
        category: { type: string, enum: [messaging, social, other] }
        icon: { type: string, maxLength: 100 }
        position:
          type: integer
          description: Optional on create (defaults to end-of-list); sent on update as a full replace.
    LinkFieldTypeReorderInput:
      type: object
      required: [order]
      properties:
        order:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: The caller's full set of LinkFieldType IDs in the desired display order.

    # --- Conversation agenda (T21) ---
    ConversationAgenda:
      type: object
      description: >
        "Things to bring up next time I see them" . Contextual memory
        surfaced on the contact view, explicitly NOT date-scheduled. resolved
        by discussed_at, never by a timer.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        content: { type: string, maxLength: 2000 }
        reference_url: { type: string, maxLength: 2000 }
        discussed_at:
          type: string
          format: date-time
          nullable: true
          description: When the item was marked discussed; null means still open.
        activity_id:
          type: integer
          nullable: true
          description: The Activity that covered this item, if linked.
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted agenda item."
          default: false
    ConversationAgendaInput:
      type: object
      required: [entity_id, content]
      properties:
        entity_id: { type: string, format: uuid }
        content: { type: string, minLength: 1, maxLength: 2000 }
        reference_url: { type: string, maxLength: 2000, example: "https://example.com/article" }
    ConversationAgendaDiscussInput:
      type: object
      properties:
        activity_id: { type: integer, nullable: true }

    # --- Gifts (T20b) ---
    Gift:
      type: object
      description: >
        "What did I give them last year?"  against a contact — an idea
        captured opportunistically, the offered/given gift, or a received gift.
        Status defaults to idea; any value carries an explicit ISO 4217
        currency.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        status: { type: string, enum: [idea, purchased, given, received] }
        occasion: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        url:
          type: string
          maxLength: 2000
          description: >
            Optional link to the thing itself (T35) — e.g. the product page for
            a captured idea. Rejected on write if it uses an unsafe scheme
            (javascript:, data:, vbscript:, file:).
        notes:
          type: string
          maxLength: 2000
          description: >
            Optional free-text context beyond what the gift is (T35) — sizing,
            where you saw it, "check they still want this".
        date:
          type: string
          format: date-time
          nullable: true
          description: When the gift was given/received. An idea may have no date.
        value_cents:
          type: integer
          description: Optional value in the currency's minor unit; must pair with currency.
        currency:
          type: string
          maxLength: 3
          description: ISO 4217 code, explicit whenever a value is set.
        life_event_id:
          type: string
          format: uuid
          nullable: true
          description: The LifeEvent this gift relates to, if any.
        activity_id:
          type: integer
          nullable: true
          description: The Activity (interaction) this gift relates to, if any.
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted gift."
          default: false
    GiftInput:
      type: object
      required: [entity_id, description]
      properties:
        entity_id: { type: string, format: uuid }
        status: { type: string, enum: [idea, purchased, given, received] }
        occasion: { type: string, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        url: { type: string, maxLength: 2000, description: "Safe-scheme URL only; unsafe schemes are a 400.", example: "https://example.com/wishlist-item" }
        notes: { type: string, maxLength: 2000 }
        date: { type: string, format: date-time, nullable: true }
        value_cents: { type: integer }
        currency: { type: string, maxLength: 3 }
        life_event_id: { type: string, format: uuid }
        activity_id: { type: integer, nullable: true }

    # --- Preferences ---
    Preference:
      type: object
      description: One structured personal fact about an entity (category/key/value + provenance).
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id: { type: string, format: uuid }
        category: { type: string, maxLength: 100 }
        key: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 2000 }
        source: { type: string, enum: [conversation_note, user, ai-suggested, external] }
        confidence: { type: number, nullable: true }
        last_confirmed: { type: string, format: date-time, nullable: true }
        sensitivity: { type: string, enum: [normal, private, secret] }
        deleted:
          type: boolean
          description: "Change-feed tombstone marker (T17): true only via ?since= for a soft-deleted preference."
          default: false
    PreferenceInput:
      type: object
      required: [entity_id, category, value]
      properties:
        entity_id: { type: string, format: uuid }
        category: { type: string, maxLength: 100 }
        key: { type: string, maxLength: 100 }
        value: { type: string, maxLength: 1000 }
        notes: { type: string, maxLength: 2000 }
        source: { type: string, enum: [conversation_note, user, ai-suggested, external] }
        confidence: { type: number, nullable: true }
        last_confirmed: { type: string, format: date-time, nullable: true }
        sensitivity: { type: string, enum: [normal, private, secret] }

    # --- CadencePolicies (T19) ---
    CadencePolicy:
      type: object
      description: >
        A relationship-maintenance rule — "stay in touch every N days"
        . Health is DERIVED (see CadenceHealth), never stored; this
        entity carries only the rule itself.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        entity_id:
          type: string
          format: uuid
          description: The subject Contact's VCardUID.
        target_interval_days: { type: integer, minimum: 1 }
        qualifying_types:
          type: array
          items: { type: string }
          description: >
            Which Interaction types reset the cadence (call, visit, meal...);
            empty means every default-qualifying type counts. The global
            gate is always Activity.Qualifying() — a non-qualifying type
            (photo) can never be re-admitted by listing it here.
    CadenceHealth:
      type: object
      description: >
        The DERIVED relationship-health read-model  — computed from
        the timeline, never persisted. Undefined (has_qualifying_interaction
        false) until the contact has at least one qualifying interaction;
        cadence does NOT count from the contact's creation date.
      properties:
        has_qualifying_interaction: { type: boolean }
        last_interaction: { type: string, format: date-time, nullable: true }
        next_due: { type: string, format: date-time, nullable: true }
        overdue_by:
          type: integer
          description: >
            Whole calendar days past due. 0 when due today, in the future, or
            undefined. "Due today" is not overdue.
    CadencePolicyWithHealth:
      type: object
      description: A cadence policy with its derived health embedded.
      allOf:
        - $ref: "#/components/schemas/CadencePolicy"
        - type: object
          properties:
            health:
              $ref: "#/components/schemas/CadenceHealth"
    CadencePolicyInput:
      type: object
      required: [entity_id, target_interval_days]
      properties:
        entity_id: { type: string, format: uuid }
        target_interval_days: { type: integer, minimum: 1 }
        qualifying_types:
          type: array
          items: { type: string }
    OverdueCadence:
      type: object
      description: An overdue cadence policy joined with its contact's display identity.
      properties:
        policy:
          $ref: "#/components/schemas/CadencePolicy"
        health:
          $ref: "#/components/schemas/CadenceHealth"
        contact_id:
          type: integer
          description: The contact's numeric ID (the /contacts/<id> URL component).
        contact_name: { type: string }
        photo_thumbnail: { type: string }

    ReachOutSuggestion:
      type: object
      description: >
        A pending event-driven "reach out" suggestion (issue #177): a
        meaningful organization/title/address change detected on a contact,
        joined with its contact's display identity. Companion to the
        time-based cadence.overdue trigger.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        contact_vcard_uid: { type: string, format: uuid }
        kind: { type: string, enum: [organization, title, address] }
        old_value: { type: string }
        new_value: { type: string }
        audit_event_id: { type: integer }
        reminder_id:
          type: integer
          description: The companion one-off Reminder's ID, if it was created successfully.
        status: { type: string, enum: [pending, dismissed] }
        contact_id:
          type: integer
          description: The contact's numeric ID (the /contacts/<id> URL component).
        contact_name: { type: string }
        photo_thumbnail: { type: string }

    ContactSyncConflict:
      type: object
      description: >
        A recorded CardDAV sync conflict (issue #395): a remote vCard change
        overwrote a local edit by the sync's documented full-replace policy,
        and this notice is the only record of what was lost. LocalValue is
        the pre-sync value the user had (offered back by restore); RemoteValue
        is the synced value that replaced it. Array fields (email/phone/
        address/url/impp/circles) carry their JSON array. Scoped to the
        owning user; values are the user's own synced contact data.
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        subscription_id: { type: integer }
        contact_id: { type: integer }
        field:
          type: string
          description: The flat contact field the local edit touched.
        local_value: { type: string }
        remote_value: { type: string }
        status: { type: string, enum: [pending, dismissed] }
        contact_vcard_uid: { type: string, format: uuid }
        contact_name: { type: string }
        photo_thumbnail: { type: string }
        subscription_name: { type: string }

    # --- Custom fields ---
    FieldDefinition:
      type: object
      properties:
        id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        label: { type: string, maxLength: 200 }
        key: { type: string, maxLength: 100 }
        target: { type: string, enum: [contact] }
        type: { type: string, enum: [string, text, number, boolean, date, datetime, uri, email, phone, enum] }
        constraints:
          $ref: "#/components/schemas/FieldConstraints"
        projection: { type: string, description: "internal-only, or vcard:X-<NAME>.", pattern: "^(internal-only|vcard:X-[A-Za-z0-9-]+)$", example: "internal-only" }
        sensitivity: { type: string, enum: [normal, private, secret] }
    FieldDefinitionInput:
      type: object
      required: [label, key, type]
      properties:
        label: { type: string, maxLength: 200 }
        key: { type: string, maxLength: 100 }
        target: { type: string, enum: [contact] }
        type: { type: string, enum: [string, text, number, boolean, date, datetime, uri, email, phone, enum] }
        constraints:
          $ref: "#/components/schemas/FieldConstraints"
        projection: { type: string, pattern: "^(internal-only|vcard:X-[A-Za-z0-9-]+)$", example: "internal-only" }
        sensitivity: { type: string, enum: [normal, private, secret] }
    FieldConstraints:
      type: object
      properties:
        min: { type: number, nullable: true }
        max: { type: number, nullable: true }
        maxLength: { type: integer, nullable: true }
        pattern: { type: string }
        values:
          type: array
          items: { type: string }
        multi: { type: boolean }
    FieldValue:
      type: object
      description: One value of a FieldDefinition for one contact.
      properties:
        id: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        field_definition_id: { type: string, format: uuid }
        entity_id: { type: string, format: uuid }
        value:
          description: "The raw JSON payload — a scalar (string/number/boolean) or, for multi fields, an array."
    FieldValueInput:
      type: object
      required: [field_definition_id, value]
      properties:
        field_definition_id: { type: string, format: uuid }
        value: {}
    ContactFieldValuesInput:
      type: object
      required: [field_values]
      properties:
        field_values:
          type: array
          items:
            $ref: "#/components/schemas/FieldValueInput"

    # --- Calendar / contact subscriptions, tokens, webhooks ---
    CalendarSubscriptionInput:
      type: object
      required: [name, url]
      description: Credentials are optional. On update, an empty password keeps the stored one; clear_password removes it.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password: { type: string, maxLength: 500 }
        clear_password: { type: boolean }
        sync_enabled: { type: boolean, nullable: true }
        past_days: { type: integer, minimum: 0, maximum: 3650 }
        future_days: { type: integer, minimum: 0, maximum: 3650 }
    CalendarSubscriptionResponse:
      type: object
      description: Never includes the password.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        has_password: { type: boolean }
        sync_enabled: { type: boolean }
        past_days: { type: integer }
        future_days: { type: integer }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true, description: "Sync-health (issue #390): most recent run, success or failure." }
        last_success_at: { type: string, format: date-time, nullable: true, description: "Most recent run that succeeded." }
        last_failure_at: { type: string, format: date-time, nullable: true, description: "Most recent run that failed." }
        consecutive_failures: { type: integer, description: "Runs failed in a row; 0 after any success." }
        incident_first_failure_at: { type: string, format: date-time, nullable: true, description: "First failure of the current unbroken run of failures; null when consecutive_failures is 0." }
        last_run_duration_ms: { type: integer, nullable: true, description: "Wall-clock duration of the last run." }
        last_run_stats: { type: object, additionalProperties: { type: integer }, description: "Last run's counter tallies (created/updated/skipped, plus archived for contacts). {} before the first run." }
        terminal_failure_at: { type: string, format: date-time, nullable: true, description: "INT-04 (#467): non-null once the sync has hit a permanent error (revoked credentials, remote deleted) and the scheduler has stopped retrying it. Frozen at entry — it is 'when did this stop working'. Cleared by any success or a subscription edit." }
        terminal_reason: { type: string, description: "Failure-mode slug behind terminal_failure_at (auth-expiry, authz-revoked, remote-resource-deleted); empty when not terminal." }
    ContactSubscriptionInput:
      type: object
      required: [name, url]
      description: Credentials are optional. On update, an empty password keeps the stored one; clear_password removes it.
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        url: { type: string, format: uri, maxLength: 2048 }
        username: { type: string, maxLength: 200 }
        password:
          type: string
          maxLength: 500
          description: Encrypted at rest. On update, an empty value leaves the existing credential untouched.
        clear_password: { type: boolean, description: "On update, removes any stored credential." }
        sync_enabled: { type: boolean, nullable: true, description: "Defaults to true if omitted on create." }
    ContactSubscriptionResponse:
      type: object
      description: Never includes the password or sync token.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        username: { type: string }
        has_password: { type: boolean }
        sync_enabled: { type: boolean }
        last_synced_at: { type: string, format: date-time, nullable: true }
        last_sync_status: { type: string }
        last_sync_error: { type: string }
        created_at: { type: string, format: date-time }
        last_attempt_at: { type: string, format: date-time, nullable: true, description: "Sync-health (issue #390): most recent run, success or failure." }
        last_success_at: { type: string, format: date-time, nullable: true, description: "Most recent run that succeeded." }
        last_failure_at: { type: string, format: date-time, nullable: true, description: "Most recent run that failed." }
        consecutive_failures: { type: integer, description: "Runs failed in a row; 0 after any success." }
        incident_first_failure_at: { type: string, format: date-time, nullable: true, description: "First failure of the current unbroken run of failures; null when consecutive_failures is 0." }
        last_run_duration_ms: { type: integer, nullable: true, description: "Wall-clock duration of the last run." }
        last_run_stats: { type: object, additionalProperties: { type: integer }, description: "Last run's counter tallies (created/updated/archived/skipped). {} before the first run." }
        terminal_failure_at: { type: string, format: date-time, nullable: true, description: "INT-04 (#467): non-null once the sync has hit a permanent error (revoked credentials, remote deleted). Frozen at entry. Cleared by any success or a subscription edit." }
        terminal_reason: { type: string, description: "Failure-mode slug behind terminal_failure_at (auth-expiry, authz-revoked, remote-resource-deleted); empty when not terminal." }
        pending_conflicts: { type: integer, description: "Unreviewed local edits this subscription's syncs have overwritten (issue #395). Contacts only." }
    ApiTokenInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        expires_in_days: { type: integer, minimum: 1, maximum: 365, description: "Defaults to 90." }
        scope: { type: string, enum: [full, carddav], description: "Defaults to full. carddav tokens are rejected by the REST API." }
    ApiTokenResponse:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        scope: { type: string }
    ApiTokenCreateResponse:
      allOf:
        - $ref: "#/components/schemas/ApiTokenResponse"
        - type: object
          properties:
            token: { type: string, description: "The plaintext token, shown only once." }
    DeviceGrantInput:
      type: object
      properties:
        label: { type: string, maxLength: 100, description: "A free-form device name shown in the management list so the user can recognise it." }
    DeviceGrantResponse:
      type: object
      properties:
        id: { type: integer }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
    DeviceGrantCreateResponse:
      allOf:
        - $ref: "#/components/schemas/DeviceGrantResponse"
        - type: object
          properties:
            token: { type: string, description: "The plaintext device grant, shown exactly once at enrollment. Never returned again." }
    DeviceGrantSessionInput:
      type: object
      required: [device_token]
      properties:
        device_token: { type: string, minLength: 32, description: "The plaintext grant held by an enrolled device." }
    WebhookInput:
      type: object
      required: [name, url, events]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        url: { type: string, format: uri }
        events:
          type: array
          minItems: 1
          items:
            type: string
            enum: [contact.created, contact.updated, contact.deleted, note.created, note.updated, note.deleted, activity.created, activity.updated, activity.deleted, reminder.triggered, birthday.occurred]
        is_active: { type: boolean }
    WebhookResponse:
      type: object
      description: Never includes the signing secret.
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        events:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        delivery_health:
          type: object
          description: "INT-04 (#467): a rollup of this webhook's most recent delivery attempt, so a permanently-failed receiver is visible next to the webhook itself. All fields are zero/null when the webhook has never been delivered to."
          properties:
            last_delivery_at: { type: string, format: date-time, nullable: true }
            last_status_code: { type: integer, nullable: true }
            last_error: { type: string, nullable: true }
            failed_permanently: { type: boolean, description: "The last delivery hit a non-retryable status (401/403/404/410/4xx) and will not be retried." }
            terminal_reason: { type: string, description: "Failure-mode slug behind failed_permanently (auth-expiry, authz-revoked, remote-resource-deleted, client-error); empty otherwise." }
            retrying: { type: boolean, description: "The last delivery failed transiently and still has a retry scheduled." }
    WebhookCreateResponse:
      allOf:
        - $ref: "#/components/schemas/WebhookResponse"
        - type: object
          properties:
            secret: { type: string, description: "The signing secret, shown only once." }
    WebhookDeliveryResponse:
      type: object
      properties:
        id: { type: integer }
        webhook_id: { type: integer }
        event_type: { type: string }
        status_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        attempts: { type: integer }
        next_retry_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        failed_permanently: { type: boolean, description: "INT-03 (#466): the delivery hit a non-retryable status (401/403/404/410/4xx); next_retry_at is null and it will not be retried." }
        terminal_reason: { type: string, description: "Failure-mode slug behind failed_permanently; empty otherwise." }
    NotificationConfigInput:
      type: object
      description: "Channel URLs are optional (a user may use only one push-style channel) but, when present, must be valid http(s) URLs. gotify_token is write-only: empty keeps the stored token. Omitted toggles are left unchanged."
      properties:
        ntfy_url: { type: string, format: uri, maxLength: 2000 }
        ntfy_topic: { type: string, maxLength: 200 }
        gotify_url: { type: string, format: uri, maxLength: 2000 }
        gotify_token: { type: string, maxLength: 512, description: "Encrypted at rest. On update, an empty value leaves the stored token untouched." }
        notify_ntfy: { type: boolean, nullable: true }
        notify_gotify: { type: boolean, nullable: true }
        notify_push: { type: boolean, nullable: true }
    NotificationConfigResponse:
      type: object
      description: Never includes the stored Gotify token.
      properties:
        ntfy_url: { type: string }
        ntfy_topic: { type: string }
        gotify_url: { type: string }
        gotify_has_token: { type: boolean }
        notify_ntfy: { type: boolean }
        notify_gotify: { type: boolean }
        notify_push: { type: boolean }
        vapid_public_key: { type: string, description: "The server's Web Push VAPID public key, for the browser subscription call." }
    PushSubscriptionInput:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2000 }
        p256dh: { type: string, maxLength: 1024 }
        auth: { type: string, maxLength: 1024 }
        device_label: { type: string, maxLength: 200 }
    PushSubscriptionResponse:
      type: object
      properties:
        id: { type: integer }
        endpoint: { type: string }
        p256dh: { type: string }
        auth: { type: string }
        device_label: { type: string }
        created_at: { type: string, format: date-time }
    DeviceRegistrationInput:
      type: object
      required: [token, client]
      properties:
        token: { type: string, maxLength: 1024, description: "The platform push service's device token (FCM registration token, or an APNS device token)." }
        client: { type: string, enum: [fcm, apns] }
        device_label: { type: string, maxLength: 200 }
    DeviceRegistrationResponse:
      type: object
      properties:
        id: { type: integer }
        token: { type: string }
        client: { type: string, enum: [fcm, apns] }
        device_label: { type: string }
        created_at: { type: string, format: date-time }

    # --- Graph ---
    GraphResponse:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
    GraphConnectionsResponse:
      type: object
      description: The result of a multi-hop traversal from a starting contact.
      properties:
        from_vcard_uid: { type: string, format: uuid }
        from_name: { type: string }
        depth: { type: integer }
        chains:
          type: array
          items:
            $ref: "#/components/schemas/GraphChain"
    GraphChain:
      type: object
      description: >
        One reachable contact and the chain describing how it relates to the
        anchor. Steps[0] is the first hop away from the anchor; each step's
        relation is what the NEXT contact is to the PREVIOUS.
      properties:
        target_vcard_uid: { type: string, format: uuid }
        target_name: { type: string }
        depth: { type: integer }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/GraphChainStep"
    GraphChainStep:
      type: object
      properties:
        contact_vcard_uid: { type: string, format: uuid }
        contact_name: { type: string }
        relation: { type: string, description: "Display relation token (inverse already applied when the hop walked against the stored edge direction)." }
    SearchResult:
      type: object
      description: Grouped full-text search results (T11).
      properties:
        query: { type: string }
        resolved_relation:
          type: string
          description: "Canonical relation token when the whole query is a registry synonym (brother -> sibling_of)."
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/SearchContactHit"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/SearchNoteHit"
        activities:
          type: array
          items:
            $ref: "#/components/schemas/SearchActivityHit"
    SearchContactHit:
      type: object
      description: A matched contact (the slim ContactSummary shape) plus a snippet.
      properties:
        id: { type: integer }
        uid: { type: string, format: uuid }
        firstname: { type: string }
        lastname: { type: string }
        nickname: { type: string }
        fn: { type: string }
        primary_email: { type: string }
        primary_phone: { type: string }
        birthday: { type: string }
        org: { type: string }
        photo: { type: string }
        photo_thumbnail: { type: string }
        archived: { type: boolean }
        snippet: { type: string }
    SearchNoteHit:
      type: object
      description: A matched note with its owning contact's name and a snippet.
      properties:
        id: { type: integer }
        content: { type: string }
        date: { type: string, format: date-time }
        contact_id: { type: integer, nullable: true }
        contact_name: { type: string }
        snippet: { type: string }
    SearchActivityHit:
      type: object
      description: A matched interaction (activity) plus a snippet.
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        date: { type: string, format: date-time }
        type: { type: string }
        uuid: { type: string }
        snippet: { type: string }
    GraphNode:
      type: object
      properties:
        id: { type: string, description: '"c-<contactID>" or "a-<activityID>".' }
        type: { type: string, enum: [contact, activity] }
        label: { type: string }
        photo_thumbnail: { type: string }
        circles:
          type: array
          items: { type: string }
    GraphEdge:
      type: object
      properties:
        id: { type: string }
        source: { type: string }
        target: { type: string }
        type: { type: string, enum: [relationship, activity] }
        label: { type: string }

    # --- Import (preserved ) ---
    ColumnMapping:
      type: object
      required: [csv_column]
      properties:
        csv_column: { type: string }
        contact_field: { type: string, description: "Empty means \"ignore this column\"." }
        group: { type: integer, description: "Multi-value entry index (0-based); ties value+label/parts of one entry together." }
    ImportUploadResponse:
      type: object
      description: Returned by POST /contacts/import/upload (CSV).
      properties:
        session_id: { type: string }
        headers: { type: array, items: { type: string } }
        suggested_mappings:
          type: array
          items: { $ref: "#/components/schemas/ColumnMapping" }
        row_count: { type: integer }
        sample_data:
          type: array
          items: { type: array, items: { type: string } }
    ImportPreviewRequest:
      type: object
      required: [session_id, mappings]
      properties:
        session_id: { type: string }
        mappings:
          type: array
          items: { $ref: "#/components/schemas/ColumnMapping" }
    DuplicateMatch:
      type: object
      description: Describes a potential duplicate contact found via email/name/phone matching.
      properties:
        existing_contact_id: { type: integer }
        existing_firstname: { type: string }
        existing_lastname: { type: string }
        existing_email: { type: string }
        existing_phone: { type: string }
        match_reason: { type: string, enum: [email, name, phone] }
    ImportRowPreview:
      type: object
      properties:
        row_index: { type: integer }
        parsed_contact:
          type: object
          additionalProperties: true
        validation_errors: { type: array, items: { type: string } }
        duplicate_match:
          description: Potential duplicate, if any; null when the row matches nothing.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DuplicateMatch"
        suggested_action: { type: string, enum: [add, skip, update] }
        merge_diff:
          description: What the "update" action would change; null when there is no duplicate_match.
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ImportMergeDiff"
        batch_duplicate_of:
          type: integer
          nullable: true
          description: >
            When present, the row_index of an EARLIER row in the same import
            file that this row duplicates (T96 within-batch detection). Such
            rows default to "skip". Absent rows emit null.
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/Diagnostic" }
          description: >
            Degradation-policy diagnostics from the vcard4/vcard3/jscontact
            adapter that parsed this row, in the same structured
            severity/concept/message shape the export loss reports use
            (DATA-02, issue #442). Empty for CSV/records-import rows, which
            don't go through an adapter.
        custom_field_candidates:
          type: array
          items: { $ref: "#/components/schemas/DiscoveredProperty" }
          description: >
            The unknown X-* vCard/JSContact properties discovered in this
            row's passthrough that the import wizard can promote to first-class
            custom fields (issue #514). Absent for CSV/records-import rows and
            for adapter rows that carried no X-* properties.
    DiscoveredProperty:
      type: object
      description: >
        One unknown X-* vCard/JSContact property found on an imported contact
        that can be promoted to a custom field (issue #514). The wizard renders
        this per row and the mapping decision is sent back as an
        ImportFieldMapping on the confirm request.
      properties:
        name:
          type: string
          description: >
            The vCard property name as stored in passthrough (lowercase, e.g.
            "x-favorite-color").
        value: { type: string, description: "Human-readable rendering of the property's value." }
        matched_definition_id:
          type: string
          description: >
            When present, an existing FieldDefinition whose vcard:X-<NAME>
            projection matches this property name. The wizard pre-selects
            "map to this definition" and the confirm path auto-promotes absent
            an override (the export round-trip guarantee).
        matched_definition_label:
          type: string
          description: Display label of the matched definition.
    Diagnostic:
      type: object
      description: >
        One non-fatal data-handling event from a format adapter (the shared
        loss-reporting type, DATA-02 issue #442): severity warn/info, the
        correspondence concept the event names, and a human message. Both the
        import preview diagnostics and the export loss reports carry this
        shape.
      properties:
        severity:
          type: string
          enum: [warn, info]
          description: warn = a fidelity-loss event; info = informational.
        concept:
          type: string
          description: Correspondence concept_id the event names, or "" for adapter-local events.
        message:
          type: string
    LossReport:
      type: object
      description: >
        One fidelity-loss event on one export (DATA-02, issue #442): which
        contact lost which field to which format, and why. The why (bucket +
        reason) comes from the DATA-01 field compatibility matrix, so every
        report corresponds to a matrix entry.
      properties:
        format:
          type: string
          enum: [vcard4, vcard3, jscontact]
          description: The serialized format that could not represent the field.
        contact_id:
          type: integer
          description: The contact that lost the field.
        contact_name:
          type: string
          description: The contact's display name ("First Last").
        vcard_uid:
          type: string
          description: The contact's stable RFC 6350 UID.
        severity:
          type: string
          enum: [warn]
          description: Loss reports are warn-severity events.
        concept:
          type: string
          description: The correspondence concept_id of the lost field.
        bucket:
          type: string
          enum: [unsupported, lossy]
          description: The DATA-01 matrix classification — unsupported (no home) or lossy (reduced fidelity).
        reason:
          type: string
          description: The DATA-01 matrix reason for the classification.
        message:
          type: string
          description: The adapter's own message describing the drop.
    ExportLossPreflightResponse:
      type: object
      description: >
        The response of GET /export/preflight (DATA-02, issue #442): what an
        export with the given format/selection/scope would lose, computed
        without producing the file. Always carries diagnostics as an array
        ([] when nothing would be lost, never null).
      properties:
        format:
          type: string
          enum: [vcard4, vcard3, jscontact]
        contact_count:
          type: integer
          description: How many contacts the preflight considered.
        diagnostics:
          type: array
          items: { $ref: "#/components/schemas/LossReport" }
    ImportMergeDiff:
      type: object
      description: >
        Per duplicate row, exactly what the "update" (Merge) action will
        change on the matched existing contact: scalars overwritten
        (incoming-wins-when-non-empty) and multi-valued entries appended
        (additive merge).
      properties:
        updated:
          type: array
          items: { $ref: "#/components/schemas/ImportScalarChange" }
        added:
          type: array
          items: { $ref: "#/components/schemas/ImportAddedValue" }
    ImportScalarChange:
      type: object
      properties:
        field: { type: string, description: "Stable camelCase key (e.g. job_title, organization)." }
        label: { type: string, description: "Human-readable fallback label." }
        old: { type: string }
        new: { type: string }
    ImportAddedValue:
      type: object
      properties:
        kind: { type: string, description: "One of email, phone, address, url, impp." }
        value: { type: string, description: "Display rendering of the appended entry." }
    ImportRecordsRequest:
      type: object
      required: [records]
      properties:
        records:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: "#/components/schemas/ContactRecordInput" }
    ImportPreviewResponse:
      type: object
      description: Returned by the VCF/JSContact upload endpoints and by POST /contacts/import/preview (CSV).
      properties:
        session_id: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRowPreview" }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        duplicate_count: { type: integer }
        error_count: { type: integer }
    RowImportAction:
      type: object
      required: [action]
      properties:
        row_index: { type: integer, minimum: 0 }
        action: { type: string, enum: [skip, add, update] }
    ImportConfirmRequest:
      type: object
      required: [session_id, actions]
      properties:
        session_id: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RowImportAction" }
        field_mappings:
          type: array
          items: { $ref: "#/components/schemas/ImportFieldMapping" }
          description: >
            Issue #514 custom-field promotion decisions — one per discovered
            X-* property. Absent/empty keeps every discovered property in
            passthrough except those matching an existing definition's vcard
            projection, which auto-promote. Only VCF/JSContact/records
            (VCF-like) sessions consume these.
    ImportFieldMapping:
      type: object
      required: [property_name, action]
      description: >
        One decision from the issue #514 import-wizard step: promote a
        discovered X-* property into an existing ("map") or newly-created
        ("create") custom field definition, or keep it in passthrough
        ("ignore", the default).
      properties:
        property_name: { type: string, description: "The discovered X-* property this decision applies to (case-insensitive)." }
        action: { type: string, enum: [ignore, map, create] }
        field_definition_id:
          type: string
          description: "Required when action == map: the existing definition (owned by the current user) to promote values into."
        label:
          type: string
          description: "Used when action == create: the new definition's display label. Defaults to a title-cased derivation of the property name."
        type:
          type: string
          enum: [string, text, number, boolean, date, datetime, uri, email, phone, enum]
          description: "Used when action == create: the new definition's field type. Defaults to text."
    ImportResult:
      type: object
      description: Returned by POST /contacts/import/confirm and /contacts/import/vcf/confirm.
      properties:
        total_processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        errors: { type: array, items: { type: string } }

    ImportRun:
      type: object
      description: >
        One persisted contact-import outcome (issue #651) — the same counts an
        ImportResult carries (minus the error strings), plus the source format
        and a timestamp. User-scoped, immutable, read-only.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        format:
          type: string
          enum: [csv, vcf, jscontact, records, monica, meerkat]
          description: "Source of the imported data. Mirrored by migration 000042's CHECK (widened by 000046 for the source-import formats) and frontend/src/api/import.ts."
        total_processed: { type: integer }
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        error_count: { type: integer, description: "Number of rows that errored (len of ImportResult.errors)" }
        created_at: { type: string, format: date-time }

    # --- Monica import assistant (issue #549) ---
    MonicaConnectRequest:
      type: object
      required: [base_url, api_token]
      description: >
        Instance URL and API token for a live Monica account. The token is
        third-party credential material — held only in the in-memory import
        session, never logged or persisted. The base URL is subject to the
        SSRF egress guard (MONICA_BLOCK_PRIVATE_URLS).
      properties:
        base_url: { type: string, maxLength: 500 }
        api_token: { type: string, maxLength: 4000 }
    MonicaEntityCounts:
      type: object
      properties:
        contacts: { type: integer }
        activities: { type: integer }
        notes: { type: integer }
        reminders: { type: integer }
        calls: { type: integer }
        tasks: { type: integer }
        gifts: { type: integer }
        debts: { type: integer }
    MonicaConnectResponse:
      type: object
      properties:
        session_id: { type: string }
        totals: { $ref: "#/components/schemas/MonicaEntityCounts" }
        estimated_fetch_seconds: { type: integer, description: "Rough fetch duration at ~1 request/second." }
    MonicaFetchRequest:
      type: object
      required: [session_id]
      description: >
        Starts the background snapshot fetch. The reciprocal half of each
        bidirectional Monica relationship is always collapsed by the mapper
        (ADR-0007) — no toggle.
      properties:
        session_id: { type: string }
        include_relationships: { type: boolean, description: "Also pull each contact's relationships (one request per contact)." }
        include_extras: { type: boolean, description: "Also pull calls, tasks, gifts and debts." }
    MonicaImportIssue:
      type: object
      description: One entry of the pre-confirm loss report (the #442 record/field/category shape).
      properties:
        record: { type: string }
        field: { type: string }
        category: { type: string, enum: [unsupported, lossy, transformed, invalid, skipped] }
        message: { type: string }
    MonicaRowRelatedCounts:
      type: object
      description: >
        Per-contact tally of graph entities the import will create. Notes
        already includes Monica tasks and debts; Activities already includes
        logged calls.
      properties:
        activities: { type: integer }
        notes: { type: integer }
        reminders: { type: integer }
        relationships: { type: integer }
        gifts: { type: integer }
    MonicaImportRowPreview:
      type: object
      description: One contact row of the review step — the shared ImportRowPreview plus Monica context.
      allOf:
        - $ref: "#/components/schemas/ImportRowPreview"
        - type: object
          properties:
            related: { $ref: "#/components/schemas/MonicaRowRelatedCounts" }
            has_photo: { type: boolean }
    MonicaImportStatus:
      type: object
      description: Poll payload for the fetch/import progress bar.
      properties:
        session_id: { type: string }
        phase:
          type: string
          enum: [connecting, fetching_contacts, fetching_activities, fetching_notes, fetching_reminders, fetching_extras, fetching_relationships, building_preview, ready, importing, importing_photos, done, failed, cancelled]
        phase_done: { type: integer }
        phase_total: { type: integer }
        error: { type: string }
        result: { $ref: "#/components/schemas/MonicaImportResult" }
    MonicaPreviewResponse:
      type: object
      properties:
        session_id: { type: string }
        rows:
          type: array
          items: { $ref: "#/components/schemas/MonicaImportRowPreview" }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        duplicate_count: { type: integer }
        error_count: { type: integer }
        totals: { $ref: "#/components/schemas/MonicaRowRelatedCounts" }
        loss_report:
          type: array
          description: Every mapping issue, shown before the user commits (issue #442). Serialised as [] when nothing is lost.
          items: { $ref: "#/components/schemas/MonicaImportIssue" }
    MonicaConfirmRequest:
      type: object
      required: [session_id, actions]
      description: >
        Executes the import with the review step's per-contact decisions.
        "update" merges the mapped contact into the row's detected duplicate
        via the shared MergeImportedContact policy.
      properties:
        session_id: { type: string }
        actions:
          type: array
          items: { $ref: "#/components/schemas/RowImportAction" }
    MonicaImportResult:
      type: object
      description: Outcome summary. Embeds ImportResult and adds graph-entity + photo counts.
      allOf:
        - $ref: "#/components/schemas/ImportResult"
        - type: object
          properties:
            relationships_created: { type: integer }
            notes_created: { type: integer }
            activities_created: { type: integer }
            reminders_created: { type: integer }
            gifts_created: { type: integer }
            custom_fields_created: { type: integer }
            photos_queued: { type: integer }
            photos_saved: { type: integer }
            photos_failed: { type: integer }

    # --- Meerkat import assistant (issue #550) ---
    MeerkatSourceUser:
      type: object
      description: One user of the uploaded Meerkat database, for the source-user picker.
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        email: { type: string }
        name: { type: string }
        contacts: { type: integer, description: "How many contacts belong to this source user." }
    MeerkatEntityCounts:
      type: object
      description: Whole-file totals across all source users, shown after upload.
      properties:
        contacts: { type: integer }
        relationships: { type: integer }
        notes: { type: integer }
        activities: { type: integer }
        reminders: { type: integer }
    MeerkatUploadResponse:
      type: object
      properties:
        session_id: { type: string }
        source_users:
          type: array
          items: { $ref: "#/components/schemas/MeerkatSourceUser" }
        default_source_user_id:
          type: integer
          format: int64
          description: The first source user; pre-selected in the picker. Absent when the database has no user scoping.
        totals: { $ref: "#/components/schemas/MeerkatEntityCounts" }
    MeerkatFetchRequest:
      type: object
      required: [session_id]
      description: >
        Starts the background map + preview build, scoped to source_user_id
        (defaults to the first source user). ADR-0007: the importer never
        silently mixes accounts.
      properties:
        session_id: { type: string }
        source_user_id:
          type: integer
          format: int64
          description: Which source user's data to import; omit to use the default.

    # --- Neutral RFC 9553 contact model (preserved ) ---
    CRMEnvelope:
      type: object
      description: Mycorrhizal-specific data outside any contact-exchange standard.
      properties:
        kind: { type: string }
        circles: { type: array, items: { type: string } }
        how_we_met: { type: string }
        work_information: { type: string }
        contact_information: { type: string }
        gender:
          type: string
          description: >
            Issue #515: the CRM's free-text gender field, given a real
            neutral-model home here so it round-trips through the Record and
            is served on the wire. Deliberately NOT vCard GENDER or JSContact
            speakToAs (see docs/specs/rfc6350-baseline.md's closing note) —
            never exported to a vCard/JSContact file. The legacy top-level
            sibling `gender` field on the contact DTOs remains for backward
            compat; when both are present, crm.gender wins (it is the
            authoritative copy).
    Passthrough:
      type: object
      description: Unmapped data preserved verbatim (docs/adrs/0001-neutral-hub-and-spoke-contact-model.md).
      properties:
        vCardProps:
          type: array
          items:
            $ref: "#/components/schemas/JCardProp"
        jsContactProps:
          type: object
          additionalProperties: true
    JCardProp:
      type: object
      required: [name, type, value]
      properties:
        name: { type: string }
        params:
          type: object
          additionalProperties: true
        type: { type: string, example: text }
        value: {}
    Timestamp:
      type: object
      required: [utc]
      properties:
        utc: { type: string, format: date-time }
    PartialDate:
      type: object
      properties:
        year: { type: integer, nullable: true }
        month: { type: integer, nullable: true }
        day: { type: integer, nullable: true }
        calendarScale: { type: string }
    AnniversaryDate:
      type: object
      properties:
        partial:
          $ref: "#/components/schemas/PartialDate"
        timestamp: { type: string, format: date-time, nullable: true }
    Anniversary:
      type: object
      required: [kind, date]
      properties:
        id: { type: string }
        kind: { type: string, enum: [birth, death, wedding] }
        date:
          $ref: "#/components/schemas/AnniversaryDate"
        place:
          $ref: "#/components/schemas/Address"
    NameComponent:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum: [title, given, given2, surname, surname2, credential, generation, separator]
        value: { type: string }
        phonetic: { type: string }
    Name:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: "#/components/schemas/NameComponent"
        full: { type: string }
        sortAs:
          type: object
          additionalProperties: { type: string }
        isOrdered: { type: boolean, nullable: true }
        defaultSeparator: { type: string }
        phoneticSystem: { type: string, enum: [ipa, jyut, piny] }
        phoneticScript: { type: string }
    Nickname:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    OrgUnit:
      type: object
      required: [name]
      properties:
        name: { type: string }
        sortAs: { type: string }
    Organization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        units:
          type: array
          items:
            $ref: "#/components/schemas/OrgUnit"
        sortAs: { type: string }
    Title:
      type: object
      required: [name]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [title, role] }
        organizationId: { type: string }
    Email:
      type: object
      required: [address]
      properties:
        id: { type: string }
        address: { type: string, format: email }
        contexts:
          type: array
          items:
            type: string
            description: >
              The canonical RFC 9553 vocabulary is private/work, but this is
              NOT a closed enum on the wire: the flat model's free-text TYPE
              (home, work, ...) is preserved verbatim here
              (contactmodel/model.go — an unrecognized context is data, not
              an error). A client should treat it as open.
        pref: { type: integer, nullable: true }
        label: { type: string }
    Phone:
      type: object
      required: [number]
      properties:
        id: { type: string }
        number: { type: string }
        features:
          type: array
          items:
            type: string
            enum: [voice, fax, cell, video, pager, text, textphone, main-number]
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        label: { type: string }
    OnlineService:
      type: object
      properties:
        id: { type: string }
        service: { type: string }
        uri: { type: string }
        user: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        label: { type: string }
    AddressComponent:
      type: object
      required: [kind, value]
      properties:
        kind:
          type: string
          enum:
            [room, apartment, floor, building, number, name, block,
             subdistrict, district, locality, region, postcode, country,
             direction, landmark, postOfficeBox, separator]
        value: { type: string }
        phonetic: { type: string }
    Address:
      type: object
      properties:
        id: { type: string }
        components:
          type: array
          items:
            $ref: "#/components/schemas/AddressComponent"
        countryCode: { type: string }
        coordinates: { type: string, description: "geo: URI" }
        timeZone: { type: string }
        contexts:
          type: array
          items:
            type: string
            description: >
              The canonical vocabulary is billing/delivery/private/work, but
              this is NOT a closed enum on the wire: the flat model's
              free-text TYPE (home, ...) is preserved verbatim here
              (contactmodel/model.go — an unrecognized context is data, not
              an error). A client should treat it as open.
        pref: { type: integer, nullable: true }
        full: { type: string }
        isOrdered: { type: boolean, nullable: true }
        defaultSeparator: { type: string }
        phoneticSystem: { type: string }
        phoneticScript: { type: string }
    GrammaticalGender:
      type: object
      required: [value]
      properties:
        id: { type: string }
        value: { type: string, enum: [animate, common, feminine, inanimate, masculine, neuter] }
        language: { type: string }
    Pronouns:
      type: object
      required: [pronouns]
      properties:
        id: { type: string }
        pronouns: { type: string, example: "she/her" }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    SpeakToAs:
      type: object
      properties:
        grammaticalGenders:
          type: array
          items:
            $ref: "#/components/schemas/GrammaticalGender"
        pronouns:
          type: array
          items:
            $ref: "#/components/schemas/Pronouns"
    PersonalInfo:
      type: object
      required: [kind, value]
      properties:
        id: { type: string }
        kind: { type: string, enum: [expertise, hobby, interest] }
        value: { type: string }
        level: { type: string, enum: [high, medium, low, beginner, average, expert] }
        listAs: { type: integer, nullable: true }
        label: { type: string }
    Author:
      type: object
      properties:
        name: { type: string }
        uri: { type: string }
    CardNote:
      type: object
      required: [note]
      properties:
        id: { type: string }
        note: { type: string }
        author:
          $ref: "#/components/schemas/Author"
        created:
          $ref: "#/components/schemas/Timestamp"
    Resource:
      type: object
      required: [uri]
      properties:
        id: { type: string }
        kind: { type: string, description: "photo|logo|sound (Media) or directory|entry (Directories); unset for single-purpose Resource fields." }
        uri:
          type: string
          description: >
            M6: on contact READ responses, a Media entry with kind=photo
            carries a relative URL to GET /contacts/{id}/profile_picture
            (full-photo variant) instead of a data URI. Persisted/exported
            Cards and Media entries of other kinds keep their original value.
        mediaType: { type: string }
        label: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
        listAs: { type: integer, nullable: true }
    LanguagePref:
      type: object
      required: [language]
      properties:
        id: { type: string }
        language: { type: string }
        contexts: { type: array, items: { type: string } }
        pref: { type: integer, nullable: true }
    Relation:
      type: object
      required: [target]
      properties:
        target: { type: string }
        relations: { type: array, items: { type: string } }
    Card:
      type: object
      description: >
        Neutral superset of a contact's standardized data (union of RFC 9553
        JSContact + the IANA vCard-elements registry). See
        docs/adrs/0002-correspondence-table-locked-oracle.md for the full field-by-field
        mapping to/from vCard 3.0/4.0 and JSContact.
      properties:
        uid: { type: string }
        kind: { type: string, enum: [individual, group, org, location, application, device] }
        language: { type: string }
        prodId: { type: string }
        created:
          $ref: "#/components/schemas/Timestamp"
        updated:
          $ref: "#/components/schemas/Timestamp"
        name:
          $ref: "#/components/schemas/Name"
        nicknames:
          type: array
          items: { $ref: "#/components/schemas/Nickname" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/Organization" }
        titles:
          type: array
          items: { $ref: "#/components/schemas/Title" }
        emails:
          type: array
          items: { $ref: "#/components/schemas/Email" }
        phones:
          type: array
          items: { $ref: "#/components/schemas/Phone" }
        imppAddresses:
          type: array
          items: { $ref: "#/components/schemas/OnlineService" }
        socialProfiles:
          type: array
          items: { $ref: "#/components/schemas/OnlineService" }
        otherOnlineServices:
          type: array
          items: { $ref: "#/components/schemas/OnlineService" }
        addresses:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        anniversaries:
          type: array
          items: { $ref: "#/components/schemas/Anniversary" }
        speakToAs:
          $ref: "#/components/schemas/SpeakToAs"
        personalInfo:
          type: array
          items: { $ref: "#/components/schemas/PersonalInfo" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/CardNote" }
        keywords:
          type: array
          items: { type: string }
        media:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        calendars:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        freeBusyUrls:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        schedulingAddresses:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        cryptoKeys:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        directories:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        links:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        contactUris:
          type: array
          items: { $ref: "#/components/schemas/Resource" }
        preferredLanguages:
          type: array
          items: { $ref: "#/components/schemas/LanguagePref" }
        relatedTo:
          type: array
          items: { $ref: "#/components/schemas/Relation" }
        members:
          type: array
          items: { type: string }
        localizations:
          type: object
          additionalProperties: true
