                    $ref: "#/components/schemas/ConversationAgenda"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The subject contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversation-agenda/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a conversation agenda item
      operationId: getConversationAgenda
      responses:
        "200":
          description: The conversation agenda item (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationAgenda"
        "404":
          description: Conversation agenda item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a conversation agenda item (full replace of content fields)
      operationId: updateConversationAgenda
      description: The resolved state (discussed_at / activity_id) is never touched by update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationAgendaInput"
      responses:
        "200":
          description: The updated conversation agenda item (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationAgenda"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Conversation agenda item (or subject contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a conversation agenda item (soft delete)
      operationId: deleteConversationAgenda
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Conversation agenda item not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /conversation-agenda/{id}/discuss:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Mark a conversation agenda item as discussed
      operationId: discussConversationAgenda
      description: >
        The agenda item's only resolution — it has no due date or completion
        cron; it is resolved by the next conversation. Sets discussed_at to
        now and, when activity_id is supplied, links the interaction that
        covered it. The item stays visible in a resolved state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
