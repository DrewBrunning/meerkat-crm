  # --- Contact import (CSV / VCF / JSContact) ---
  /contacts/import/upload:
    post:
      summary: Upload a CSV file to start a contact import (step 1 of 3)
      operationId: uploadCsvImport
      description: >
        Parses the CSV's headers and suggests column-to-field mappings.
        Returns a session_id used by POST /contacts/import/preview and
        /contacts/import/confirm. The session (and any prior expired ones)
        is cleaned up opportunistically on each upload call.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .csv file." }
      responses:
        "200":
          description: Parsed headers, suggested mappings, and a sample of rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportUploadResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed CSV.
  /contacts/import/vcf/upload:
    post:
      summary: Upload a VCF (vCard 3.0/4.0) file to start a contact import
      operationId: uploadVcfImport
      description: >
        No column mapping needed (vCard is self-describing): parses directly
        into a preview with duplicate detection. Confirm via
        POST /contacts/import/vcf/confirm.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A .vcf file (one or more concatenated vCards)." }
      responses:
        "200":
          description: Parsed rows with duplicate detection and per-row diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed VCF.
  /contacts/import/jscontact/upload:
    post:
      summary: Upload a JSContact (RFC 9553) JSON file to start a contact import
      operationId: uploadJscontactImport
      description: >
        Mirrors /contacts/import/vcf/upload — the resulting session is
        format-agnostic (same underlying VCFContactData shape), so confirm
        via the same POST /contacts/import/vcf/confirm endpoint.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "A JSContact .json file (single Card or an array of Cards)." }
      responses:
        "200":
          description: Parsed rows with duplicate detection and per-row diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Missing file, wrong extension, oversized file, or malformed JSON.
  /contacts/import/records:
    post:
      summary: Start a contact import from a batch of neutral Card/CRM records
      operationId: uploadImportRecords
      description: >
        T96's device-contacts path and the stable bulk-import contract for
        external clients (T57): a batch of records in the same nested
        Card/CRM shape POST /contacts accepts is run through the standard
        import preview pipeline (validation, per-row DB duplicate detection
        with a merge diff, and within-batch duplicate detection) and returns
        an ImportPreviewResponse. Confirm via POST /contacts/import/vcf/confirm
        exactly like a VCF/JSContact session — the same repeatable contract
        serves a first-run prompt and a standing "Import from contacts"
        entry point alike.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRecordsRequest"
      responses:
        "200":
          description: Parsed rows with duplicate detection, merge diffs, and per-row diagnostics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Empty batch, or a record with no name.
  /contacts/import/preview:
    post:
      summary: Apply column mappings to a CSV import session and get a preview (step 2 of 3)
      operationId: previewCsvImport
      description: CSV-only — VCF/JSContact sessions already have their preview from the upload step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPreviewRequest"
      responses:
        "200":
          description: Row-by-row preview with duplicate detection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "400":
          description: Unknown/expired session, or session owned by another user.
  /contacts/import/confirm:
    post:
      summary: Execute a CSV import with the caller's per-row actions (step 3 of 3)
      operationId: confirmCsvImport
      description: >
        One bad row's error does not abort the batch — other rows in the
        same request still commit. The session is deleted on completion.
        Idempotent (T57): once a session is confirmed, re-confirming the same
        session_id within the 15-minute session window returns the original
        result as a no-op instead of re-applying, so a client that lost the
        response can retry safely without double-importing. To change
        decisions, start a new upload. This endpoint is for CSV-sourced
        sessions (and, historically, VCF ones); a records-sourced session ID
        is rejected here and must be confirmed via /contacts/import/vcf/confirm.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmRequest"
      responses:
        "200":
          description: Import result summary (the same result is replayed on a retried confirm of a consumed session).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: No prior preview cached, or unknown/expired/foreign session.
  /contacts/import/vcf/confirm:
    post:
      summary: Execute a VCF or JSContact import with the caller's per-row actions
      operationId: confirmVcfImport
      description: >
        Same contract as /contacts/import/confirm, plus photo processing:
        embedded or URL-referenced photos are saved after the row commits
        (an incoming photo never overwrites a contact that already has one
        on "update"). Idempotent (T57): once a session is confirmed,
        re-confirming the same session_id within the 15-minute session
        window returns the original result as a no-op instead of re-applying,
        so a client that lost the response (e.g. a dropped mobile request)
        can retry safely without double-importing. To change decisions, start
        a new upload.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmRequest"
      responses:
        "200":
          description: Import result summary (the same result is replayed on a retried confirm of a consumed session).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: A CSV-sourced session ID was sent here, no prior preview cached, or unknown/expired/foreign session.

  /contacts/import/history:
    get:
      summary: Recent contact-import outcomes for the caller
      operationId: getImportHistory
      description: >
        One immutable row per confirmed import (issue #651), newest first,
        capped at 50 — the source format and the same counts the confirm
        response returned (created / updated / skipped / total processed) plus
        an error count. User-scoped: only the caller's own imports. Backs the
        history table on the Data settings page.
      responses:
        "200":
          description: The caller's import history, newest first (an empty array when nothing has been imported).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportRun"
        "401":
          description: Not authenticated.

  # --- Monica import assistant (issue #549) ---
  # A five-step wizard over an in-memory session: connect (URL + API token) →
  # fetch (background snapshot pull, polled via /status) → preview (review with
  # the loss report) → confirm → result. The confirm delegates to the shared
  # source-import engine; avatars download after the transaction and are
  # reported through /status. The API token lives only in the session and is
  # never logged or persisted.
  /contacts/import/monica/connect:
    post:
      summary: Validate a live Monica URL + API token and open an import session
      operationId: connectMonicaImport
      description: >
        Probes the Monica API (nine serialized requests), enforces the
        account-size caps, and returns a session ID plus the account's entity
        counts and a fetch-duration estimate. The base URL is subject to the
        SSRF egress guard (MONICA_BLOCK_PRIVATE_URLS).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonicaConnectRequest"
      responses:
        "200":
          description: Session opened; account entity counts returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonicaConnectResponse"
        "400":
          description: Invalid URL, rejected token, private-address block, or an account larger than the import supports.
        "429":
          description: Too many concurrent Monica import sessions for this user.
  /contacts/import/monica/fetch:
    post:
      summary: Start the background snapshot fetch for a session
      operationId: startMonicaFetch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonicaFetchRequest"
      responses:
        "202":
          description: Fetch started; poll GET /contacts/import/monica/status.
        "400":
          description: Unknown/expired/foreign session.
        "409":
          description: A fetch is already running or finished for this session.
  /contacts/import/monica/status:
    get:
      summary: Poll fetch/import progress for a session
      operationId: getMonicaImportStatus
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current phase and progress; the result is present from phase "importing_photos" onwards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonicaImportStatus"
        "400":
          description: Missing session_id.
        "404":
          description: Unknown or expired session.
  /contacts/import/monica/preview:
    get:
      summary: Get the review rows and loss report for a fetched snapshot
      operationId: getMonicaImportPreview
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-contact review rows, related-entity totals, and the full loss report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonicaPreviewResponse"
        "400":
          description: Missing session_id, or the snapshot is not fetched yet.
        "404":
          description: Unknown or expired session.
  /contacts/import/monica/confirm:
    post:
      summary: Start the Monica import with the review step's per-contact actions
      operationId: confirmMonicaImport
      description: >
        Starts the import in the background and returns 202 immediately. The
        client polls GET /status: phase advances importing → importing_photos →
        done (or → cancelled / failed), and Status.result carries the summary
        from importing_photos on. Runs through the shared source-import engine
        in one transaction bound to a session context, so POST /cancel during
        "importing" rolls the whole import back. Records an import_runs history
        row (format "monica"); a re-run skips contacts already imported (the
        import_source_links ledger).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonicaConfirmRequest"
      responses:
        "202":
          description: Import started; poll GET /contacts/import/monica/status.
        "400":
          description: Unknown/expired/foreign session, or the snapshot is not fetched yet.
  /contacts/import/monica/cancel:
    post:
      summary: Cancel an in-flight Monica import, or drop the session
      operationId: cancelMonicaImport
      description: >
        During "importing"/"importing_photos" this cancels the transaction
        context — the whole import rolls back, phase becomes "cancelled", and
        the session is kept so the user can retry from review. In any other
        phase it drops the session and its API token.
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: In-flight import cancelled (rolled back), or the session was dropped.
        "400":
          description: Missing session_id.
        "404":
          description: Unknown or expired session.

  # --- Meerkat import assistant (issue #550) ---
  # Direct-DB (ADR-0007): the user uploads their Meerkat CRM SQLite file, the
  # server opens it read-only, and the mapped plan is reviewed and confirmed
  # through the shared source-import engine. The uploaded file is held only as
  # a 0600 temp file for the session's lifetime.
  /contacts/import/meerkat/upload:
    post:
      summary: Upload a Meerkat SQLite database and open an import session
      operationId: uploadMeerkatDatabase
      description: >
        Validates the file (SQLite magic header, size cap, .db/.sqlite/.sqlite3
        extension), stages it as a temp file, parses it, and returns a session
        ID plus the per-source-user picker (a Meerkat deployment can hold
        several users; the import never silently mixes accounts) and the
        whole-file totals.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Database staged; source-user picker + totals returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeerkatUploadResponse"
        "400":
          description: Not a Meerkat database, too large, wrong extension, or over the account-size cap.
        "429":
          description: Too many concurrent Meerkat import sessions for this user.
  /contacts/import/meerkat/fetch:
    post:
      summary: Start the background map + preview build for a chosen source user
      operationId: startMeerkatFetch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeerkatFetchRequest"
      responses:
        "202":
          description: Preparation started; poll GET /contacts/import/meerkat/status.
        "400":
          description: Unknown/expired/foreign session.
        "409":
          description: The session is already being prepared.
  /contacts/import/meerkat/status:
    get:
      summary: Poll map/import progress for a session
      operationId: getMeerkatImportStatus
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Current phase and progress; the result is set from phase "importing" on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonicaImportStatus"
        "400":
          description: Missing session_id.
        "404":
          description: Unknown or expired session.
  /contacts/import/meerkat/preview:
    get:
      summary: Get the review rows and loss report for a prepared database
      operationId: getMeerkatImportPreview
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-contact review rows, related-entity totals, and the loss report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonicaPreviewResponse"
        "400":
          description: Missing session_id, or the database is not prepared yet.
        "404":
          description: Unknown or expired session.
  /contacts/import/meerkat/confirm:
    post:
      summary: Start the Meerkat import with the review step's per-contact actions
      operationId: confirmMeerkatImport
      description: >
        Starts the import in the background and returns 202. The client polls
        GET /status: phase advances importing → done (or → cancelled / failed).
        Runs through the shared engine in one transaction bound to a session
        context, so POST /cancel during "importing" rolls the whole import
        back. Records an import_runs history row (format "meerkat"); a re-run
        skips contacts already imported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonicaConfirmRequest"
      responses:
        "202":
          description: Import started; poll GET /contacts/import/meerkat/status.
        "400":
          description: Unknown/expired/foreign session, or the database is not prepared yet.
  /contacts/import/meerkat/cancel:
    post:
      summary: Cancel an in-flight Meerkat import, or drop the session
      operationId: cancelMeerkatImport
      description: >
        During "importing" this cancels the transaction context — the whole
        import rolls back, phase becomes "cancelled", the session is kept for a
        retry. In any other phase it drops the session and deletes its
        uploaded-file temp directory.
      parameters:
        - name: session_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: In-flight import cancelled (rolled back), or the session was dropped.
        "400":
          description: Missing session_id.
        "404":
          description: Unknown or expired session.

  # --- Contact sharing (P1, P1) ---
  # One-time filtered copy between two users on the same instance -- not a
  # standing/live share (P1b, deferred). Accept is preview-only (parses the
  # stored payload through the same import machinery as
  # /contacts/import/vcf/confirm above); Confirm delegates to the identical
  # service method and only then flips the share to accepted.
  /contact-shares:
    post:
      summary: Share a filtered copy of a contact with another user
      operationId: createContactShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactShareInput"
      responses:
        "200":
          description: Share created (pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  contact_share:
                    $ref: "#/components/schemas/ContactShare"
        "400":
          description: Unknown field-selection section, or to_user_id equals the caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The contact does not belong to the caller, or the recipient does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contact-shares/incoming:
    get:
      summary: List shares sent to the authenticated user
      operationId: listIncomingContactShares
      description: Cursor-paginated (same (updated_at, id) scheme as /circles).
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of incoming shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactShareListResponse"
  /contact-shares/outgoing:
    get:
      summary: List shares the authenticated user has sent
      operationId: listOutgoingContactShares
      description: Cursor-paginated (same (updated_at, id) scheme as /circles).
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: A page of outgoing shares.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactShareListResponse"
  /contact-shares/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Preview accepting a share (parse -> preview; does not import yet)
      operationId: acceptContactShare
      description: >
        Parses the share's stored payload through the same duplicate-
        detection/preview pipeline as the VCF/JSContact import upload
        endpoints and returns an ImportPreviewResponse. The recipient then
        picks a per-row add/update/skip action and calls Confirm — this step
        alone never changes the share's status.
      responses:
        "200":
          description: Import preview (one row per contact in the payload -- always one for P1).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreviewResponse"
        "404":
          description: Share not found, or the caller is not its recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The share has already been accepted or declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contact-shares/{id}/confirm:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Finalize an accepted share using the recipient's per-row actions
      operationId: confirmContactShare
      description: >
        Delegates to the exact same import-session confirm logic as
        /contacts/import/vcf/confirm (add/update/skip per row, including
        photo handling); "update" merges into an existing matched contact via
        the same MergeImportedContact policy an ordinary import uses. Only on
        success does the share flip to accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportConfirmRequest"
      responses:
        "200":
          description: Import result summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "404":
          description: Share not found, or the caller is not its recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The share has already been accepted or declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /contact-shares/{id}/decline:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Decline a pending share
      operationId: declineContactShare
      description: The sender's original contact and their record of the offer are untouched.
      responses:
        "200":
          description: Share declined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: Share not found, or the caller is not its recipient.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The share has already been accepted or declined.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Relationship edges ---
  /relationship-edges:
    get:
      summary: List relationship edges
      operationId: listRelationshipEdges
      description: >
        Cursor-paginated (T17). Relationship edges are a hard-delete
        collection — the sync.mode is full_resync: a client re-pulls the
        collection rather than using ?since= (edges have no tombstone).
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: contact_id
          in: query
          description: Filter to edges where this Contact.VCardUID is either endpoint.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Filter by status (confirmed or suggested).
          schema: { type: string, enum: [confirmed, suggested] }
        - name: type
          in: query
          description: Filter by relationship type token (e.g. parent_of).
          schema: { type: string }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of edges.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship_edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelationshipEdge"
                  total: { type: integer }
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create a relationship edge
      operationId: createRelationshipEdge
      description: >
        Each endpoint is either an existing contact (source_id/target_id, a
        Contact.VCardUID) or a not-yet-existing "thin" contact described
        inline (source_thin/target_thin) — exactly one of the pair per
        endpoint. The server always sets Source=user-confirmed,
        Confidence=1.0, Status=confirmed. **Response is wrapped in a
        `relationship_edge` key** (unlike the update/accept endpoints, which
        return the raw object — a real asymmetry that has burned a frontend
        once).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipEdgeInput"
      responses:
        "201":
          description: Edge created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship_edge:
                    $ref: "#/components/schemas/RelationshipEdge"
        "400":
          description: Validation failed, both/neither endpoint given, or source_id == target_id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: An existing endpoint contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request with this Idempotency-Key is still being processed (CON-04, ADR 0010); retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The Idempotency-Key was already used for a different request body (CON-04, ADR 0010).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /relationship-edges/suggest:
    post:
      summary: Suggest relationships from relationships
      operationId: suggestRelationshipEdges
      description: >
        T104: runs one round of two-hop graph inference over the caller's
        confirmed relationship edges and persists the newly-derived
        suggestions (Status=suggested, Source=graph-inferred). Opt-in, one
        round per press, and idempotent — re-running never duplicates an
        existing edge. Returns only the edges this call newly created.
      responses:
        "200":
          description: Suggestions generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  suggested_edges:
                    type: array
                    items:
                      $ref: "#/components/schemas/RelationshipEdge"
                  total: { type: integer }
        "500":
          description: Database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /relationship-edges/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Get a relationship edge
      operationId: getRelationshipEdge
      responses:
        "200":
          description: The edge (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a relationship edge (full replace)
      operationId: updateRelationshipEdge
      description: Status/Source/Confidence are server-derived and never changed by an update.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RelationshipEdgeInput"
      responses:
        "200":
          description: The updated edge (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "400":
          description: Validation failed or endpoint resolution failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Edge or endpoint contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a relationship edge
      operationId: deleteRelationshipEdge
      description: Hard delete. Doubles as "reject" for suggested edges.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /relationship-edges/{id}/accept:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Accept a suggested relationship edge
      operationId: acceptRelationshipEdge
      description: Only valid when the edge's status is "suggested". Returns the raw updated edge.
      responses:
        "200":
          description: Edge accepted (status now confirmed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationshipEdge"
        "404":
          description: Edge not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Edge is not a pending suggestion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Attachments (N7) ---
  /contacts/{id}/attachments:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Upload an attachment to a contact
      operationId: uploadAttachment
      description: >
        Stores a file against a contact (N7). The bytes go to disk under a
        server-generated UUID name; the original name is display-only. SVG and
        HTML uploads are rejected (in-origin XSS). Max 25MB.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
        "400":
          description: Invalid file (missing, too large, or SVG/HTML).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: List a contact's attachments
      operationId: listContactAttachments
      description: Returns the contact's non-deleted attachments, newest first.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Attachments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
                  total: { type: integer }
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attachments/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Download an attachment
      operationId: downloadAttachment
      description: >
        Serves an attachment's bytes. Content-Disposition is attachment by
        default and inline only for the image/pdf allow-list; SVG/HTML are
        never inline. X-Content-Type-Options: nosniff is always set.
      responses:
        "200":
          description: The file bytes.
        "404":
          description: Attachment or file not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /attachments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    delete:
      summary: Delete an attachment
      operationId: deleteAttachment
      description: >
        Soft-deletes the attachment record and removes its file from disk.
      responses:
        "200":
          description: Attachment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "404":
          description: Attachment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Profile pictures ---
  /contacts/{id}/profile_picture:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: Set a contact's profile picture
      operationId: uploadProfilePicture
      description: >
        Multipart upload (field name `photo`). JPEG/PNG/HEIC/HEIF only, max
        10 MB. The image is center-cropped to a square, downscaled to at most
        400x400 and stored as JPEG; a base64 thumbnail is generated. An absent
        `photo` field is accepted and just re-saves the contact.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo: { type: string, format: binary }
      responses:
        "200":
          description: The updated contact (raw Contact JSON).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactFlat"
        "400":
          description: Invalid contact id, oversized file, or unsupported format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Profile-picture changes are disabled in demo mode.
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      summary: Get a contact's profile picture
      operationId: getProfilePicture
      description: >
        Without query params serves the stored photo file directly (binary).
        With thumbnail=true serves the base64 thumbnail as a JPEG.
      parameters:
        - name: thumbnail
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: The image bytes (Content-Type image/jpeg, or the source image type).
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400":
          description: Invalid contact id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact, photo, or thumbnail not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Image proxy ---
  /proxy/image:
    get:
      summary: Fetch and proxy an external image (SSRF-guarded)
      operationId: proxyImage
      description: >
        Fetches the image at the given URL with SSRF guards (no private/
        loopback/link-local hosts), a 10 MB cap, and an image/ content-type
        requirement. SVG is rejected outright (XSS defense).
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string, format: uri }
      responses:
        "200":
          description: The image bytes with the upstream Content-Type.
          content:
            image/*:
              schema: { type: string, format: binary }
        "400":
          description: >
            Missing url, SVG images are not supported, or the url could not
            be fetched (unreachable, blocked by the SSRF guard, or not an
            image) — issue #524: an unfetchable caller-supplied url is the
            caller's own bad input, not a server malfunction.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Notes ---
  /contacts/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: List a contact's notes
      operationId: listContactNotes
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: search
          in: query
          description: Free-text search on note content.
          schema: { type: string }
        - name: fromDate
          in: query
          description: Inclusive YYYY-MM-DD lower bound on note date.
          schema: { type: string, format: date }
        - name: toDate
          in: query
          description: Inclusive YYYY-MM-DD upper bound on note date.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of the contact's notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
        "400":
          description: Malformed cursor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a note on a contact
      operationId: createContactNote
      description: The contact_id from the URL overrides any body contact_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note created successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notes:
    get:
      summary: List the user's unassigned notes (no contact)
      operationId: listUnassignedNotes
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every unassigned note changed after
            this position — including soft-deleted ones (deleted:true) —
            ordered forward, ignoring search/date filters. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: search
          in: query
          description: Free-text search on note content.
          schema: { type: string }
        - name: fromDate
          in: query
          description: Inclusive YYYY-MM-DD lower bound on note date.
          schema: { type: string, format: date }
        - name: toDate
          in: query
          description: Inclusive YYYY-MM-DD upper bound on note date.
          schema: { type: string, format: date }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The ?since= cursor is older than DELETED_RETENTION_DAYS — full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of unassigned notes.
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: "#/components/schemas/Note"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create an unassigned note
      operationId: createUnassignedNote
      description: A body contact_id is honored here (unlike the contact-nested route).
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note created successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The referenced contact (if any) was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request with this Idempotency-Key is still being processed (CON-04, ADR 0010); retry shortly.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The Idempotency-Key was already used for a different request body (CON-04, ADR 0010).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: Get a note
      operationId: getNote
      responses:
        "200":
          description: The note (raw, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "404":
          description: Note not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Update a note
      operationId: updateNote
      description: Setting contact_id to null clears the assignment.
      parameters:
        - $ref: "#/components/parameters/IfMatchRevision"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: Note updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Note updated successfully" }
                  note:
                    $ref: "#/components/schemas/Note"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Note (or referenced contact) not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          description: Stale If-Match revision — the note was modified since the client last read it; the row was not changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a note (soft delete)
      operationId: deleteNote
      parameters:
