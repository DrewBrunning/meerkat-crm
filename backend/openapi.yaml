  # --- Households ---
  /households:
    get:
      summary: List households
      operationId: listHouseholds
      description: >
        Cursor-paginated (T17). Households are a hard-delete collection — the
        sync.mode is full_resync: a client re-pulls the collection rather than
        using ?since= (households have no tombstone).
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: include_members
          in: query
          description: When true, also returns a members array for the page's households.
          schema: { type: boolean, default: false }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of households.
          content:
            application/json:
              schema:
                type: object
                properties:
                  households:
                    type: array
                    items:
                      $ref: "#/components/schemas/Household"
                  total: { type: integer }
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
                  members:
                    type: array
                    items:
                      $ref: "#/components/schemas/HouseholdMember"
    post:
      summary: Create a household
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HouseholdInput"
      responses:
        "200":
          description: Household created (200, not 201).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Household created successfully" }
                  household:
                    $ref: "#/components/schemas/Household"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
