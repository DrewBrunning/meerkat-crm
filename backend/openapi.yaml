  # --- Life events ---
  /life-events:
    get:
      summary: List life events
      operationId: listLifeEvents
      parameters:
        - name: cursor
          in: query
          description: Opaque resume token from the previous page's next_cursor. Ignored when since is present.
          schema: { type: string }
        - name: since
          in: query
          description: >
            Change-feed cursor: return every life event changed after this
            position — including soft-deleted ones (deleted:true) — ordered
            forward, ignoring entity_id. A cursor older than
            DELETED_RETENTION_DAYS returns 410 Gone.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 25 }
        - name: order
          in: query
          description: Direction for the (updated_at, id) cursor order. since forces asc.
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: entity_id
          in: query
          description: Filter to life events whose subject contact is this Contact.VCardUID.
          schema: { type: string, format: uuid }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: The ?since= cursor is older than DELETED_RETENTION_DAYS — full resync required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A page of life events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  life_events:
                    type: array
                    items:
                      $ref: "#/components/schemas/LifeEvent"
                  next_cursor:
                    type: string
                    description: Resume token for the next page; empty when there are no more rows.
                  limit: { type: integer }
                  sync:
                    $ref: "#/components/schemas/SyncInfo"
    post:
      summary: Create a life event
      operationId: createLifeEvent
      description: When remind is true and the date has a month/day, a yearly reminder is materialized.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifeEventInput"
      responses:
        "201":
          description: Life event created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Life event created successfully" }
                  life_event:
                    $ref: "#/components/schemas/LifeEvent"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The subject contact was not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: A request with this Idempotency-Key is still being processed (CON-04, ADR 0010); retry shortly.
          content:
            application/json:
              schema:
