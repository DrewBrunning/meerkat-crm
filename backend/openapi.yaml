  # --- Notifications (N9) ---
  # --- T18 audit trail ---
  /audit:
    get:
      summary: List audit events
      operationId: listAuditEvents
      description: >
        Returns the caller's immutable audit events (T18), newest first,
        optionally filtered by entity_type/entity_id. Read-only.
      parameters:
        - name: entity_type
          in: query
          required: false
          schema: { type: string }
        - name: entity_id
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                type: object
                properties:
                  audit_events:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  total: { type: integer }

  /audit/{id}/undo:
    post:
      summary: Undo an update audit event
      operationId: undoAuditEvent
      description: >
        Restores the record an update audit event describes to its before
        snapshot (updates only — delete events are rejected). Events past the
        AUDIT_RETENTION_DAYS window are rejected (410): the purge has removed
        them and there is nothing to undo.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Record restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "400":
          description: Not an update event, or undo unsupported for this entity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Audit event or target record not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Event past retention; nothing to undo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /audit/export:
    get:
      summary: Export the caller's own audit trail as CSV
      operationId: exportAuditLog
      description: >
        Issue #416. Unbounded CSV export of every audit event for the
        caller, oldest first — unlike GET /audit, which caps at 500 rows for
        an interactive list. BeforeSnapshot is omitted by default: it is
        redacted for credentials but not filtered by contact-field
        sensitivity the way the vCard/JSContact exports are, so it is gated
        behind its own explicit opt-in rather than reusing include_sensitive.
      parameters:
        - name: include_snapshots
          in: query
          description: >
            When true, adds a "Before Snapshot" column with each event's
            redacted (credential-free) before-state JSON, which may still
            contain historical private/secret contact-field values. Defaults
            to false.
          schema: { type: boolean, default: false }
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: A CSV file.
          content:
            text/csv:
              schema: { type: string, format: binary }

  /notifications/config:
    get:
      summary: Get the user's notification channel setup
      operationId: getNotificationConfig
      description: Returns the per-user ntfy/Gotify config (Gotify token only as a has/has-not flag), the per-user channel toggles, and the server's Web Push VAPID public key so the browser can subscribe.
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's notification channel setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfigResponse"
    put:
      summary: Save the user's notification channel setup
      operationId: saveNotificationConfig
      description: "Upserts the per-user ntfy/Gotify config and the per-user channel toggles in one call. A Gotify token is write-only: an empty value keeps the stored token."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationConfigInput"
      responses:
        "400":
          description: Validation failed (e.g. an invalid URL).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The saved setup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationConfigResponse"
  /notifications/config/test:
    post:
      summary: Send a test notification through a channel
      operationId: testNotificationChannel
      description: Sends a single test notification via the user's saved config for the requested channel. A diagnosed failure (unconfigured, unreachable, private address blocked) is a 200 with ok:false so the Settings card can render the reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel]
              properties:
                channel:
                  type: string
                  enum: [ntfy, gotify, push]
      responses:
        "400":
          description: Unknown channel or malformed body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The test result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  error: { type: string, description: "Present only when ok is false." }
  /notifications/push-subscriptions:
    get:
      summary: List the user's push devices
      operationId: listPushSubscriptions
      responses:
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's registered push devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PushSubscriptionResponse"
    post:
      summary: Register a browser push subscription
      operationId: createPushSubscription
