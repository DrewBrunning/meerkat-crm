      summary: Test the current user's saved Nextcloud connection
      operationId: testWebDAVConnection
      description: >
        A single PROPFIND on the dav root (WebDAV has no unauthenticated
        reachability probe — the request either authenticates or it doesn't).
        Always 200 when the check itself could run — ok:false is a successful
        diagnosis.
      responses:
        "200":
          description: The diagnosis (ok may be true or false).
