      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscriptionInput"
      responses:
        "201":
          description: The registered subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionResponse"
        "400":
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications/push-subscriptions/{id}:
    delete:
      summary: Remove one of the user's push devices
      operationId: deletePushSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Subscription removed.
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /notifications/devices:
    get:
      summary: List the user's registered mobile push devices
      description: M2 — platform-agnostic mobile device push registrations (FCM today, APNS accepted).
      operationId: listDeviceRegistrations
      responses:
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's registered mobile devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      $ref: "#/components/schemas/DeviceRegistrationResponse"
    post:
      summary: Register a mobile device push token
      description: Called by the native app after the platform push service (FCM/APNS) hands out a token. Re-registering the same (client, token) reassigns the row to the calling user instead of duplicating it — the token identifies a physical app install, not a person.
      operationId: createDeviceRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRegistrationInput"
      responses:
        "201":
          description: The registered device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRegistrationResponse"
        "400":
          description: Validation failed (e.g. an unknown client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /notifications/devices/{id}:
    delete:
      summary: Remove one of the user's mobile push devices
      operationId: deleteDeviceRegistration
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Device registration removed.
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Device registration not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # --- Calendar subscriptions ---
  /calendars:
    get:
      summary: List the user's calendar subscriptions
      operationId: listCalendarSubscriptions
      responses:
        "401":
          description: Not authenticated (missing or invalid session cookie or full-scope bearer token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "200":
          description: The user's subscriptions (no pagination).
          content:
            application/json:
              schema:
                type: object
                properties:
                  calendars:
                    type: array
                    items:
                      $ref: "#/components/schemas/CalendarSubscriptionResponse"
    post:
      summary: Add an iCal/CalDAV calendar to import activities from
      operationId: createCalendarSubscription
      description: Capped at 10 subscriptions per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSubscriptionInput"
      responses:
        "201":
          description: Subscription created (raw response, not wrapped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscriptionResponse"
        "400":
          description: Invalid URL, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The per-user cap (10 subscriptions) is reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /calendars/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: Update a calendar subscription
      operationId: updateCalendarSubscription
      description: Changing the URL resets the sync token (full resync on next sync); clear_password removes stored credentials; an empty password leaves the existing credential untouched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarSubscriptionInput"
      responses:
        "200":
          description: Updated subscription (raw).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarSubscriptionResponse"
        "400":
          description: Non-integer id, invalid URL, or validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: Delete a calendar subscription
      operationId: deleteCalendarSubscription
      description: Imported activities are kept; only the subscription and its event-link bookkeeping are removed.
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Non-integer id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /calendars/{id}/sync:
    post:
      summary: Trigger an immediate sync of one calendar subscription
      operationId: syncCalendarSubscription
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Sync completed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  created: { type: integer }
                  updated: { type: integer }
                  skipped: { type: integer }
        "400":
          description: >
            Non-integer id, invalid calendar URL, or the subscription's
            calendar could not be reached (issue #524 — the caller's own
            subscription configuration, not a server malfunction).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Subscription not found (or not owned by the caller).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Sync failed for an unclassified reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >
            The remote server rejected the request, returned unparsable or
            oversized data, or resolved to a blocked private address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

