# Codecov config — issue #294 (visibility) + issue #267 (the diff gate).
#
# Two statuses, deliberately asymmetric:
#   - project: informational only. An absolute "must be at least N%" floor is
#     the worst variant of a coverage gate (issue #267) and stays off.
#   - patch: the gate on changed lines (Go coverprofile, vitest lcov, JaCoCo
#     aggregated XML — all three upload via the flags below). `only_pulls:
#     true` scopes it to PRs, where the author can act on it; a commit pushed
#     straight to main has no PR diff to gate and passes.
#
# Patch coverage is split into one status per area (2026-09-04 revision —
# supersedes the original flat `target: 100%, threshold: 0%`), each scoped
# via `flags:` so a mixed-area PR is judged separately per area instead of on
# one blended number. The targets are not fitted to historical PR pass rates;
# they come from reading what's actually testable in each area:
#
#   - backend (target 95%, threshold 5%): almost everything here is
#     reasonably testable and tests demonstrably catch real regressions —
#     dbtest.New(t) runs against the real migrated schema (CLAUDE.md's
#     "Backend traps" lists bugs a real-DB test caught), and INT-02 built
#     faults.Hook seams specifically so failure branches that used to be
#     untestable now are. The 5% buffer absorbs ordinary noise (partial-branch
#     attribution, a line mid-development-before-the-pragma-lands), not a
#     declared "some backend code is fine untested."
#   - frontend (target 90%, threshold 10%): a large share of files are
#     presentational MUI/JSX (~188 component files vs. ~46 hook/logic files)
#     where a test that only asserts `render()` doesn't throw adds coverage
#     without catching anything. The real regression-catching tests (hooks,
#     dialog state machines) sometimes hit genuinely fiddly async/race
#     branches (see useContacts.ts's stale-response guard) that cost
#     disproportionate effort for a marginal branch.
#   - android (target 80%, threshold 15%): JaCoCo only instruments
#     testDebugUnitTest (see AndroidConfig.kt's configureJacoco), so anything
#     that only runs under the instrumented E2E suite (issue #238) is
#     invisible to it. The clean-cut case — hand-written Hilt DI wiring
#     (`*Module` classes: one-line @Provides/@Binds delegations with no
#     branch) and Activity/Application framework-lifecycle callback bodies
#     (MainActivity/MycorrhizalApplication — their actual logic is already
#     factored into separately-covered pure functions) — is now excluded at
#     the JaCoCo level in AndroidConfig.kt's JACOCO_EXCLUDES, the same
#     mechanism already used for Hilt/Room/Moshi-generated code, rather than
#     papered over with a lower percentage. What's left and not cleanly
#     excludable — Keystore-backed code (RoomPassphraseStore) and
#     Firebase-SDK-availability gates — has too much real logic mixed in to
#     blanket-exclude by file, so it's absorbed by a target still below
#     backend/frontend rather than pretending it's equally testable.
#
# Override path (docs/development/coverage.md): write the test first; then
# `# pragma: no cover` / `/* v8 ignore next */` / `@Generated` a line that
# genuinely cannot be covered (needs a reason); then a file-level entry in
# `ignore:` below for a whole file outside the coverage model. The per-area
# threshold buffer is for ordinary noise, not a substitute for the override
# path on a line that's provably untestable — do that instead so the reason
# is visible in the diff.
codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      backend:
        target: 95%
        threshold: 5%
        flags:
          - backend
        only_pulls: true
      frontend:
        target: 90%
        threshold: 10%
        flags:
          - frontend
        only_pulls: true
      android:
        target: 80%
        threshold: 15%
        flags:
          - android
        only_pulls: true

# CI is path-gated (dorny/paths-filter — see unit-tests.yml / android-tests.yml
# "Detect Changes"), so a PR touching only one area never uploads the other
# flags. Without carryforward, Codecov would treat that PR's single flag as
# the whole repo's coverage, which is wrong and makes the diff comment
# misleading. carryforward: true reuses each flag's last known coverage on
# commits/PRs that don't touch that area.
flags:
  backend:
    paths:
      - backend/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true
  android:
    paths:
      - android/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # Hand-written SQL migrations (no .go source lives here today, but this
  # guards against a future embed.go/helper landing in the same directory).
  - "backend/database/migrations/**"
  # No codegen exists yet anywhere in the repo (checked when this file was
  # written); this is a placeholder for whenever one shows up, per CLAUDE.md's
  # "frontend enum/registry lists are hardcoded mirrors" note — nothing here
  # is actually generated today.
  - "frontend/src/generated/**"
  # Issue #263: the macrobenchmark harness is on-device instrumentation code
  # (androidx.benchmark.macro) — not unit-testable and deliberately outside the
  # JaCoCo aggregation (the module skips the coverage convention plugin). Keep
  # the diff gate from faulting its lines.
  - "android/macrobenchmark/**"
  # Issue #722 local auth / fully biometric login. JaCoCo only instruments
  # `testDebugUnitTest`; these Android files are structurally unexercisable on
  # the JVM (no AndroidKeyStore, no BiometricPrompt, no Hilt application host,
  # no live BiometricManager), so their changed lines can never be covered by
  # a unit test. Each is pinned by source-scan guard tests and/or the
  # instrumented device suite (issue #238):
  #  - MycorrhizalApp.kt: the Hilt-rooted root composable (its branch decision
  #    is factored into the covered rootSurface() pure function + RootSurfaceTest).
  #  - applock/BiometricUnlockVault.kt + AppUnlockPrompter.kt: Keystore
  #    auth-bound keys + the OS BiometricPrompt (guarded by
  #    BiometricUnlockCryptoGuardTest / AppUnlockPrompterGuardTest).
  #  - applock/AppLockScreen.kt: stateful host of the OS prompt; its stateless
  #    AppLockContent states are covered by AppLockScreenTest, but the file
  #    also hosts the device-only prompt path so it is excluded whole.
  #  - data/session/DeviceGrantTokenStorage.kt: EncryptedSharedPreferences +
  #    Keystore master key (guarded by EncryptedDeviceGrantStorageGuardTest).
  #  - data/auth/AndroidLocalAuthCapabilities.kt: BiometricManager device
  #    posture — Robolectric cannot report a successful authenticator.
  - "android/app/src/main/kotlin/com/mycorrhizal/crm/MycorrhizalApp.kt"
  - "android/app/src/main/kotlin/com/mycorrhizal/crm/applock/BiometricUnlockVault.kt"
  - "android/app/src/main/kotlin/com/mycorrhizal/crm/applock/AppUnlockPrompter.kt"
  - "android/app/src/main/kotlin/com/mycorrhizal/crm/applock/AppLockScreen.kt"
  - "android/core/data/src/main/kotlin/com/mycorrhizal/crm/data/session/DeviceGrantTokenStorage.kt"
  - "android/core/data/src/main/kotlin/com/mycorrhizal/crm/data/auth/AndroidLocalAuthCapabilities.kt"
