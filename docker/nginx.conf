# Mycorrhizal CRM - All-in-one image nginx configuration
#
# Single container: nginx serves the SPA and proxies API/health/CardDAV to the
# Go backend running in the same container on 127.0.0.1:8081 with nginx on 8080.

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Issue #865: emit relative Location headers for the .well-known discovery
    # redirects below. With the default `absolute_redirect on`, nginx builds
    # `return 301 /carddav/` into an absolute URL from the Host header and its
    # own listen port -- i.e. `http://<host>:8080/carddav/` -- which (a)
    # discloses the internal backend port and (b) is unreachable for a real
    # CardDAV/CalDAV client arriving over https on the published port. A
    # relative `Location: /carddav/` is resolved by the client against the
    # original request URI, preserving its scheme, host and port. The only
    # redirects this server block emits are those two well-known 301s.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Strict-Transport-Security is emitted only when the image is reached via
    # HTTPS. It is gated on the same COOKIE_SECURE signal the Go backend uses
    # (see backend/main.go), and rendered into /etc/nginx/hsts.conf by
    # docker/entrypoint.sh at startup. The default docker-compose deployment is
    # plain HTTP (7300:8080), where a blanket HSTS would break it, so this file
    # is empty unless COOKIE_SECURE=true.
    include /etc/nginx/hsts.conf;

    # Health check proxy - forward to backend
    #
    # add_header directives are inherited from the server level only when a
    # location defines none of its own -- and the four proxy locations below
    # (this one, /api/, /carddav/, /caldav/) were doing exactly that, so
    # every one of the server block's five security headers got appended by
    # nginx *on top of* the backend's own copies (SecurityHeadersMiddleware
    # already sets all five on every response, including a stricter
    # API-specific CSP -- see backend/middleware/security_headers.go).
    # Confirmed live: `curl -sD - http://localhost:7300/api/...` showed
    # X-Frame-Options twice and two different Content-Security-Policy values
    # on the wire. Caught by frontend/e2e/securityHeaders.spec.ts (#374).
    #
    # add_header only ever adds to whatever headers proxy_pass already
    # produced -- it can't replace or de-duplicate a header the upstream
    # sent -- so the fix isn't to repeat the five headers here (that would
    # just duplicate them again). Defining any add_header in a location
    # cancels inheriting the *entire* server-level set for that location, so
    # one unrelated, genuinely useful add_header is enough to opt these four
    # proxy locations out of nginx's own copies and let the backend's be the
    # sole, authoritative source.
    # Prefix match: also forwards /health/live and /health/ready (issue #421) —
    # nginx rewrites the matched "/health" prefix to the proxy_pass URI, so the
    # subpath is preserved.
    location /health {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy - forward requests to backend
    location /api/ {
        # See the comment on the /health location above -- this cancels
        # inheriting the server block's security headers so they aren't
        # duplicated on top of the backend's own.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Issue #863: the structured exporters emit a large response header,
        # X-Mycorrhizal-Export-Loss-Report (a URL-encoded JSON loss report,
        # capped backend-side at ~3 KB). nginx's default proxy_buffer_size is
        # one 4 KB page that must hold the *entire* upstream header block; a
        # large loss-report header alone overran it and nginx returned 502
        # ("upstream sent too big header") in place of the file, while the CSV
        # export (no such header) kept working. Give the response-header buffer
        # room. The backend cap is the real guard — it keeps the endpoint
        # working behind any stock proxy — and this is defence in depth for the
        # image we ship.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 16k;

        # Issue #876: nginx sets no client_max_body_size, so its compiled 1 MB
        # default rejected every import over 1 MB before it reached the
        # backend — making services.MaxCSVSize (20 MB) / MaxVCFSize (50 MB) /
        # MaxMeerkatDBSize (100 MB) unreachable in the shipped image, the same
        # class of bug issue #416 fixed one layer in, and hiding the app's
        # structured 413 behind nginx's HTML one. Set it above the largest app
        # cap so nginx is never the binding limit: the app's per-route
        # middleware.BodySizeLimitMiddleware stays the single source of truth
        # (it returns {"error":...} with a request_id; nginx returns an HTML
        # page). Keep this strictly greater than the app maximum, never equal —
        # an equal value makes which layer rejects a boundary condition.
        client_max_body_size 101m;
    }

    # CardDAV well-known discovery
    location /.well-known/carddav {
        return 301 /carddav/;
    }

    # CardDAV proxy - forward to backend
    location /carddav/ {
        # See the comment on the /health location above -- this cancels
        # inheriting the server block's security headers so they aren't
        # duplicated on top of the backend's own.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Support WebDAV methods
        proxy_method $request_method;

        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for streaming
        proxy_buffering off;

        # Ensure UTF-8 charset for vCard responses
        charset utf-8;
        charset_types text/vcard text/xml application/xml;
    }

    # CalDAV well-known discovery
    location /.well-known/caldav {
        return 301 /caldav/;
    }

    # CalDAV proxy - forward to backend (T12b: serve Interactions/LifeEvents)
    location /caldav/ {
        # See the comment on the /health location above -- this cancels
        # inheriting the server block's security headers so they aren't
        # duplicated on top of the backend's own.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:8081/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Support WebDAV methods
        proxy_method $request_method;

        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for streaming
        proxy_buffering off;

        # Ensure UTF-8 charset for iCalendar responses
        charset utf-8;
        charset_types text/calendar text/xml application/xml;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker script and the app shell must never be served stale.
    #
    # Both would otherwise be caught by the 1-year immutable rule below (the
    # regex matches any *.js, and index.html is served through it via the SPA
    # fallback). For a hashed bundle chunk that is correct; for these two it is
    # how a deployment gets stuck. An exact-match location takes precedence over
    # a regex one in nginx, so these win.
    #
    # Modern browsers already bypass the HTTP cache for the top-level worker
    # script (updateViaCache defaults to 'imports'), but that does not bind
    # intermediate proxies, and it is not a property to rely on for the file
    # that decides whether every other update is ever seen.
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    # Issue #476 (WEB-02): the service-worker escape hatch. /_recovery.html is
    # a standalone static page (backed by /_recovery.js) that clears every
    # CacheStorage bucket and unregisters the service worker -- the way out for
    # a user stranded on a broken worker/cache by a bad deploy. It must always
    # come from the network, never from an HTTP cache, so no-store here. It is
    # also excluded from the SW's precache manifest at build time
    # (frontend/vite.config.ts globIgnores), and the app's service worker is
    # written to skip /_* navigations (frontend/src/service-worker.ts), so this
    # stays reachable even while a broken worker controls the tab. The files
    # ship in the build (frontend/public/_recovery.{html,js}).
    location = /_recovery.html {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    location = /_recovery.js {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    # Issue #477 (WEB-03): the asset-skew bootstrap. A stable, un-hashed URL
    # (frontend/public/asset-skew.js, referenced from <head> in index.html) that
    # a stale index.html can still reference after a deploy -- it must come from
    # the network, never an HTTP cache, so it always runs against the current
    # server. Excluded from the SW precache at build time (vite.config.ts
    # globIgnores). Kept in step with frontend/nginx.conf.
    location = /asset-skew.js {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    # RFC 9116 vulnerability disclosure (issue #363).
    #
    # The SPA fallback above would otherwise swallow this path and serve
    # index.html (the browser would then refuse it as a security.txt), so the
    # file is served straight off disk via an exact-match location. The file
    # itself ships in the frontend build (frontend/public/.well-known/
    # security.txt). Do NOT remove this block as dead config - it is the
    # machine-readable disclosure endpoint scanners and researchers probe.
    location = /.well-known/security.txt {
        default_type text/plain;
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }

    # Cache static assets
    # Note: add_header directives must be repeated here because nginx does not
    # inherit server-level add_header when a location block defines its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        include /etc/nginx/hsts.conf;
    }
}
