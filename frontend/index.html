<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3E543E" />
    <meta name="description" content="Mycorrhizal CRM - Personal Relationship Manager" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Issue #477 (WEB-03): the asset-skew bootstrap. A stale index.html that
      references hashed build chunks the current deploy deleted leaves a blank
      page whose own bundle (ErrorBoundary, service worker, stale-client
      detector) never runs. /asset-skew.js is the one piece of the app that
      still executes in that state, so it MUST load before the module entry
      below (vite hoists that entry into <head> at build time) and MUST be a
      stable, un-hashed URL -- a content-hashed copy would itself be the
      victim of the skew it exists to recover from. Kept out of the precache
      and served no-cache (docker/nginx.conf, frontend/nginx.conf).
    -->
    <script src="/asset-skew.js"></script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/fonts.css" />
    <title>Mycorrhizal CRM</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
    <!--
      COMPAT-02 (issue #473): the app bundle is an ES module (the script
      above), so a browser released before ES module support (~2017-18 --
      well under the documented Chrome/Edge/Firefox >=111, Safari >=16.4
      floor in docs/development/supported-runtime-matrix.md) skips that
      script entirely and never even requests it. With no fallback that used
      to render a permanently blank white page with zero indication why --
      not even a console error, since the browser silently ignores a script
      type it doesn't recognize. `nomodule` is the mirror-image attribute:
      only a browser WITHOUT module support runs this one, so the two are
      mutually exclusive by construction and no version sniffing is needed.
      This is a separate file (public/unsupported-browser.js, served
      same-origin) rather than an inline script because docker/nginx.conf's
      CSP is `script-src 'self'` with no `'unsafe-inline'` -- an inline
      nomodule block would be silently dropped by exactly the CSP-aware
      browsers just below the floor, defeating the fallback.
    -->
    <script nomodule src="/unsupported-browser.js"></script>
  </body>
</html>
