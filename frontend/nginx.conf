server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Unlike docker/nginx.conf (the all-in-one image), this split-frontend image
    # does NOT emit Strict-Transport-Security: it has no env-var gate (plain CMD,
    # no entrypoint), and its default deployment may be plain HTTP. Deploy behind
    # a TLS-terminating proxy that adds HSTS itself. Keep the other headers in
    # step with docker/nginx.conf.

    # Health check proxy - forward to backend. Prefix match: also covers
    # /health/live and /health/ready (issue #421); nginx rewrites the matched
    # "/health" prefix to the proxy_pass URI, preserving the subpath.
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API proxy - forward requests to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # CardDAV well-known discovery
    location /.well-known/carddav {
        return 301 /carddav/;
    }

    # CardDAV proxy - forward to backend
    location /carddav/ {
        proxy_pass http://backend:8080/carddav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        
        # Support WebDAV methods
        proxy_method $request_method;
        
        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Don't buffer for streaming
        proxy_buffering off;
        
        # Ensure UTF-8 charset for vCard responses
        charset utf-8;
        charset_types text/vcard text/xml application/xml;
    }

    # CalDAV well-known discovery
    location /.well-known/caldav {
        return 301 /caldav/;
    }

    # CalDAV proxy - forward to backend (T12b: serve Interactions/LifeEvents)
    location /caldav/ {
        proxy_pass http://backend:8080/caldav/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass Authorization header for Basic Auth
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        # Support WebDAV methods
        proxy_method $request_method;

        # Timeouts for potentially slow sync operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Don't buffer for streaming
        proxy_buffering off;

        # Ensure UTF-8 charset for iCalendar responses
        charset utf-8;
        charset_types text/calendar text/xml application/xml;
    }

    # SPA fallback - serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The service worker script and the app shell must never be served stale.
    # Kept in step with docker/nginx.conf (the all-in-one image) -- this file
    # serves the separately published -frontend image, and a fix applied to
    # only one of the two leaves half the deployments broken.
    #
    # Both would otherwise be caught by the 1-year immutable rule below (the
    # regex matches any *.js, and index.html is served through it via the SPA
    # fallback). For a hashed bundle chunk that is correct; for these two it is
    # how a deployment gets stuck. An exact-match location takes precedence
    # over a regex one in nginx, so these win.
    location = /service-worker.js {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    # Issue #476 (WEB-02): the service-worker escape hatch. /_recovery.html is
    # a standalone static page (backed by /_recovery.js) that clears every
    # CacheStorage bucket and unregisters the service worker -- the way out for
    # a user stranded on a broken worker/cache by a bad deploy. It must always
    # come from the network, never from an HTTP cache, so no-store here. It is
    # also excluded from the SW's precache manifest at build time
    # (frontend/vite.config.ts globIgnores), and the app's service worker is
    # written to skip /_* navigations (frontend/src/service-worker.ts), so this
    # stays reachable even while a broken worker controls the tab. The files
    # ship in the build (frontend/public/_recovery.{html,js}).
    location = /_recovery.html {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    location = /_recovery.js {
        expires off;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    # RFC 9116 vulnerability disclosure (issue #363). The SPA fallback above
    # would otherwise swallow this path and serve index.html, so the file is
    # served straight off disk via an exact-match location. The file ships in
    # the build (frontend/public/.well-known/security.txt). Do NOT remove this
    # block as dead config - it is the machine-readable disclosure endpoint
    # scanners and researchers probe. Kept in step with docker/nginx.conf.
    location = /.well-known/security.txt {
        default_type text/plain;
        expires off;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }

    # Cache static assets
    # Note: add_header directives must be repeated here because nginx does not
    # inherit server-level add_header when a location block defines its own.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }
}
